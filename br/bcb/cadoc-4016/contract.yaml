# Contrato do Cadoc 4016 — Balanço Patrimonial Analítico.
#
# QUEM CURA: a Lerian, a partir do leiaute oficial 4010/4016 (um documento só,
# schema/leiaute-4010-4016.pdf) e do COSIF. Referências "L p.N" são desse leiaute.
#
# RELAÇÃO COM O 4010: é o MESMO balanço, com duas diferenças que o próprio leiaute
# enuncia — periodicidade SEMESTRAL (§2.1.4) e a exclusão dos grupos de RESULTADO,
# porque um Balanço representa a posição contábil DEPOIS de apurado o resultado do
# exercício. Tudo o mais — grão, natureza do saldo, formato — é idêntico ao 4010.
#
# O motor confia neste contrato. Não há conferência contra o XSD do BACEN em tempo
# de execução: o XSD fica no repositório como fonte de curadoria.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentContract

metadata:
  id: br.bcb.cadoc-4016
  country: BR
  regulator: BCB
  document: "4016"
  title: Balanço Patrimonial Analítico
  version: 1.0.0
  status: draft
  appliesTo:
    institutionTypes: [IP, SCD, SCFI]
  periodicity: semiannual     # §2.1.4 — o 4010 é mensal, o 4016 semestral
  sourceOfTruth:
    layoutManual: https://www.bcb.gov.br/content/estabilidadefinanceira/cosif_leiautes/Leiaute_4010_xmlV0.pdf
    schema: schema/leiaute-4010-4016.pdf   # material de curadoria, não é executado

parameters:
  - name: dataBase
    type: month              # AAAA-MM
    required: true
    # O 4016 é esperado APENAS para junho e dezembro (L §2.1.4). Diferente do
    # `domain` de um enum fechado, aqui restringimos o MÊS de um valor aberto: só
    # AAAA-06 e AAAA-12 são aceitos. Sem isto, um 4016 para 2026-01 é gerável e o
    # BACEN o rejeita.
    allowedMonths: ["06", "12"]
    description: Data-base do balanço — apenas junho ou dezembro.

  - name: tipoRemessa
    type: string
    required: true
    default: I
    domain: [I, S]           # I = inclusão, S = substituição (XSD)
    description: Natureza da remessa ao BACEN.

datasets:
  - name: institution
    description: Identificação da instituição declarante.
    grain: singleton
    fields:
      - name: cnpj8
        type: string
        length: 8
        required: true
        # Alfanumérico: o CNPJ alfanumérico entra em vigor e a raiz deixa de ser
        # garantidamente numérica. Não restringir a dígitos.
        pattern: '^[A-Za-z0-9]{8}$'
        description: Raiz do CNPJ (oito primeiras posições).

  - name: cosif_balances
    description: Saldo de fechamento por rubrica COSIF na data-base, SEM as contas de resultado.
    grain: [cosifCode]
    means: >-
      MESMO conjunto do 4010, com uma restrição de conteúdo que o leiaute impõe:
      não é esperada a presença das contas dos grupos 7 (Receitas) e 8 (Despesas),
      porque o Balanço representa a posição APÓS a apuração do resultado do
      exercício (L p.6). Filtrar essas rubricas é regra de EXTRAÇÃO, então vive na
      consulta do binding; a regra abaixo confere no arquivo pronto.
    fields:
      - name: cosifCode
        type: string
        required: true
        # Dez dígitos desde jan/2025 (IN BCB 426-433); oito na grafia anterior.
        pattern: '^[0-9]{10}$|^[0-9]{8}$'
        normalize: digits
        description: Rubrica patrimonial ou de compensação do elenco COSIF.

      - name: saldo
        type: decimal
        required: true
        format:
          scale: 2
          scaleIsExact: true   # o XSD declara fractionDigits como MÁXIMO — 0 passa
          decimalSeparator: "."
          groupSeparator: ""
        means: >-
          Saldo de fechamento no último dia útil do mês (L p.6), expresso na
          NATUREZA DA PRÓPRIA CONTA. A convenção crédito-menos-débito do razão não
          deve vazar para o arquivo. O motor não confere o sinal — quem confere é o
          cliente no rascunho, antes de aprovar.
        description: Saldo da rubrica em reais na data-base.

rules:
  - id: no-duplicate-account
    severity: error
    appliesTo: cosif_balances
    assert: unique(cosifCode)
    message: Uma linha por rubrica; duplicidade indica agrupamento errado no binding.

  - id: sem-contas-de-resultado
    severity: error
    appliesTo: cosif_balances.cosifCode
    # O primeiro dígito da rubrica é o grupo COSIF. 7 e 8 são resultado.
    assert: firstDigitNotIn(cosifCode, "7", "8")
    message: >-
      O 4016 é a posição após a apuração do resultado, então não admite contas dos
      grupos 7 (Receitas) nem 8 (Despesas) (L p.6). A presença de uma indica que o
      filtro do binding não excluiu o resultado.

  - id: zero-balance-optional
    severity: info
    appliesTo: cosif_balances
    assert: always
    message: >-
      Rubrica com saldo zero pode ser omitida (L p.6). Emitir ou não é decisão do
      cliente; as duas formas são aceitas.

knownGaps:
  - id: natureza-contabil-nao-vem-da-fonte
    description: >-
      Idêntico ao 4010: o sinal do saldo depende da natureza da conta, que é
      propriedade do plano de contas, e o Midaz não a expõe hoje
      (operation.route_code sem o lado devedor/credor). O binding declara a
      natureza como configuração do cliente; a lacuna é do Midaz.

  - id: elenco-cosif-ausente
    description: >-
      Como no 4010, não há regra conferindo que a rubrica existe no elenco COSIF
      vigente — isso é obrigação da fonte. O pattern confere forma, não existência.

  - id: ordem-sequencial-de-data-base
    description: >-
      O leiaute exige critério SEQUENCIAL: o BACEN só recepciona a data-base N se a
      N-1 (junho antes de dezembro, dezembro antes do junho seguinte) já foi aceita
      (§2.1.4). Isso é regra de protocolo de remessa, não da forma do arquivo; entra
      quando a etapa de remessa existir. A restrição de meses (allowedMonths) fica no
      parâmetro porque essa SIM é conferível na geração.
