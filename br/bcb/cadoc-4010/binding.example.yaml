# Binding do Cadoc 4010 — QUEM PREENCHE É O CLIENTE.
#
# É o único dos três arquivos que fala de base, tabela e coluna. O contrato diz o
# que o arquivo precisa; o template diz onde aparece; este diz DE ONDE VEM e COMO
# É EXTRAÍDO.
#
# Exemplo preenchido contra o Midaz, para mostrar o encaixe. Um cliente com razão
# próprio preenche as mesmas chaves apontando para o esquema dele — contrato e
# template não mudam. Esse é o ponto de toda a separação.
#
# A UNIDADE AQUI É A CONSULTA, NÃO O CAMPO. Uma consulta traz vários campos de uma
# vez, e um agrupamento com soma não teria como ser expresso campo a campo sem
# repetir o mesmo `groupBy` em cada um. Cada consulta é NOMEADA: hoje elas vivem
# neste arquivo, e quando a mesma consulta servir vários documentos — a de
# identificação da instituição serve todos — ela é movida para um arquivo
# compartilhado sem reescrever nada, porque os campos já a referenciam por nome.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentBinding

contract: br.bcb.cadoc-4010
contractVersion: 1.2.1     # o catálogo pode publicar 1.1.0 sem mudar o que este
                           # cliente gera até ele adotar

# ---------------------------------------------------------------------------
# Consultas
#
# Cada uma extrai um conjunto de linhas da origem. Vocabulário reaproveitado do
# product-console: `dataSource` é o configName da fonte, `table` é a chave da
# tabela (`schema__tabela` no PostgreSQL, nome puro no MongoDB), e os operadores
# de filtro são os mesmos que o Reporter já aceita na API de relatórios —
# eq, gt, gte, lt, lte, between, in, nin.
# ---------------------------------------------------------------------------
queries:
  - name: saldos_cosif
    description: Lançamentos do razão, agregados em saldo por rubrica.
    dataSource: midaz_transaction
    table: operation

    filters:
      # SÓ O QUE MOVEU SALDO, SÓ EM REAIS. Uma transação NOTED (anotação) grava
      # operações com a rubrica da rota, valor ZERO e `balance_affected = false`:
      # não altera saldo, mas faria a rubrica aparecer como linha de 0,00 sem nunca
      # ter sido lançada. E um ledger do Midaz pode ter outros ativos além do BRL,
      # que não são lançamento em reais. Nenhum dos dois é lançamento deste
      # documento.
      - field: balance_affected
        operator: eq
        values: ["true"]
      - field: asset_code
        operator: eq
        values: ["BRL"]

    # A agregação vive aqui e não no contrato porque depende da forma da origem:
    # um cliente que já mantém tabela de saldos por rubrica não agrega nada, ele
    # lê — e o contrato dos dois é o mesmo.
    aggregate:
      groupBy: [route_code]
      measures:
        - as: saldo
          fn: sum
          of: amount
          # Soma COM SINAL: no razão o lançamento a débito entra negativo, e a
          # coluna que diz o lado é esta.
          # A CHAVE É O LADO, O VALOR É A GRAFIA QUE O DADO USA. `debit: "debit"`
          # lê-se "a linha cuja coluna direction carrega 'debit' é um débito, e
          # débito subtrai". Escrever `debit: "-"` afirma que a coluna carrega o
          # caractere '-' — no Midaz ela carrega 'debit' ou 'credit'
          # (validateOperationDirection), nenhuma linha casaria, e o motor recusa o
          # relatório INTEIRO em vez de somar pela metade.
          sign:
            column: direction
            debit: "debit"
            credit: "credit"
          # Reexpressa o resultado na natureza da própria conta, senão toda conta
          # de ativo sai negativa no arquivo.
          #
          # A natureza é propriedade do PLANO DE CONTAS, não do gerador de arquivo
          # nem do catálogo. Ela está aqui porque é dado do cliente: é o plano de
          # contas DELE que diz quais contas são devedoras.
          #
          # POR QUE ESTAS NOVE LINHAS EXISTEM, e quando elas somem.
          #
          # O Midaz TEM onde guardar isto: as rotas contábeis são o plano de contas
          # dele. Uma `operation_route` declara, por ação, a rubrica que recebe o
          # débito e a que recebe o crédito, cada uma com código e descrição; cada
          # lançamento carrega `operation.route_code`, que o liga à rota, e
          # `operation.type`, que diz de que lado ele entrou.
          #
          # Então, se o cliente referenciou o COSIF corretamente nas rotas, a
          # natureza segue do próprio código da rubrica — e é isso que o mapa
          # abaixo faz, lendo o primeiro dígito. Ele é atalho de LEITURA do código,
          # não fonte de verdade: quem sabe a natureza é o plano de contas.
          #
          # Um cliente que já mantenha a natureza como coluna própria troca este
          # bloco por essa coluna e nada mais muda. O motor e o catálogo seguem sem
          # saber o que é natureza contábil, que é o ponto de ela estar aqui.
          statedIn:
            # Grupos de 1º nível do plano COSIF. Nove linhas, não uma tabela de
            # milhares de rubricas: quem tem exceção acrescenta a rubrica inteira.
            # A exceção que todo plano tem é a RETIFICADORA — provisão para
            # operações de crédito (1.6.9), depreciação acumulada — credora dentro
            # de um grupo devedor. Declarada só pelo grupo, ela sai com o sinal
            # trocado, num arquivo bem formado. Declare-a pelo prefixo dela
            # (`"169": credit`): vale o prefixo MAIS LONGO que casa com a rubrica.
            natureByPrefix:
              "1": debit    # Circulante e Realizável a Longo Prazo
              "2": debit    # Permanente
              "3": debit    # Compensação devedora
              "4": credit   # Circulante e Exigível a Longo Prazo
              "5": credit   # Resultados de Exercícios Futuros
              "6": credit   # Patrimônio Líquido
              "7": credit   # Contas de Resultado Credoras
              "8": debit    # Contas de Resultado Devedoras
              "9": credit   # Compensação credora
            key: route_code

      accumulate:
        # A coluna que carrega o momento do lançamento. `until` nomeia o instante;
        # esta nomeia onde ele é lido. No Midaz é o carimbo de criação da operação;
        # um razão próprio guarda isso com o nome dele.
        on: created_at
        until: system.dataBase
        # Estoque: a janela abre no começo do razão, então o saldo de fechamento
        # carrega tudo que já foi lançado — inclusive os lançamentos de abertura
        # que a migração de um sistema anterior postou. Um volume que reinicia a
        # cada mês declararia `from: month`.
        from: opening

# ---------------------------------------------------------------------------
# Conjuntos
#
# Amarra o resultado das consultas aos conjuntos e campos que o contrato declara.
# Um campo se resolve por `query`, `constant`, `parameter`, `manual` ou
# `institution`. `constant`, `parameter` e `manual` existem para que a falta de
# origem nunca impeça a geração: o arquivo sai como rascunho e o cliente completa
# antes de aprovar.
# ---------------------------------------------------------------------------
datasets:
  institution:
    # Sem consulta: a raiz do CNPJ vem da instituição que a entrega declara, então
    # cada tenant entrega com o próprio CNPJ e nenhum valor fixo fica no binding.
    fields:
      cnpj8:
        from: institution
        institution: cnpj8

  cosif_balances:
    from:
      query: saldos_cosif
    fields:
      cosifCode:
        from: query
        # No Midaz o plano de contas do cliente é materializado aqui: a rota de
        # operação carrega a rubrica contábil cadastrada em operation_route.
        column: route_code
      saldo:
        from: query
        column: saldo        # a medida nomeada em `aggregate.measures[].as`

# Campos que o cliente decidiu completar à mão antes de enviar. Vazio aqui.
manualOverrides: []
