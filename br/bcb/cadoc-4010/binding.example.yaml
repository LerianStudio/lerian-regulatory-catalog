# Binding do Cadoc 4010 — QUEM PREENCHE É O CLIENTE.
#
# É o único dos três arquivos que fala de base, tabela e coluna. O contrato diz o
# que o arquivo precisa; o template diz onde aparece; este diz DE ONDE VEM e COMO
# É EXTRAÍDO.
#
# Exemplo preenchido contra o Midaz, para mostrar o encaixe. Um cliente com razão
# próprio preenche as mesmas chaves apontando para o esquema dele — contrato e
# template não mudam. Esse é o ponto de toda a separação.
#
# A UNIDADE AQUI É A CONSULTA, NÃO O CAMPO. Uma consulta traz vários campos de uma
# vez, e um agrupamento com soma não teria como ser expresso campo a campo sem
# repetir o mesmo `groupBy` em cada um. Cada consulta é NOMEADA: hoje elas vivem
# neste arquivo, e quando a mesma consulta servir vários documentos — a de
# identificação da instituição serve todos — ela é movida para um arquivo
# compartilhado sem reescrever nada, porque os campos já a referenciam por nome.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentBinding

contract: br.bcb.cadoc-4010
contractVersion: 1.0.0     # o catálogo pode publicar 1.1.0 sem mudar o que este
                           # cliente gera até ele adotar

# ---------------------------------------------------------------------------
# Consultas
#
# Cada uma extrai um conjunto de linhas da origem. Vocabulário reaproveitado do
# product-console: `dataSource` é o configName da fonte, `table` é a chave da
# tabela (`schema__tabela` no PostgreSQL, nome puro no MongoDB), e os operadores
# de filtro são os mesmos que o Reporter já aceita na API de relatórios —
# eq, gt, gte, lt, lte, between, in, nin.
# ---------------------------------------------------------------------------
queries:
  - name: saldos_cosif
    description: Lançamentos do razão, agregados em saldo por rubrica.
    dataSource: midaz_transaction
    table: operation

    # Recorte de linhas ANTES de agregar.
    filters:
      - field: status
        operator: eq
        values: ["APPROVED"]

    # A agregação vive aqui e não no contrato porque depende da forma da origem:
    # um cliente que já mantém tabela de saldos por rubrica não agrega nada, ele
    # lê — e o contrato dos dois é o mesmo.
    aggregate:
      groupBy: [route_code]
      measures:
        - as: saldo
          fn: sum
          of: amount
          # Soma COM SINAL: no razão o lançamento a débito entra negativo, e a
          # coluna que diz o lado é esta.
          sign:
            column: direction
            debit: "-"
            credit: "+"
          # Reexpressa o resultado na natureza da própria conta, senão toda conta
          # de ativo sai negativa no arquivo.
          #
          # A natureza é propriedade do PLANO DE CONTAS, não do gerador de arquivo
          # nem do catálogo. Ela está aqui porque é dado do cliente: é o plano de
          # contas DELE que diz quais contas são devedoras.
          #
          # LACUNA CONHECIDA: o Midaz não expõe natureza hoje. O que existe é
          # `operation.route_code`, materializado de `operation_route`, e nada
          # carrega o lado devedor/credor da conta. Enquanto o Midaz não expuser,
          # o cliente declara aqui — o que é verboso mas está na camada certa.
          # Quando expuser, isto vira mais uma coluna da consulta e estas linhas
          # somem. Contornar no motor ou no catálogo congelaria a lacuna e criaria
          # a segunda fonte de verdade que a separação existe para evitar.
          statedIn:
            # Grupos de 1º nível do plano COSIF. Nove linhas, não uma tabela de
            # milhares de rubricas: quem tem exceção acrescenta a rubrica inteira.
            natureByPrefix:
              "1": debit    # Circulante e Realizável a Longo Prazo
              "2": debit    # Permanente
              "3": debit    # Compensação devedora
              "4": credit   # Circulante e Exigível a Longo Prazo
              "5": credit   # Resultados de Exercícios Futuros
              "6": credit   # Patrimônio Líquido
              "7": credit   # Contas de Resultado Credoras
              "8": debit    # Contas de Resultado Devedoras
              "9": credit   # Compensação credora
            key: route_code

      # Estoque: acumula desde a abertura até o fechamento da data-base. O corte
      # referencia o parâmetro de geração declarado no contrato.
      accumulate:
        until: system.dataBase

# ---------------------------------------------------------------------------
# Conjuntos
#
# Amarra o resultado das consultas aos conjuntos e campos que o contrato declara.
# Um campo se resolve de quatro formas — `query`, `constant`, `parameter` ou
# `manual` — e as três últimas existem para que a falta de origem nunca impeça a
# geração: o arquivo sai como rascunho e o cliente completa antes de aprovar.
# ---------------------------------------------------------------------------
datasets:
  institution:
    # Sem consulta: a raiz do CNPJ é cadastral e estável, então vale um valor
    # fixo. O contrato pede grão `singleton` e uma linha de constantes o atende.
    fields:
      cnpj8:
        from: constant
        value: "12345678"

  cosif_balances:
    from:
      query: saldos_cosif
    fields:
      cosifCode:
        from: query
        # No Midaz o plano de contas do cliente é materializado aqui: a rota de
        # operação carrega a rubrica contábil cadastrada em operation_route.
        column: route_code
      saldo:
        from: query
        column: saldo        # a medida nomeada em `aggregate.measures[].as`

# Campos que o cliente decidiu completar à mão antes de enviar. Vazio aqui.
manualOverrides: []
