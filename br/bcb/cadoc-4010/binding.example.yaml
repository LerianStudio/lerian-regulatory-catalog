# Binding do Cadoc 4010 — QUEM PREENCHE É O CLIENTE.
#
# É o único dos três arquivos que fala de base, tabela e coluna. O contrato diz o
# que o arquivo precisa; o template diz onde aparece; este diz DE ONDE VEM e COMO
# É EXTRAÍDO.
#
# Exemplo preenchido contra o Midaz, para mostrar o encaixe. Um cliente com razão
# próprio preenche as mesmas chaves apontando para o esquema dele — contrato e
# template não mudam. Esse é o ponto de toda a separação.
#
# A UNIDADE AQUI É A CONSULTA, NÃO O CAMPO. Uma consulta traz vários campos de uma
# vez, e um agrupamento com soma não teria como ser expresso campo a campo sem
# repetir o mesmo `groupBy` em cada um. Cada consulta é NOMEADA: hoje elas vivem
# neste arquivo, e quando a mesma consulta servir vários documentos — a de
# identificação da instituição serve todos — ela é movida para um arquivo
# compartilhado sem reescrever nada, porque os campos já a referenciam por nome.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentBinding

contract: br.bcb.cadoc-4010
contractVersion: 1.6.0     # o catálogo pode publicar outra versão sem mudar o que
                           # este cliente gera até ele adotar

# ---------------------------------------------------------------------------
# Consultas
#
# Cada uma extrai um conjunto de linhas da origem. Vocabulário reaproveitado do
# product-console: `dataSource` é o configName da fonte, `table` é a chave da
# tabela (`schema__tabela` no PostgreSQL, nome puro no MongoDB), e os operadores
# de filtro são os mesmos que o Reporter já aceita na API de relatórios —
# eq, gt, gte, lt, lte, between, in, nin, startsWith, notStartsWith, isNull, notNull.
# Um valor de filtro pode vir de um parâmetro da geração: `{parameter: dataBase}`,
# ou uma ponta do período que ele nomeia, `{parameter: dataBase, at: end}`.
#
# ESTE ARQUIVO SÓ LÊ. Em que natureza cada saldo sai e o que precisa valer no
# arquivo são regras do contrato (`rules`), que o motor aplica depois da leitura.
# ---------------------------------------------------------------------------
queries:
  - name: declarante
    description: A organização do Midaz, que é a instituição declarante — o CNPJ dela é o do arquivo.
    dataSource: midaz_onboarding
    table: organization
    # Qual organização: o escopo da instituição, que filtra organization.id pela
    # organização da entrega. Sem escopo a leitura traria todas, e o conjunto de
    # uma linha só recusa a geração em vez de escolher uma.
    filters:
      # Uma organização apagada não declara nada.
      - field: deleted_at
        operator: isNull

  - name: saldos_cosif
    description: Lançamentos do razão, agregados em saldo por rubrica.
    dataSource: midaz_transaction
    table: operation

    filters:
      # SÓ O QUE MOVEU SALDO, SÓ EM REAIS. Uma transação NOTED (anotação) grava
      # operações com a rubrica da rota, valor ZERO e `balance_affected = false`:
      # não altera saldo, mas faria a rubrica aparecer como linha de 0,00 sem nunca
      # ter sido lançada. E um ledger do Midaz pode ter outros ativos além do BRL,
      # que não são lançamento em reais. Nenhum dos dois é lançamento deste
      # documento.
      - field: balance_affected
        operator: eq
        values: ["true"]
      - field: asset_code
        operator: eq
        values: ["BRL"]
      # Só o que o Midaz não apagou: as leituras do próprio Midaz filtram
      # deleted_at IS NULL, e o documento lê o mesmo razão que ele.
      - field: deleted_at
        operator: isNull
      # ATÉ O FIM DA DATA-BASE, pelo calendário de dias úteis do contrato: o saldo
      # é o do último dia útil do mês (leiaute §3.2.2.b), e o que for lançado num
      # sábado que fecha o mês é do mês seguinte. Sem limite inferior: o saldo de
      # fechamento carrega tudo que já foi lançado, inclusive a abertura que a
      # migração de um sistema anterior postou.
      - field: created_at
        operator: lt
        values: [{parameter: dataBase, at: end, calendar: business}]

    # A NATUREZA QUE O MIDAZ REGISTRA PARA CADA CONTA, guardada no saldo
    # (`balance.direction`, do `defaultDirection` do tipo de conta). O join a traz
    # para cada lançamento, pelo saldo que ele moveu; o contrato a confere contra o
    # elenco COSIF (regra `natureza-registrada`).
    join:
      - table: balance
        match: {balance_id: id}
        columns: {natureza: direction}

    # O VALOR DE CADA LANÇAMENTO NO RAZÃO: no Midaz a coluna `direction` diz o lado,
    # e um débito entra negativo. A chave é o VALOR QUE A COLUNA CARREGA ('debit' ou
    # 'credit', validateOperationDirection); um lado que nenhum caso lista recusa a
    # geração inteira em vez de somar pela metade.
    compute:
      - as: valor_no_razao
        case:
          column: direction
          when:
            credit: {column: amount}
            debit: {negate: amount}
          otherwise: refuse

    # A agregação vive aqui e não no contrato porque depende da forma da origem:
    # um cliente que já mantém tabela de saldos por rubrica não agrega nada, ele
    # lê — e o contrato dos dois é o mesmo. Agrupa também pela natureza registrada,
    # para que uma conta com duas naturezas apareça como duas linhas e seja recusada.
    aggregate:
      groupBy: [route_code, natureza]
      measures:
        - as: saldo
          fn: sum
          of: valor_no_razao

# ---------------------------------------------------------------------------
# Conjuntos
#
# Amarra o resultado das consultas aos conjuntos e campos que o contrato declara.
# Um campo se resolve por `query`, `constant`, `parameter` ou `manual`. `constant`, `parameter` e `manual` existem para que a falta de
# origem nunca impeça a geração: o arquivo sai como rascunho e o cliente completa
# antes de aprovar.
# ---------------------------------------------------------------------------
datasets:
  institution:
    # O CNPJ vem da organização do Midaz (legal_document); a raiz que o arquivo
    # leva é derivada pelo contrato (cnpj8: prefixOf cnpj).
    from:
      query: declarante
    fields:
      cnpj:
        from: query
        column: legal_document

  cosif_balances:
    from:
      query: saldos_cosif
    fields:
      cosifCode:
        from: query
        # No Midaz o plano de contas do cliente é materializado aqui: a rota de
        # operação carrega a rubrica contábil cadastrada em operation_route.
        column: route_code
      saldo:
        from: query
        column: saldo        # a medida nomeada em `aggregate.measures[].as`
      naturezaRegistrada:
        from: query
        column: natureza     # trazida pelo join com balance

# Campos que o cliente decidiu completar à mão antes de enviar. Vazio aqui.
manualOverrides: []
