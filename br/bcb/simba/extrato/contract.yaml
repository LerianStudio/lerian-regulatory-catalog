# Contrato do arquivo IV EXTRATO do SIMBA (IN BCB 636/2025).
#
# QUEM CURA: a Lerian, a partir da transcricao oficial da IN BCB 636/2025 em
# br/bcb/simba/normas/IN-BCB-636-2025.md ("IN :N" abaixo e a linha dessa copia).
# Leiaute: art. 2o, IV (IN :33), art. 2o, § 3o (IN :53), art. 3o (IN :57-73),
# Anexo I, arquivo IV Extrato, campos 1 a 27 (IN :165-196) e Anexo II (IN :363+).
#
# O QUE E: uma linha por lancamento das contas investigadas no periodo do
# afastamento do sigilo. O numero do lancamento (campo 1) liga a linha as do
# ORIGEM-DESTINO: os dois documentos leem o MESMO conjunto `lancamentos`, na mesma
# ordem, e numeram do mesmo jeito.
#
# FORMA DO ARQUIVO (IN art. 3o): texto ASCII, sem cabecalho, colunas separadas
# por TAB, linha terminada em CR LF, datas ddmmaaaa no dia de Brasilia, hora
# hhmmss em UTC (IN :69), valores em centavos sem separador (IN :73). A forma e
# do template; o formato de cada campo esta aqui.
#
# DE ONDE VEM CADA CAMPO: lancamento, valor, natureza e saldo apos o lancamento da
# tabela `operation` do Midaz; descricao da operacao ou, vazia, da transacao;
# agencia, conta e tipo do CRM; a metadata da transacao (rail, flow, direction dos
# plugins; chaves proprias do Pix lerian) e a da operacao (feeLeg) do Mongo do
# Midaz decidem o codigo do Anexo II; CNPJ da organizacao do Midaz; COMPE, nome no
# Unicad e canal preenchidos pelo cliente no mapeamento.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentContract

metadata:
  id: br.bcb.simba.extrato
  country: BR
  regulator: BCB
  document: EXTRATO          # o nome do arquivo na IN 636 art. 2º (AGENCIAS, CONTAS, TITULARES, EXTRATO, ORIGEM-DESTINO)
  family: simba
  title: SIMBA — Extrato
  summary: >-
    Lançamentos das contas investigadas no período do afastamento do sigilo, com valor,
    natureza, saldo após o lançamento e o código do tipo de lançamento do Anexo II.
  version: 1.1.0
  status: draft
  output: txt
  timezone: America/Sao_Paulo
  appliesTo:
    institutionTypes: [IP, SCD, SCFI]
  periodicity: eventual
  layout:
    version: "IN BCB 636/2025"
    mandatoryFrom: "2026-12-01"
  sourceOfTruth:
    layoutManual: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=636

parameters:
  - name: caso
    type: string
    required: true
    pattern: '^[0-9]{3}-[A-Z]{2,6}-[0-9]{6}-[0-9]{2}$'
    description: Número do caso SIMBA, como está na ordem.
  - name: documentos
    type: string
    multiple: true
    required: true
    description: >-
      CPFs e CNPJs da ordem, somente dígitos, sem pontos, traços ou barras: o documento formatado não encontra
      contas, e o caso sai como resposta vazia para ele, sem erro.
  - name: contas
    type: string
    multiple: true
    required: false
    description: >-
      Números de conta da ordem, com DV, só dígitos. Preencher só quando o ofício restringir a contas específicas; o
      normal é não preencher (ausente, todas as contas dos documentos). Preencher sem a ordem pedir omite contas do
      investigado.
  - name: inicio
    type: date
    required: true
    description: Primeiro dia do afastamento do sigilo.
  - name: fim
    type: date
    closed: true
    required: true
    notBefore: inicio
    description: Último dia do afastamento do sigilo.

filing:
  period: [caso]
  # Uma ordem pode ser gerada de novo (dado corrigido, cadastro completado). So a
  # geracao mais nova do mesmo caso pode ser aprovada: aprovar uma anterior
  # entregaria ao orgao o arquivo que a correcao ja substituiu.
  approve: newest
  # Conta do caso sem lancamento no periodo sai no CONTAS com o campo 7 = 2 (IN :126) e nao
  # tem linha aqui; sem lancamento em nenhuma conta do caso, o arquivo sai vazio (0 byte),
  # sem cabecalho (IN art. 3o, I, :59), e e entregue assim.
  allowEmpty: true

datasets:
  # Os campos 2, 15, 16 e 17 sao da instituicao e se repetem em toda linha (IN :171,
  # :184, :185, :186).
  - name: instituicao
    description: A instituição que responde ao caso, uma linha.
    grain: singleton
    fields:
      - name: compe
        type: string
        required: true
        pattern: '^[0-9]{3}$'
        description: Código Compe da instituição, ou 999 quando ela não tem (IN 636, Anexo I, EXTRATO, campo 2).
      - name: cnpj
        type: string
        length: 14
        required: true
        normalize: alphanumeric
        identifiesInstitution: true
        pattern: '^[0-9A-Z]{14}$'
        description: CNPJ da instituição (IN 636, Anexo I, EXTRATO, campo 15).
      - name: nomeUnicad
        type: string
        required: true
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Nome da instituição como está no Unicad (IN 636, Anexo I, EXTRATO, campo 16). O template o corta em 50 posições.
      - name: interfaceTransacao
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
        description: Canal das transações no código da IN (IN 636, Anexo I, EXTRATO, campo 17). Nenhuma aplicação Lerian registra o canal por lançamento; o cliente declara um só.

  # O CONJUNTO QUE O ORIGEM-DESTINO TAMBEM LE, igual nos dois contratos: o numero do
  # lancamento e a posicao dele aqui. A consulta que o entrega agrupa por
  # (transacao, operacao, ...), o que fixa a ordem das linhas; cada operacao e um grupo.
  - name: lancamentos
    description: Os lançamentos das contas do caso no período, um por operação, na ordem da consulta.
    grain: [transacaoId, operacaoId]
    consolidation:
      key: [transacaoId, operacaoId]
      whenKeyRepeats: refuse
      columns: {contaId: first, numeroAgencia: first, numeroConta: first, tipoConta: first,
                dataLancamento: first, horaLancamento: first, descricao: first, descricaoTransacao: first,
                valor: first, natureza: first, naturezaOposta: first, tipoOperacao: first, saldoApos: first, chaveSaldo: first, bloqueadoApos: first,
                chequeEspecialApos: first, rail: first, fluxo: first, direcao: first,
                agregado: first, tipoPagamento: first, tipoIniciacao: first, e2eEnvio: first,
                iniciacao: first, e2eRecebimento: first, devolucao: first, e2eOriginal: first,
                saldoAntes: first, origem: first, sistemaOrigem: first}
    fields:
      - name: operacaoId
        type: string
        required: true
        description: A operação do Midaz. Não vai ao arquivo; identifica a linha e a perna de tarifa.
      - name: transacaoId
        type: string
        required: true
        description: A transação do Midaz. Não vai ao arquivo; liga o estorno, a metadata e a sessão (campo 27).
      - name: contaId
        type: string
        required: true
        description: A conta do Midaz do lançamento. Não vai ao arquivo.
      - name: numeroAgencia
        type: string
        required: true
        pattern: '^[0-9]{5}$'
        description: Número da agência sem DV, cinco dígitos; 00001 sem agência física (IN 636, Anexo I, EXTRATO, campo 3).
      - name: numeroConta
        type: string
        required: true
        pattern: '^[^\t\r\n]{1,20}$'
        description: Número da conta com o dígito verificador, como o CRM o guarda (IN 636, Anexo I, EXTRATO, campo 4).
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no código da IN (IN 636, Anexo I, EXTRATO, campo 5).
      - name: dataLancamento
        type: date
        required: true
        description: Data do lançamento, no dia civil de Brasília (IN 636, Anexo I, EXTRATO, campo 6).
      - name: horaLancamento
        type: string
        required: true
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|\+00:00)$'
        description: >-
          O instante do lançamento em UTC; o template escreve hhmmss (IN 636, Anexo I, EXTRATO, campo 23;
          IN 636, art. 3º, VI). Instante em outro fuso recusa a geração, em vez de sair a hora local.
      - name: descricao
        type: string
        required: false
        description: Descrição da operação no Midaz (IN 636, Anexo I, EXTRATO, campo 8). O template corta em 100 posições.
      - name: descricaoTransacao
        type: string
        required: false
        description: Descrição da transação no Midaz, usada quando a da operação vem vazia (campo 8).
      - name: valor
        type: decimal
        required: true
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Valor do lançamento em reais, sem sinal (IN 636, Anexo I, EXTRATO, campo 10). O template escreve centavos.
      - name: natureza
        type: string
        required: true
        domain: ["C", "D"]
        description: Natureza do lançamento, C crédito ou D débito (IN 636, Anexo I, EXTRATO, campo 11).
      - name: naturezaOposta
        type: string
        required: true
        domain: ["C", "D"]
        description: A natureza da outra perna (D para um crédito, C para um débito). Só o ORIGEM-DESTINO a lê.
      - name: tipoOperacao
        type: string
        required: true
        description: >-
          O tipo da operação no Midaz (operation.type): DEBIT, CREDIT, OVERDRAFT (a parcela do cheque especial), BLOCK e
          UNBLOCK (bloqueio e desbloqueio judicial) ou, na cobrança de dívida de tarifa, FEE_SETTLEMENT e FEE_REFUND, que o
          motor grava sem feeLeg e são perna de tarifa.
      - name: saldoApos
        type: decimal
        required: true
        description: >-
          Saldo disponível da conta após o lançamento, como o Midaz o gravou (nunca abaixo de zero). Com o bloqueado
          e o cheque especial usado, dá o saldo da conta dos campos 12 e 13 (IN 636, Anexo I, EXTRATO). Sem `format`:
          o template faz conta com ele, e o valor formatado chega cercado para impressão, não para conta.
      - name: chaveSaldo
        type: string
        required: false
        description: >-
          A chave de saldo da operação. Na chave overdraft (a parte de um saque tirada do cheque especial, ou a parte
          de um crédito que o paga), o saldo disponível gravado é a dívida, e o saldo da conta é menos ela.
      - name: bloqueadoApos
        type: decimal
        required: true
        description: Saldo bloqueado da conta após o lançamento (on_hold), somado ao disponível no campo 12.
      - name: chequeEspecialApos
        type: decimal
        required: false
        description: >-
          Cheque especial usado após o lançamento, do snapshot da operação; subtraído no campo 12. Ausente em
          operação gravada antes de o Midaz guardar o snapshot: conta 0, e a conferência lista o lançamento.
      - name: rail
        type: string
        required: false
        description: Trilho gravado pelo plugin na metadata da transação (TED, PIX, INTERNAL). Decide o campo 9.
      - name: fluxo
        type: string
        required: false
        description: Fluxo gravado pelo plugin (CASH_OUT, CASH_IN, P2P, REFUND, MED, AUTOMATIC_DEBIT). Decide o campo 9.
      - name: direcao
        type: string
        required: false
        description: Direção gravada pelo plugin em relação à conta do cliente (IN, OUT). Vazia, vale a natureza.
      - name: agregado
        type: string
        required: false
        description: Id do registro do plugin TED ou Pix JD que a transação liquida. Liga a contraparte do ORIGEM-DESTINO.
      - name: tipoPagamento
        type: string
        required: false
        description: payment_type do Pix lerian (PIX_IN no recebimento).
      - name: tipoIniciacao
        type: string
        required: false
        description: initiation_type do Pix lerian (MANUAL, DICT, QR_CODE, AUTO).
      - name: e2eEnvio
        type: string
        required: false
        pattern: '^[^\t\r\n]*$'
        description: end_to_end_id do envio do Pix lerian.
      - name: iniciacao
        type: string
        required: false
        description: initiation_id do envio do Pix lerian.
      - name: e2eRecebimento
        type: string
        required: false
        pattern: '^[^\t\r\n]*$'
        description: inbound_end_to_end_id do recebimento do Pix lerian.
      - name: devolucao
        type: string
        required: false
        description: refund_id da devolução do Pix lerian.
      - name: e2eOriginal
        type: string
        required: false
        description: original_end_to_end_id da devolução do Pix lerian.
      - name: saldoAntes
        type: decimal
        required: false
        description: >-
          Saldo disponível da conta antes da operação, como o Midaz o gravou. Só separa a operação do bloqueio cautelar
          que mexe no disponível (o bloqueio e a liberação) das que mexem só no bloqueado. Não vai ao arquivo.
      - name: origem
        type: string
        required: false
        description: >-
          origin da metadata da transação. balance-lock é a reserva do Block Balancer do Pix lerian (MED e bloqueio
          cautelar). Não vai ao arquivo.
      - name: sistemaOrigem
        type: string
        required: false
        description: >-
          origin_system da metadata da transação. Com origin balance-lock, antifraud-cautelar é o bloqueio cautelar do
          Pix recebido (IN 636, Anexo II, 167 e 276). Não vai ao arquivo.

  # Transacoes que sao revert de outra no Midaz (parent_transaction_id): o campo 9
  # sai 140 no debito e 264 no credito, antes de qualquer outra regra.
  - name: estornos
    description: As transações dos lançamentos que estornam outra transação.
    grain: [transacaoId]
    consolidation:
      key: [transacaoId]
      whenKeyRepeats: refuse
      columns: {}
    fields:
      - name: transacaoId
        type: string
        required: true
        description: A transação de estorno. Não vai ao arquivo.

  # Operacoes que o motor de tarifas do Midaz marcou com feeLeg = "true": o campo 9
  # sai 105 (tarifas), depois da regra do estorno.
  - name: taxas
    description: As operações dos lançamentos que são a perna de tarifa de uma transação.
    grain: [operacaoId]
    consolidation:
      key: [operacaoId]
      whenKeyRepeats: refuse
      columns: {}
    fields:
      - name: operacaoId
        type: string
        required: true
        description: A operação de tarifa. Não vai ao arquivo.

  # A devolucao do Pix lerian pelo MED (motivo FR01 ou BE08): o campo 9 sai 166 no
  # debito e 275 no credito (IN 636, Anexo II), em vez de 140 e 264.
  - name: devolucoes_med
    description: As devoluções do Pix lerian que são do MED.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {}
    fields:
      - name: referencia
        type: string
        required: false
        description: >-
          O id da devolução no Pix lerian (refund_id da metadata). Não vai ao arquivo. Opcional: o mapeamento de uma
          versão anterior, sem o conjunto, continua gerando, e a devolução do MED do Pix lerian sai 140/264.

  # O TxId do Pix (campo 26) pela linha do plugin que liquidou o Pix, a mesma que o
  # ORIGEM-DESTINO le (campo 28): um conjunto por plugin e sentido. A referencia e o E2E
  # (Pix lerian) ou o id da linha no plugin (Pix JD: o aggregateId da metadata).
  - name: trilho_pix_lerian_envios
    description: Os Pix enviados pelo Pix lerian.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {txid: first}
    fields:
      - name: referencia
        type: string
        required: true
        description: O E2E do Pix. Não vai ao arquivo.
      - name: txid
        type: string
        required: false
        pattern: '^[^\t\r\n]{1,35}$'
        description: TxId do Pix (TransactionIdentification; IN 636, Anexo I, EXTRATO, campo 26). Sem ele, o campo sai em branco.

  - name: trilho_pix_lerian_recebimentos
    description: Os Pix recebidos pelo Pix lerian.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {txid: first}
    fields:
      - name: referencia
        type: string
        required: true
        description: O E2E do Pix. Não vai ao arquivo.
      - name: txid
        type: string
        required: false
        pattern: '^[^\t\r\n]{1,35}$'
        description: TxId do Pix (TransactionIdentification; IN 636, Anexo I, EXTRATO, campo 26). Sem ele, o campo sai em branco.

  - name: trilho_pix_jd_envios
    description: Os Pix enviados pelo Pix JD.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {txid: first}
    fields:
      - name: referencia
        type: string
        required: true
        description: O id da linha no Pix JD. Não vai ao arquivo.
      - name: txid
        type: string
        required: false
        pattern: '^[^\t\r\n]{1,35}$'
        description: TxId do Pix (TransactionIdentification; IN 636, Anexo I, EXTRATO, campo 26). Sem ele, o campo sai em branco.

  - name: trilho_pix_jd_recebimentos
    description: Os Pix recebidos pelo Pix JD.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {txid: first}
    fields:
      - name: referencia
        type: string
        required: true
        description: O id da linha no Pix JD. Não vai ao arquivo.
      - name: txid
        type: string
        required: false
        pattern: '^[^\t\r\n]{1,35}$'
        description: TxId do Pix (TransactionIdentification; IN 636, Anexo I, EXTRATO, campo 26). Sem ele, o campo sai em branco.

knownGaps:
  - id: saldo-do-midaz
    description: >-
      O campo 12 sai dos saldos que o Midaz gravou em cada operação (disponível, bloqueado e cheque especial
      usado), na ordem em que gravou. Com lançamento retroativo, ou conta com mais de uma chave de saldo, o saldo da
      linha não fecha com o saldo do CONTAS. O motor não tem soma corrida.
  - id: parcela-de-cheque-especial
    description: >-
      A parcela de um lançamento tirada do (ou paga ao) cheque especial é gravada pelo Midaz em operação própria, na
      chave overdraft, sem a metadata da operação que a gerou e sem nada que a ligue a ela. Sai em linha própria, com o
      código da transação (a metadata da transação é a mesma), e traz o saldo da chave de cheque especial (menos a
      dívida, sem o bloqueado); o saldo real da conta está na linha da parte do disponível, inclusive quando ela é de
      R$ 0,00. Numa transação que também tem tarifa, a parcela pode ser da tarifa e sai com o código e a contraparte da
      transação. Num crédito que quita a dívida e sobra saldo, a parcela sai com saldo 000 C e, gravada depois da linha
      principal, pode ser a última da conta no período e diferir do saldo final do CONTAS.
  - id: reserva-com-validacao-de-rota
    description: >-
      Num ledger que valida rotas, a reserva cancelada sai como um débito e um crédito de mesmo valor, e uma reserva
      ainda aberta na data de corte sai como débito, sem a operação que a concluiria. A do MED do Pix lerian também:
      o débito da reserva sai 125 e o crédito da liberação 218.
  - id: bloqueio-cautelar-no-saldo
    description: >-
      O bloqueio cautelar do Pix lerian sai 167 e o desbloqueio 276 (IN 636, Anexo II), mas o campo 12 continua o
      saldo da conta com o bloqueado (disponível + bloqueado - cheque especial usado). Num ledger que não valida
      rotas, a linha 167 e a 276 saem com o mesmo saldo da linha anterior: a reserva só passa o valor do disponível
      para o bloqueado. Num ledger que valida rotas, a linha 167 sai com o saldo já sem o valor, porque o Midaz grava
      o débito antes da reserva, e a linha seguinte o soma de novo. O commit de um bloqueio cautelar (a liquidação do
      MED que o adotou, por Pix manual) não sai quando o bloqueio está no arquivo: o 167 já tirou o valor. Com o
      bloqueio antes do período, o commit sai 166.
  - id: conta-so-com-bloqueio-cautelar
    description: >-
      O campo 7 do CONTAS (movimentação) não conta reserva nem liberação do Midaz. Num ledger que não valida rotas, a
      conta cuja única operação no período é um bloqueio cautelar ou a liberação dele tem linha 167 ou 276 no EXTRATO
      e sai 2 (sem movimentação) no CONTAS, e a conferência acusa. O bloqueio entra no mesmo lote do crédito do Pix:
      só a liberação, até 72 horas depois, cai sozinha num período. Num ledger que valida rotas, o commit de um
      bloqueio cautelar de antes do período (o MED liquidado por Pix manual) é uma operação ON_HOLD: a conta cuja
      única operação no período é esse commit tem a linha 166 no EXTRATO e também sai 2 no CONTAS. Gerar de novo
      não corrige: confira a linha no EXTRATO antes de aprovar.
  - id: cautelar-do-pix-jd
    description: >-
      O Pix JD grava a reserva do bloqueio cautelar como uma devolução (flow REFUND, direction OUT), sem marca de
      bloqueio cautelar na metadata. A reserva e a liberação ficam fora do EXTRATO, e a efetivação, quando há, sai
      140 (devolução), e não 167.
  - id: cheque-especial-antes-do-snapshot
    description: >-
      Operação gravada antes de o Midaz guardar o cheque especial usado no snapshot não o tem: o saldo dela sai sem
      o cheque especial. A conferência lista esses lançamentos.
  - id: codigo-generico
    description: >-
      O campo 9 sai 125 (débito) ou 218 (crédito) quando nenhuma regra se aplica: lançamento sem metadata de plugin,
      tarifa avulsa sem feeLeg, transferência interna sem metadata, Pix Automático. Os dois códigos são descontinuados em 01/06/2028 (IN 636, art. 2º, § 4º) sem substituto indicado.
  - id: codigos-especificos
    description: >-
      Pix Saque e Pix Troco, mesma titularidade e pagamentos de boleto não têm marca nos plugins: saem com o código
      largo da regra (135/261 no Pix, 134/259 na TED). O 223 (Pix recebido por QR Code) só sai no Pix lerian, que
      grava a forma de iniciação na metadata.
  - id: canal-local-dispositivo
    description: >-
      Nenhuma aplicação Lerian registra canal, local, IP, porta ou MAC do lançamento. O campo 17 é um canal só,
      declarado pelo cliente; 14, 20, 21 e 22 saem em branco; 18 e 19 com as sentinelas da IN (0000000 e 00).
  - id: chave-e-txid-pix
    description: >-
      Os campos 24 e 25 (chave Pix) saem em branco: a chave não está na metadata da transação. O campo 26 sai com o
      TxId que o plugin grava, o mesmo do ORIGEM-DESTINO 28, e em branco no Pix sem TxId (chave ou manual) e no Pix
      enviado pelo Pix JD, que repassa o TxId ao SPI sem guardá-lo; o ORIGEM-DESTINO diz o motivo no campo 18.
  - id: instante-em-utc
    description: >-
