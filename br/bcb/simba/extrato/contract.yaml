# Contrato do arquivo IV EXTRATO do SIMBA (IN BCB 636/2025).
#
# QUEM CURA: a Lerian, a partir da transcricao oficial da IN BCB 636/2025 em
# br/bcb/simba/normas/IN-BCB-636-2025.md ("IN :N" abaixo e a linha dessa copia).
# Leiaute: art. 2o, IV (IN :33), art. 2o, § 3o (IN :53), art. 3o (IN :57-73),
# Anexo I, arquivo IV Extrato, campos 1 a 27 (IN :165-196) e Anexo II (IN :363+).
#
# O QUE E: uma linha por lancamento das contas investigadas no periodo do
# afastamento do sigilo. O numero do lancamento (campo 1) liga a linha as do
# ORIGEM-DESTINO: os dois documentos leem o MESMO conjunto `lancamentos`, na mesma
# ordem, e numeram do mesmo jeito.
#
# FORMA DO ARQUIVO (IN art. 3o): texto ASCII, sem cabecalho, colunas separadas
# por TAB, linha terminada em CR LF, datas ddmmaaaa no dia de Brasilia, hora
# hhmmss em UTC (IN :69), valores em centavos sem separador (IN :73). A forma e
# do template; o formato de cada campo esta aqui.
#
# DE ONDE VEM CADA CAMPO: lancamento, valor, natureza e saldo apos o lancamento da
# tabela `operation` do Midaz; descricao da operacao ou, vazia, da transacao;
# agencia, conta e tipo do CRM; a metadata da transacao (rail, flow, direction dos
# plugins; chaves proprias do Pix lerian) e a da operacao (feeLeg) do Mongo do
# Midaz decidem o codigo do Anexo II; CNPJ da organizacao do Midaz; COMPE, nome no
# Unicad e canal preenchidos pelo cliente no mapeamento.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentContract

metadata:
  id: br.bcb.simba.extrato
  country: BR
  regulator: BCB
  document: EXTRATO          # o nome do arquivo na IN 636 art. 2º (AGENCIAS, CONTAS, TITULARES, EXTRATO, ORIGEM-DESTINO)
  family: simba
  title: SIMBA — Extrato
  summary: >-
    Lancamentos das contas investigadas no periodo do afastamento do sigilo, com valor,
    natureza, saldo apos o lancamento e o codigo do tipo de lancamento do Anexo II.
  version: 1.0.0
  status: draft
  output: txt
  timezone: America/Sao_Paulo
  appliesTo:
    institutionTypes: [IP, SCD, SCFI]
  periodicity: eventual
  layout:
    version: "IN BCB 636/2025"
    mandatoryFrom: "2026-12-01"
  sourceOfTruth:
    layoutManual: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=636

parameters:
  - name: caso
    type: string
    required: true
    pattern: '^[0-9]{3}-[A-Z]{2,6}-[0-9]{6}-[0-9]{2}$'
    description: Numero do caso SIMBA, como esta na ordem.
  - name: documentos
    type: string
    multiple: true
    required: true
    description: >-
      CPFs e CNPJs da ordem, somente digitos, sem pontos, tracos ou barras: o documento formatado nao encontra
      contas, e o caso sai como resposta vazia para ele, sem erro.
  - name: contas
    type: string
    multiple: true
    required: false
    description: >-
      Numeros de conta da ordem, com DV, so digitos. Preencher so quando o oficio restringir a contas especificas; o
      normal e nao preencher (ausente, todas as contas dos documentos). Preencher sem a ordem pedir omite contas do
      investigado.
  - name: inicio
    type: date
    required: true
    description: Primeiro dia do afastamento do sigilo.
  - name: fim
    type: date
    closed: true
    required: true
    notBefore: inicio
    description: Ultimo dia do afastamento do sigilo.

filing:
  period: [caso]
  # Uma ordem pode ser gerada de novo (dado corrigido, cadastro completado). So a
  # geracao mais nova do mesmo caso pode ser aprovada: aprovar uma anterior
  # entregaria ao orgao o arquivo que a correcao ja substituiu.
  approve: newest
  # Conta do caso sem lancamento no periodo sai no CONTAS com o campo 7 = 2 (IN :126) e nao
  # tem linha aqui; sem lancamento em nenhuma conta do caso, o arquivo sai vazio (0 byte),
  # sem cabecalho (IN art. 3o, I, :59), e e entregue assim.
  allowEmpty: true

datasets:
  # Os campos 2, 15, 16 e 17 sao da instituicao e se repetem em toda linha (IN :171,
  # :184, :185, :186).
  - name: instituicao
    description: A instituicao que responde ao caso, uma linha.
    grain: singleton
    fields:
      - name: compe
        type: string
        required: true
        pattern: '^[0-9]{3}$'
        description: Codigo Compe da instituicao, ou 999 quando ela nao tem (campo 2, IN :171).
      - name: cnpj
        type: string
        length: 14
        required: true
        normalize: alphanumeric
        identifiesInstitution: true
        pattern: '^[0-9A-Z]{14}$'
        description: CNPJ da instituicao (campo 15, IN :184).
      - name: nomeUnicad
        type: string
        required: true
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Nome da instituicao como esta no Unicad (campo 16, IN :185). O template o corta em 50 posicoes.
      - name: interfaceTransacao
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6", "7", "8", "9"]
        description: Canal das transacoes no codigo da IN (campo 17, IN :186). Nenhuma aplicacao Lerian registra o canal por lancamento; o cliente declara um so.

  # O CONJUNTO QUE O ORIGEM-DESTINO TAMBEM LE, igual nos dois contratos: o numero do
  # lancamento e a posicao dele aqui. A consulta que o entrega agrupa por
  # (transacao, operacao, ...), o que fixa a ordem das linhas; cada operacao e um grupo.
  - name: lancamentos
    description: Os lancamentos das contas do caso no periodo, um por operacao, na ordem da consulta.
    grain: [transacaoId, operacaoId]
    consolidation:
      key: [transacaoId, operacaoId]
      whenKeyRepeats: refuse
      columns: {contaId: first, numeroAgencia: first, numeroConta: first, tipoConta: first,
                dataLancamento: first, horaLancamento: first, descricao: first, descricaoTransacao: first,
                valor: first, natureza: first, naturezaOposta: first, tipoOperacao: first, saldoApos: first, chaveSaldo: first, bloqueadoApos: first,
                chequeEspecialApos: first, rail: first, fluxo: first, direcao: first,
                agregado: first, e2e: first, tipoPagamento: first, tipoIniciacao: first, e2eEnvio: first,
                iniciacao: first, e2eRecebimento: first, devolucao: first, e2eOriginal: first}
    fields:
      - name: operacaoId
        type: string
        required: true
        description: A operacao do Midaz. Nao vai ao arquivo; identifica a linha e a perna de tarifa.
      - name: transacaoId
        type: string
        required: true
        description: A transacao do Midaz. Nao vai ao arquivo; liga o estorno, a metadata e a sessao (campo 27).
      - name: contaId
        type: string
        required: true
        description: A conta do Midaz do lancamento. Nao vai ao arquivo.
      - name: numeroAgencia
        type: string
        required: true
        pattern: '^[0-9]{5}$'
        description: Numero da agencia sem DV, cinco digitos; 00001 sem agencia fisica (campo 3, IN :172).
      - name: numeroConta
        type: string
        required: true
        pattern: '^[^\t\r\n]{1,20}$'
        description: Numero da conta com o digito verificador, como o CRM o guarda (campo 4, IN :173).
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no codigo da IN (campo 5, IN :174).
      - name: dataLancamento
        type: date
        required: true
        description: Data do lancamento, no dia civil de Brasilia (campo 6, IN :175).
      - name: horaLancamento
        type: string
        required: true
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|\+00:00)$'
        description: >-
          O instante do lancamento em UTC; o template escreve hhmmss (campo 23, IN :192; IN art. 3o VI, :69).
          Instante em outro fuso recusa a geracao, em vez de sair a hora local.
      - name: descricao
        type: string
        required: false
        description: Descricao da operacao no Midaz (campo 8, IN :177). O template corta em 100 posicoes.
      - name: descricaoTransacao
        type: string
        required: false
        description: Descricao da transacao no Midaz, usada quando a da operacao vem vazia (campo 8).
      - name: valor
        type: decimal
        required: true
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Valor do lancamento em reais, sem sinal (campo 10, IN :179). O template escreve centavos.
      - name: natureza
        type: string
        required: true
        domain: ["C", "D"]
        description: Natureza do lancamento, C credito ou D debito (campo 11, IN :180).
      - name: naturezaOposta
        type: string
        required: true
        domain: ["C", "D"]
        description: A natureza da outra perna (D para um credito, C para um debito). So o ORIGEM-DESTINO a le.
      - name: tipoOperacao
        type: string
        required: true
        description: >-
          O tipo da operacao no Midaz (operation.type): DEBIT, CREDIT, OVERDRAFT (a parcela do cheque especial), BLOCK e
          UNBLOCK (bloqueio e desbloqueio judicial) ou, na cobranca de divida de tarifa, FEE_SETTLEMENT e FEE_REFUND, que o
          motor grava sem feeLeg e sao perna de tarifa.
      - name: saldoApos
        type: decimal
        required: true
        description: >-
          Saldo disponivel da conta apos o lancamento, como o Midaz o gravou (nunca abaixo de zero). Com o bloqueado
          e o cheque especial usado, da o saldo da conta dos campos 12 e 13 (IN :181-182). Sem `format`: o template
          faz conta com ele, e o valor formatado chega cercado para impressao, nao para conta.
      - name: chaveSaldo
        type: string
        required: false
        description: >-
          A chave de saldo da operacao. Na chave overdraft (a parte de um saque tirada do cheque especial, ou a parte
          de um credito que o paga), o saldo disponivel gravado e a divida, e o saldo da conta e menos ela.
      - name: bloqueadoApos
        type: decimal
        required: true
        description: Saldo bloqueado da conta apos o lancamento (on_hold), somado ao disponivel no campo 12.
      - name: chequeEspecialApos
        type: decimal
        required: false
        description: >-
          Cheque especial usado apos o lancamento, do snapshot da operacao; subtraido no campo 12. Ausente em
          operacao gravada antes de o Midaz guardar o snapshot: conta 0, e a conferencia lista o lancamento.
      - name: rail
        type: string
        required: false
        description: Trilho gravado pelo plugin na metadata da transacao (TED, PIX, INTERNAL). Decide o campo 9.
      - name: fluxo
        type: string
        required: false
        description: Fluxo gravado pelo plugin (CASH_OUT, CASH_IN, P2P, REFUND, MED, AUTOMATIC_DEBIT). Decide o campo 9.
      - name: direcao
        type: string
        required: false
        description: Direcao gravada pelo plugin em relacao a conta do cliente (IN, OUT). Vazia, vale a natureza.
      - name: agregado
        type: string
        required: false
        description: Id do registro do plugin TED ou Pix JD que a transacao liquida. Liga a contraparte do ORIGEM-DESTINO.
      - name: e2e
        type: string
        required: false
        pattern: '^[^\t\r\n]*$'
        description: EndToEndId gravado pelo plugin TED ou Pix JD.
      - name: tipoPagamento
        type: string
        required: false
        description: payment_type do Pix lerian (PIX_IN no recebimento).
      - name: tipoIniciacao
        type: string
        required: false
        description: initiation_type do Pix lerian (MANUAL, DICT, QR_CODE, AUTO).
      - name: e2eEnvio
        type: string
        required: false
        pattern: '^[^\t\r\n]*$'
        description: end_to_end_id do envio do Pix lerian.
      - name: iniciacao
        type: string
        required: false
        description: initiation_id do envio do Pix lerian.
      - name: e2eRecebimento
        type: string
        required: false
        pattern: '^[^\t\r\n]*$'
        description: inbound_end_to_end_id do recebimento do Pix lerian.
      - name: devolucao
        type: string
        required: false
        description: refund_id da devolucao do Pix lerian.
      - name: e2eOriginal
        type: string
        required: false
        description: original_end_to_end_id da devolucao do Pix lerian.

  # Transacoes que sao revert de outra no Midaz (parent_transaction_id): o campo 9
  # sai 140 no debito e 264 no credito, antes de qualquer outra regra.
  - name: estornos
    description: As transacoes dos lancamentos que estornam outra transacao.
    grain: [transacaoId]
    consolidation:
      key: [transacaoId]
      whenKeyRepeats: refuse
      columns: {}
    fields:
      - name: transacaoId
        type: string
        required: true
        description: A transacao de estorno. Nao vai ao arquivo.

  # Operacoes que o motor de tarifas do Midaz marcou com feeLeg = "true": o campo 9
  # sai 105 (tarifas), depois da regra do estorno.
  - name: taxas
    description: As operacoes dos lancamentos que sao a perna de tarifa de uma transacao.
    grain: [operacaoId]
    consolidation:
      key: [operacaoId]
      whenKeyRepeats: refuse
      columns: {}
    fields:
      - name: operacaoId
        type: string
        required: true
        description: A operacao de tarifa. Nao vai ao arquivo.

  # O TxId do Pix (campo 26) pela linha do plugin que liquidou o Pix, a mesma que o
  # ORIGEM-DESTINO le (campo 28): um conjunto por plugin e sentido. A referencia e o E2E
  # (Pix lerian) ou o id da linha no plugin (Pix JD: o aggregateId da metadata).
  - name: trilho_pix_lerian_envios
    description: Os Pix enviados pelo Pix lerian.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {txid: first}
    fields:
      - name: referencia
        type: string
        required: true
        description: O E2E do Pix. Nao vai ao arquivo.
      - name: txid
        type: string
        required: false
        pattern: '^[^\t\r\n]*$'
        description: TxId do Pix (TransactionIdentification, campo 26, IN :195). Sem ele, o campo sai em branco.

  - name: trilho_pix_lerian_recebimentos
    description: Os Pix recebidos pelo Pix lerian.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {txid: first}
    fields:
      - name: referencia
        type: string
        required: true
        description: O E2E do Pix. Nao vai ao arquivo.
      - name: txid
        type: string
        required: false
        pattern: '^[^\t\r\n]*$'
        description: TxId do Pix (TransactionIdentification, campo 26, IN :195). Sem ele, o campo sai em branco.

  - name: trilho_pix_jd_envios
    description: Os Pix enviados pelo Pix JD.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {txid: first}
    fields:
      - name: referencia
        type: string
        required: true
        description: O id da linha no Pix JD. Nao vai ao arquivo.
      - name: txid
        type: string
        required: false
        pattern: '^[^\t\r\n]*$'
        description: TxId do Pix (TransactionIdentification, campo 26, IN :195). Sem ele, o campo sai em branco.

  - name: trilho_pix_jd_recebimentos
    description: Os Pix recebidos pelo Pix JD.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {txid: first}
    fields:
      - name: referencia
        type: string
        required: true
        description: O id da linha no Pix JD. Nao vai ao arquivo.
      - name: txid
        type: string
        required: false
        pattern: '^[^\t\r\n]*$'
        description: TxId do Pix (TransactionIdentification, campo 26, IN :195). Sem ele, o campo sai em branco.

knownGaps:
  - id: saldo-do-midaz
    description: >-
      O campo 12 sai dos saldos que o Midaz gravou em cada operacao (disponivel, bloqueado e cheque especial
      usado), na ordem em que gravou. Com lancamento retroativo, ou conta com mais de uma chave de saldo, o saldo da
      linha nao fecha com o saldo do CONTAS. O motor nao tem soma corrida.
  - id: parcela-de-cheque-especial
    description: >-
      A parcela de um lancamento tirada do (ou paga ao) cheque especial e gravada pelo Midaz em operacao propria, na
      chave overdraft, sem a metadata da operacao que a gerou e sem nada que a ligue a ela. Sai em linha propria, com o
      codigo da transacao (a metadata da transacao e a mesma), e traz o saldo da chave de cheque especial (menos a
      divida, sem o bloqueado); o saldo real da conta esta na linha da parte do disponivel, inclusive quando ela e de
      R$ 0,00. Numa transacao que tambem tem tarifa, a parcela pode ser da tarifa e sai com o codigo e a contraparte da
      transacao. Num credito que quita a divida e sobra saldo, a parcela sai com saldo 000 C e, gravada depois da linha
      principal, pode ser a ultima da conta no periodo e diferir do saldo final do CONTAS.
  - id: reserva-com-validacao-de-rota
    description: >-
      Num ledger que valida rotas, a reserva cancelada sai como um debito e um credito de mesmo valor, e uma reserva
      ainda aberta na data de corte sai como debito, sem a operacao que a concluiria.
  - id: cheque-especial-antes-do-snapshot
    description: >-
      Operacao gravada antes de o Midaz guardar o cheque especial usado no snapshot nao o tem: o saldo dela sai sem
      o cheque especial. A conferencia lista esses lancamentos.
  - id: codigo-generico
    description: >-
      O campo 9 sai 125 (debito) ou 218 (credito) quando nenhuma regra se aplica: lancamento sem metadata de plugin,
      tarifa avulsa sem feeLeg, transferencia interna sem metadata, MED, Pix Automatico, bloqueio cautelar. Os dois
      codigos sao descontinuados em 01/06/2028 (IN art. 2o, § 4o, :55) sem substituto indicado.
  - id: codigos-especificos
    description: >-
      Pix Saque e Pix Troco, mesma titularidade e pagamentos de boleto nao tem marca nos plugins: saem com o codigo
      largo da regra (135/261 no Pix, 134/259 na TED). O 223 (Pix recebido por QR Code) so sai no Pix lerian, que
      grava a forma de iniciacao na metadata.
  - id: canal-local-dispositivo
    description: >-
      Nenhuma aplicacao Lerian registra canal, local, IP, porta ou MAC do lancamento. O campo 17 e um canal so,
      declarado pelo cliente; 14, 20, 21 e 22 saem em branco; 18 e 19 com as sentinelas da IN (0000000 e 00).
  - id: chave-e-txid-pix
    description: >-
      Os campos 24 e 25 (chave Pix) saem em branco: a chave nao esta na metadata da transacao. O campo 26 sai com o
      TxId que o plugin grava, o mesmo do ORIGEM-DESTINO 28, e em branco no Pix sem TxId (chave ou manual) e no Pix
      enviado pelo Pix JD, que repassa o TxId ao SPI sem guarda-lo; o ORIGEM-DESTINO diz o motivo no campo 18.
  - id: instante-em-utc
    description: >-
      A hora (campo 23) sai do instante do lancamento como o motor o entrega. Instante que nao chega em UTC recusa a
      geracao (pattern do campo), em vez de sair a hora de outro fuso.
  - id: so-titular
    description: >-
      As contas do caso sao as que o documento investigado TITULA. A conta em que ele e so cotitular, representante
      ou procurador nao entra: o indice das partes no CRM nao separa o papel.
