        from: manual
        pendingReason: "o nome da instituição exatamente como está no Unicad do Banco Central"
      # Declaracao da implantacao: "nao" se a instituicao nao firma contrato de
      # cambio (campo 28 = 0 para toda pessoa); "sim" se firma, e o campo 28 de
      # cada pessoa sai de contratoCambio.
      operaCambio:
