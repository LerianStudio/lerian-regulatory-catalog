# Binding do SIMBA TITULARES — QUEM PREENCHE E O CLIENTE.
#
# Exemplo preenchido contra o Midaz (`midaz_onboarding`) e o CRM do Midaz
# (`plugin_crm`). As contas do caso saem de `contas_do_caso` (as que o investigado
# titula) e de `contas_cotitular` (as em que ele e cotitular), as mesmas consultas
# (mesmo texto) nos bindings de AGENCIAS, CONTAS, EXTRATO e ORIGEM-DESTINO: trocar
# de onde vem o conjunto de contas do caso e trocar SO essas duas consultas. As
# demais leem os ids das duas.
#
# O NUMERO DA AGENCIA e o `banking_details.branch` do CRM, como esta gravado. O
# contrato aceita ate 5 digitos (sem DV) e recusa o resto; o template completa com
# zeros a esquerda ("1" e "0001" saem 00001, IN 636 Anexo I).
#
# O TIPO DA CONTA vem de `regulatory_fields.account_type` do CRM, cujos valores o
# proprio Midaz documenta com os codigos da IN (midaz pkg/mmodel/instrument.go:19).
#
# AS CONTAS DE CONTRAPARTE (IN art. 2o, III: os titulares das contas do arquivo
# CONTAS, que lista tambem as contas com que as do caso transacionaram, codigo 3)
# saem de `contas_contraparte`, o MESMO texto (de `lancamentos` a
# `contas_contraparte`) do binding do CONTAS: trocar de onde vem esse conjunto e
# trocar nos dois. O campo 6 dessas pessoas segue a pessoa, como nas do caso (IN :142).
#
# O PAPEL DE CADA PARTE RELACIONADA (campo 5) e do cliente: o CRM tem os papeis
# PRIMARY_HOLDER, LEGAL_REPRESENTATIVE e RESPONSIBLE_PARTY, e o campo 5 tem T, 1..n,
# R, L, P e O. PRIMARY_HOLDER e o cotitular ("C", que o template numera 1, 2... por
# conta) e LEGAL_REPRESENTATIVE e o representante legal ("L"). O CRM nao define
# RESPONSIBLE_PARTY; o exemplo declara "O" (outros), o unico codigo que nao afirma
# procuracao nem representacao. Quem usa o papel para procurador declara "P"; para
# representante, "R". Declare-o em `vinculo` nas duas consultas de partes. Sem a
# declaracao, uma parte com esse papel recusa a geracao.
#
# DATAS DO CRM GRAVADAS COMO INSTANTE (`civilDate: true`): o CRM do Midaz guarda
# o encerramento da conta e o inicio e o fim do vinculo das partes
# (`closing_date`, `start_date`, `end_date`) como data e hora a meia-noite UTC
# (um documento nao tem tipo de dia). Sem a marca, o motor corta o instante no fuso
# do documento e o dia sai um antes. Com `civilDate: true` o binding le o dia UTC; um instante fora
# da meia-noite recusa a geracao. A chave exige o Reporter que a conhece.
#
# A RENDA (campos 18 e 19): da pessoa natural, a renda mensal bruta declarada; da
# pessoa juridica, o faturamento anual declarado, como esta no cadastro (sem
# dividir por 12). A data e a `reference_date` de cada um.
# A moeda (`currency`) de cada um vai junto: o catalogo nao converte moeda, e a
# figura que o campo 18 imprime (renda da pessoa natural, faturamento da juridica)
# em outra moeda que nao BRL recusa a geracao (regras moeda-da-renda e
# moeda-do-faturamento). A IN nao fala de moeda no campo 18 (IN :154); o leiaute so
# da exemplos em R$ (art. 3o, VIII, IN :73). A recusa e uma trava do catalogo, nao
# uma exigencia escrita do Banco Central.
#
# CONTRATO DE CAMBIO (campo 28): declare em `operaCambio` se a instituicao firma
# contrato de cambio. "nao" escreve 0 em toda linha; "sim" recusa a geracao, porque
# nenhuma aplicacao Lerian registra o contrato de cambio e nao ha fonte para o 1.
#
# O CADASTRO DAS PARTES (campos 12 a 19, 24 e 25 de cotitular, representante e
# procurador) sai de `cadastro_partes`: o cadastro de titulares do CRM, pelo documento
# da parte. So a parte que tambem e titular no CRM tem cadastro; a outra sai com esses
# campos em branco e o campo 25 com "e-mail nao declarado".
#
# A UF DO TITULAR (campo 14) converte a sigla do endereco principal no codigo IBGE,
# com a tabela de br/bcb/simba/tabelas/uf-ibge.compute.yaml, em maiuscula e em
# minuscula (o motor nao normaliza o texto antes do `case`). Sigla ausente ou fora
# da tabela chega crua, e a ausente, nula. Para quem mora no Brasil (pais BR ou ausente),
# a regra `uf-do-brasil` confere o codigo na tabela de codigos (codigos-uf.yaml): a sigla
# fora da tabela recusa a geracao, e a AUSENTE deixa o campo em branco, porque a
# informacao nao existe no cadastro (IN art. 2o, paragrafo 1o, :49). Para quem mora no
# exterior, o template escreve "00" (IN :150).
#
# O PAIS (campo 15) e o nome do codigo ISO 3166-1 alfa-2 do endereco principal, da
# tabela de paises da Receita (br/rfb/e-financeira/tabelas/paises.txt, linhas
# vigentes em 19/11/2026; tools/test_simba.py confere o `case` contra ela), em
# maiuscula e em minuscula (o motor nao normaliza o texto antes do `case`). Codigo
# ausente ou fora da tabela vira "-": informado e fora da tabela, a regra
# `pais-na-tabela` do contrato recusa a geracao; ausente, o campo sai em branco.
# Quem mora no exterior e decidido pelo nome (nem Brasil nem "-"), nao pelo codigo.
#
# Filtro encadeado `{query, column}`: grafia provisoria do motor; se
# mudar, e `sed` nos bindings.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentBinding

contract: br.bcb.simba.titulares
contractVersion: 1.4.0

queries:
  - name: declarante
    description: A organização do Midaz, que é a instituição que responde ao caso. O CNPJ dela é o do arquivo.
    dataSource: midaz_onboarding
    table: organization
    filters:
      - field: deleted_at
        operator: isNull

  # As contas do caso: as que o documento investigado TITULA (contas_do_caso) e as em que
  # ele e cotitular (contas_cotitular). Representante e procurador nao entram. Excluida do
  # CRM fica fora; encerrada entra. Toda consulta que le as contas do caso le as duas.
  - name: contas_do_caso
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: document, operator: in, values: [{parameter: documentos}]}
      - {field: banking_details.account, operator: in, values: [{parameter: contas}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id, document, banking_details.branch, banking_details.account, regulatory_fields.account_type, banking_details.type, banking_details.opening_date, banking_details.closing_date]

  # As contas em que o documento investigado e cotitular no periodo: a parte do instrumento
  # com o documento da ordem e o papel PRIMARY_HOLDER, cuja cotitularidade cruza o periodo
  # pedido em pelo menos um dia (start_date ate o fim, e end_date ausente ou a partir do
  # inicio). O filtro do documento pergunta pelo digest das partes
  # (search.related_party_documents) e o Reporter confere, parte a parte, o documento
  # decifrado; papel e datas sao conferidos na mesma parte, depois do expand. Representante
  # (LEGAL_REPRESENTATIVE) e RESPONSIBLE_PARTY nao entram.
  # O motor nao executa anyOf, entao cada combinacao e uma consulta e a contas_cotitular e a
  # uniao delas: vinculo aberto (sem end_date) ou encerrado no periodo, com start_date ate o
  # fim ou ausente (registro antigo: entra sempre; opening_date nao e consultada).
  - name: cotitular_aberto
    dataSource: plugin_crm
    table: aliases
    expand: related_parties
    filters:
      - {field: related_parties.document, operator: in, values: [{parameter: documentos}]}
      - {field: related_parties.role, operator: eq, values: ["PRIMARY_HOLDER"]}
      - {field: related_parties.start_date, operator: lt, values: [{parameter: fim, at: end}]}
      - {field: related_parties.end_date, operator: isNull}
      - {field: banking_details.account, operator: in, values: [{parameter: contas}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id]

  - name: cotitular_encerrado
    dataSource: plugin_crm
    table: aliases
    expand: related_parties
    filters:
      - {field: related_parties.document, operator: in, values: [{parameter: documentos}]}
      - {field: related_parties.role, operator: eq, values: ["PRIMARY_HOLDER"]}
      - {field: related_parties.start_date, operator: lt, values: [{parameter: fim, at: end}]}
      - {field: related_parties.end_date, operator: gte, values: [{parameter: inicio, at: start}]}
      - {field: banking_details.account, operator: in, values: [{parameter: contas}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id]

  - name: cotitular_sem_inicio_aberto
    dataSource: plugin_crm
    table: aliases
    expand: related_parties
    filters:
      - {field: related_parties.document, operator: in, values: [{parameter: documentos}]}
      - {field: related_parties.role, operator: eq, values: ["PRIMARY_HOLDER"]}
      - {field: related_parties.start_date, operator: isNull}
      - {field: related_parties.end_date, operator: isNull}
      - {field: banking_details.account, operator: in, values: [{parameter: contas}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id]

  - name: cotitular_sem_inicio_encerrado
    dataSource: plugin_crm
    table: aliases
    expand: related_parties
    filters:
      - {field: related_parties.document, operator: in, values: [{parameter: documentos}]}
      - {field: related_parties.role, operator: eq, values: ["PRIMARY_HOLDER"]}
      - {field: related_parties.start_date, operator: isNull}
      - {field: related_parties.end_date, operator: gte, values: [{parameter: inicio, at: start}]}
      - {field: banking_details.account, operator: in, values: [{parameter: contas}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id]

  - name: contas_cotitular
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: account_id, operator: in, values: [{query: cotitular_aberto, column: account_id}, {query: cotitular_encerrado, column: account_id}, {query: cotitular_sem_inicio_aberto, column: account_id}, {query: cotitular_sem_inicio_encerrado, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id, document]

  - name: titulares_dados
    description: As contas do caso, com agência, tipo, datas e o cadastro do titular.
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: account_id, operator: in, values: [{query: contas_do_caso, column: account_id}, {query: contas_cotitular, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: tipo_conta
        case:
          column: regulatory_fields.account_type
          when:
            DEPOSIT: {constant: "1"}
            SAVINGS: {constant: "2"}
            INVESTMENT: {constant: "3"}
            OTHER_FINANCIAL_INVESTMENTS: {constant: "4"}
            NON_RESIDENT: {constant: "5"}
            PAYMENT: {constant: "6"}
          otherwise: refuse
    join:
      - query: cadastro_titulares
        match: {holder_id: _id}
    # Quem junta uma consulta declara o que devolve; o documento e o nome vem do
    # cadastro do titular, e nao do instrumento.
    select: [account_id, holder_id, banking_details.branch, tipo_conta, banking_details.account, banking_details.opening_date, banking_details.closing_date]

  # O cadastro do titular de cada conta do caso, pelo documento do instrumento: o da
  # ordem nas contas que o investigado titula (contas_do_caso), e o do titular, que pode
  # nao estar na ordem, nas contas em que o investigado e cotitular (contas_cotitular).
  # O filtro pergunta pelo digest do documento, com os documentos que as duas decifraram.
  - name: cadastro_titulares
    description: O cadastro de titulares do CRM, dos titulares das contas do caso.
    dataSource: plugin_crm
    table: holders
    filters:
      - {field: document, operator: in, values: [{query: contas_do_caso, column: document}, {query: contas_cotitular, column: document}]}
    compute:
      - as: tipo_pessoa
        case:
          column: type
          when:
            NATURAL_PERSON: {constant: "1"}
            LEGAL_PERSON: {constant: "2"}
          otherwise: refuse
      - as: codigo_uf
        case:
          column: addresses.primary.state
          when:
            AC: {constant: "12"}
            AL: {constant: "27"}
            AM: {constant: "13"}
            AP: {constant: "16"}
            BA: {constant: "29"}
            CE: {constant: "23"}
            DF: {constant: "53"}
            ES: {constant: "32"}
            GO: {constant: "52"}
            MA: {constant: "21"}
            MG: {constant: "31"}
            MS: {constant: "50"}
            MT: {constant: "51"}
            PA: {constant: "15"}
            PB: {constant: "25"}
            PE: {constant: "26"}
            PI: {constant: "22"}
            PR: {constant: "41"}
            RJ: {constant: "33"}
            RN: {constant: "24"}
            RO: {constant: "11"}
            RR: {constant: "14"}
            RS: {constant: "43"}
            SC: {constant: "42"}
            SE: {constant: "28"}
            SP: {constant: "35"}
            TO: {constant: "17"}
            # A mesma sigla em minuscula: o motor compara o texto como esta, e o pais ja aceita as duas grafias.
            ac: {constant: "12"}
            al: {constant: "27"}
            am: {constant: "13"}
            ap: {constant: "16"}
            ba: {constant: "29"}
            ce: {constant: "23"}
            df: {constant: "53"}
            es: {constant: "32"}
            go: {constant: "52"}
            ma: {constant: "21"}
            mg: {constant: "31"}
            ms: {constant: "50"}
            mt: {constant: "51"}
            pa: {constant: "15"}
            pb: {constant: "25"}
            pe: {constant: "26"}
            pi: {constant: "22"}
            pr: {constant: "41"}
            rj: {constant: "33"}
            rn: {constant: "24"}
            ro: {constant: "11"}
            rr: {constant: "14"}
            rs: {constant: "43"}
            sc: {constant: "42"}
            se: {constant: "28"}
            sp: {constant: "35"}
            to: {constant: "17"}
          # Fora da tabela: a sigla crua (ausente fica nula). A regra uf-do-brasil a recusa para quem
          # mora no Brasil; para quem mora no exterior o template escreve "00".
          otherwise: {column: addresses.primary.state}
      - as: nome_pais
        case:
          column: addresses.primary.country
          when:
            "AD": {constant: "Andorra"}
            "ad": {constant: "Andorra"}
            "AE": {constant: "Emirados Árabes Unidos"}
            "ae": {constant: "Emirados Árabes Unidos"}
