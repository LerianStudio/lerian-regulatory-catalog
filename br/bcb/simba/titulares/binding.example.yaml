  # Os cotitulares (PRIMARY_HOLDER) das contas do caso: so eles levam a renda na linha de parte
  # (campos 18 e 19), entao so a moeda do cadastro deles e conferida. O representante, o
  # procurador e as outras partes ficam fora: a moeda do cadastro deles nao recusa a geracao.
  - name: cotitulares_documentos
    description: O documento de cada cotitular das contas do caso.
    dataSource: plugin_crm
    table: aliases
    expand: related_parties
    filters:
      - {field: account_id, operator: in, values: [{query: contas_do_caso, column: account_id}, {query: contas_cotitular, column: account_id}]}
      - {field: deleted_at, operator: isNull}
      - {field: related_parties.role, operator: eq, values: ["PRIMARY_HOLDER"]}
    select: [related_parties.document]

  - name: renda_cotitulares
    description: A moeda da renda e do faturamento no cadastro de titulares do CRM dos cotitulares das contas do caso.
    dataSource: plugin_crm
    table: holders
    filters:
      - {field: document, operator: in, values: [{query: cotitulares_documentos, column: related_parties.document}]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: tipo_pessoa
        case:
          column: type
          when:
            NATURAL_PERSON: {constant: "1"}
            LEGAL_PERSON: {constant: "2"}
          otherwise: refuse
    select: [_id, document, tipo_pessoa, natural_person.monthly_gross_income.currency, legal_person.annual_gross_revenue.currency]

  # O cadastro das partes relacionadas (cotitular, representante, procurador) das contas de contraparte: a parte
  # no instrumento tem so documento, nome, papel e datas, e o cadastro completo dela, quando
  # a pessoa tambem e titular no CRM, sai pelo documento. O documento da parte e lido em
  # claro (o Reporter decifra `related_parties.document`) e o filtro do cadastro o pergunta
  # pelo digest, como faz `cadastro_titulares` com os documentos dos titulares das contas. Consulta propria
  # porque a origem de um filtro encadeado declara `select`.
  - name: partes_documentos_contraparte
    description: O documento de cada parte relacionada das contas de contraparte.
    dataSource: plugin_crm
    table: aliases
    expand: related_parties
    filters:
      - {field: account_id, operator: in, values: [{query: contas_contraparte, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    select: [related_parties.document]

  # O cadastro de cada parte que tambem e titular no CRM. Parte sem cadastro nao tem linha
  # aqui, e o template deixa os campos dela em branco. Cadastro apagado fica fora.
