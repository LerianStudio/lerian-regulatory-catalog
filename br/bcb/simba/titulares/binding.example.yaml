  # Uma linha por parte relacionada de cada conta de contraparte.
  - name: partes_contraparte_dados
    description: As partes relacionadas de cada conta de contraparte, uma linha por parte.
    dataSource: plugin_crm
    table: aliases
    expand: related_parties
    filters:
      - {field: account_id, operator: in, values: [{query: contas_contraparte, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: tipo_conta
        case:
          column: regulatory_fields.account_type
          when:
            DEPOSIT: {constant: "1"}
            SAVINGS: {constant: "2"}
            INVESTMENT: {constant: "3"}
            OTHER_FINANCIAL_INVESTMENTS: {constant: "4"}
            NON_RESIDENT: {constant: "5"}
            PAYMENT: {constant: "6"}
          otherwise: refuse
      - as: vinculo
        case:
          column: related_parties.role
          when:
            PRIMARY_HOLDER: {constant: "C"}
            LEGAL_REPRESENTATIVE: {constant: "L"}
            # Declare aqui o codigo do papel RESPONSIBLE_PARTY neste cliente
            # (R representante, P procurador ou O outros). Exemplo:
            RESPONSIBLE_PARTY: {constant: "O"}
          otherwise: refuse


  # O cadastro das partes relacionadas (cotitular, representante, procurador) das contas do caso: a parte
  # no instrumento tem so documento, nome, papel e datas, e o cadastro completo dela, quando
  # a pessoa tambem e titular no CRM, sai pelo documento. O documento da parte e lido em
  # claro (o Reporter decifra `related_parties.document`) e o filtro do cadastro o pergunta
  # pelo digest, como faz `cadastro_titulares` com os documentos dos titulares das contas. Consulta propria
  # porque a origem de um filtro encadeado declara `select`.
  - name: partes_documentos
    description: O documento de cada parte relacionada das contas do caso.
    dataSource: plugin_crm
    table: aliases
    expand: related_parties
    filters:
      - {field: account_id, operator: in, values: [{query: contas_do_caso, column: account_id}, {query: contas_cotitular, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    select: [related_parties.document]

  # O cadastro de cada parte que tambem e titular no CRM. Parte sem cadastro nao tem linha
  # aqui, e o template deixa os campos dela em branco. Cadastro apagado fica fora.
  - name: cadastro_partes
    description: O cadastro de titulares do CRM das partes relacionadas das contas do caso.
    dataSource: plugin_crm
    table: holders
    filters:
      - {field: document, operator: in, values: [{query: partes_documentos, column: related_parties.document}]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: tipo_pessoa
        case:
          column: type
          when:
            NATURAL_PERSON: {constant: "1"}
            LEGAL_PERSON: {constant: "2"}
          otherwise: refuse
      - as: codigo_uf
        case:
          column: addresses.primary.state
          when:
            AC: {constant: "12"}
            AL: {constant: "27"}
