    dataSource: plugin_crm
    table: holders
    filters:
      - {field: _id, operator: in, values: [{query: contraparte_titulares, column: holder_id}]}
    compute:
      - as: tipo_pessoa
        case:
          column: type
          when:
            NATURAL_PERSON: {constant: "1"}
            LEGAL_PERSON: {constant: "2"}
          otherwise: refuse
      - as: codigo_uf
        case:
          column: addresses.primary.state
          when:
            AC: {constant: "12"}
            AL: {constant: "27"}
            AM: {constant: "13"}
            AP: {constant: "16"}
