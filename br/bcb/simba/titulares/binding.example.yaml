  # Os cotitulares (PRIMARY_HOLDER) das contas de contraparte: so eles levam a renda na linha de parte
  # (campos 18 e 19), entao so a moeda do cadastro deles e conferida. O representante, o
  # procurador e as outras partes ficam fora: a moeda do cadastro deles nao recusa a geracao.
  - name: cotitulares_documentos_contraparte
    description: O documento de cada cotitular das contas de contraparte.
    dataSource: plugin_crm
    table: aliases
    expand: related_parties
    filters:
      - {field: account_id, operator: in, values: [{query: contas_contraparte, column: account_id}]}
      - {field: deleted_at, operator: isNull}
      - {field: related_parties.role, operator: eq, values: ["PRIMARY_HOLDER"]}
    select: [related_parties.document]

  - name: renda_cotitulares_contraparte
    description: A moeda da renda e do faturamento no cadastro de titulares do CRM dos cotitulares das contas de contraparte.
    dataSource: plugin_crm
    table: holders
    filters:
      - {field: document, operator: in, values: [{query: cotitulares_documentos_contraparte, column: related_parties.document}]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: tipo_pessoa
        case:
          column: type
          when:
            NATURAL_PERSON: {constant: "1"}
            LEGAL_PERSON: {constant: "2"}
          otherwise: refuse
    select: [_id, document, tipo_pessoa, natural_person.monthly_gross_income.currency, legal_person.annual_gross_revenue.currency]

datasets:
  instituicao:
