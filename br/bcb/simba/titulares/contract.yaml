knownGaps:
  - id: so-titular
    description: >-
      As contas do caso sao as que o documento investigado TITULA. A conta em que ele e so cotitular, representante
      ou procurador nao entra: o indice das partes no CRM nao separa o papel.
  - id: contas-de-contraparte
    description: >-
      As pessoas das contas de contraparte (CONTAS campo 7 = 3) entram com o campo 6 pela pessoa (IN :142): 1 se o
      documento esta na ordem, 0 se nao. Uma conta de contraparte que tambem e do caso sai uma vez, como conta do caso. Titular de conta de
      contraparte segue as mesmas regras de UF e pais do da conta do caso (uf-do-brasil-contraparte e
      pais-na-tabela-contraparte).
  - id: excluida-do-crm
    description: >-
      Uma conta apagada do CRM (deleted_at) nao entra. Uma conta encerrada (closing_date) entra, com a data no
      campo 21 da linha do titular.
  - id: documento-de-identificacao
    description: >-
      Campos 10 e 11 (IN :146-147) sempre em branco: o CRM guarda so CPF/CNPJ, e nenhuma aplicacao Lerian registra RG,
      CTPS, passaporte ou o documento constitutivo da pessoa juridica. A IN nao da sentinela para esses campos.
  - id: dispositivos-cadastrados
    description: >-
      Campos 26 e 27 (IN :162-163) sempre em branco: nenhuma aplicacao Lerian registra os dispositivos moveis ou os
      computadores cadastrados do cliente. A IN nao da sentinela para esses campos.
  - id: cidade-sem-codigo-ibge
    description: >-
      Campo 13 (IN :149) em branco para quem mora no Brasil: o CRM guarda o nome da cidade, sem o codigo IBGE, e a
      conversao do nome nao e confiavel. Para quem mora no exterior (pais diferente de BR) sai 0000000, o codigo que a
      IN da para esse caso; ele nao e usado no lugar do codigo faltante.
  - id: uf-fora-da-tabela
    description: >-
      O campo 14 converte a sigla da UF do endereco principal do titular para o codigo IBGE. Quem mora no Brasil (pais
      BR ou ausente) sem UF ou com sigla fora da tabela recusa a geracao (regra uf-do-brasil); corrija o cadastro antes
      de gerar. Quem mora no exterior sai com 00, e um pais informado fora da tabela da Receita recusa a geracao (regra
      pais-na-tabela).
  - id: parte-sem-cadastro
    description: >-
      A parte relacionada no CRM tem so documento, nome, papel e datas. Para cotitular, representante e procurador
      saem em branco os campos 12 a 19 e 24, e o campo 25 sai "e-mail nao declarado". O cadastro completo da parte
      exigiria ligar a parte ao titular pelo documento, que o CRM guarda cifrado.
  - id: renda-pessoa-juridica
    description: >-
      Campo 18 (IN :154): a pessoa natural declara no CRM a renda mensal, e a pessoa juridica o faturamento anual. A IN
      pede a renda declarada sem fixar o periodo; o campo leva o valor como declarado, mensal para a pessoa natural e
      anual para a juridica, sem dividir por 12. O campo 19 e a data de referencia de cada um.
  - id: ordem-dos-cotitulares
    description: >-
      Os cotitulares sao numerados 1, 2... na ordem em que o CRM guarda as partes da conta, que e a ordem de inclusao.
      O motor nao ordena por data de inicio do vinculo.
  - id: papel-do-procurador
    description: >-
      O CRM tem tres papeis (PRIMARY_HOLDER, LEGAL_REPRESENTATIVE, RESPONSIBLE_PARTY) e o campo 5 tem sete codigos. O
      binding do cliente declara qual codigo cada papel recebe; papel nao declarado recusa a geracao. O CRM nao define
      RESPONSIBLE_PARTY: o exemplo declara O (outros), e o cliente que o usa para procurador ou representante declara
      P ou R.
  - id: contrato-de-cambio
    description: >-
      Campo 28 (IN :164): nenhuma aplicacao Lerian registra contrato de cambio. O documento serve a instituicao que
      declara nao firmar contrato de cambio (operaCambio nao: 0 para toda pessoa); com operaCambio sim a geracao e
      recusada, porque nao ha fonte para o 1.
  - id: vinculo-removido
    description: >-
      Uma parte removida do instrumento pela API do CRM sai da lista sem deixar data de fim. O campo 21 so registra o
      fim do vinculo que o cadastro encerrou com a data, e o historico removido antes disso se perdeu.
