    message: >-
      A UF do endereço principal de quem mora no Brasil (país BR ou não informado) não está na tabela de UFs. A tabela
      aceita as 27 siglas, em maiúscula ou minúscula, sem espaço nem pontuação (" SP" não é aceito). O código 00 só
      vale para quem mora no exterior (IN 636, Anexo I, TITULARES, campo 14). Corrija a sigla no cadastro antes de
      gerar. Sem sigla, o campo 14 sai em branco, porque a informação não existe (IN 636, art. 2º, § 1º).

