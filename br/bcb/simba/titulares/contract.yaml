        type: date
        required: false
        description: Data de referência da renda declarada pela pessoa natural (IN 636, Anexo I, TITULARES, campo 19).
      - name: faturamento
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: >-
          Faturamento anual bruto declarado pela pessoa jurídica, na moeda de moedaFaturamento (só BRL sai), como está
          no cadastro (IN 636, Anexo I, TITULARES, campo 18). A IN pede a renda declarada e não fixa o período: o
