        required: false
        description: Telefone celular do cadastro (campo 17, IN :153). Preferido ao outro telefone.
      - name: outroTelefone
        type: string
        required: false
        description: Outro telefone do cadastro, usado sem celular (campo 17, IN :153).
      - name: renda
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Renda mensal bruta declarada pela pessoa natural, em reais (campo 18, IN :154).
      - name: dataRenda
        type: date
        required: false
        description: Data de referencia da renda declarada pela pessoa natural (campo 19, IN :155).
      - name: faturamento
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: >-
          Faturamento anual bruto declarado pela pessoa juridica, em reais, como esta no cadastro (campo 18, IN :154). A
          IN pede a renda declarada e nao fixa o periodo: o valor anual vai sem conversao.
      - name: dataFaturamento
        type: date
        required: false
        description: Data de referencia do faturamento declarado pela pessoa juridica (campo 19, IN :155).
      - name: dataInicio
        type: date
        required: false
        description: Abertura da conta, inicio do vinculo do titular (campo 20, IN :156).
      - name: dataFim
