        description: Numero da conta com o digito verificador, como o CRM o guarda (campo 3, IN :139).
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no codigo da IN (campo 4, IN :140).
      - name: tipoPessoa
        type: string
        required: true
        domain: ["1", "2"]
        description: 1 pessoa natural, 2 pessoa juridica (campo 7, IN :143).
      - name: documento
        type: string
        required: true
        normalize: alphanumeric
        pattern: '^([0-9]{11}|[0-9A-Z]{14})$'
        description: CPF ou CNPJ do titular, sem separadores (campo 8, IN :144).
      - name: nome
        type: string
        required: true
        description: Nome completo do titular (campo 9, IN :145). O template o corta em 80 posicoes.
      - name: logradouro
        type: string
        required: false
        description: Linha 1 do endereco principal (campo 12, IN :148). Ausente, o campo sai em branco.
      - name: complemento
        type: string
        required: false
        description: Linha 2 do endereco principal; o template a junta ao logradouro e corta em 80 (campo 12, IN :148).
      - name: codigoUf
        type: string
        required: false
        pattern: '^[0-9]{2}$'
