knownGaps:
  - id: so-titular
    description: >-
      As contas do caso são as que o documento investigado titula e as em que ele é cotitular (parte PRIMARY_HOLDER
      do instrumento, contas_cotitular). A conta em que ele é só representante legal ou RESPONSIBLE_PARTY não entra:
      a IN fala das contas investigadas e não diz se a conta de quem só representa o titular é uma delas.
  - id: cotitular-no-periodo
    description: >-
      A conta de que o investigado é cotitular entra quando a cotitularidade cruza o período pedido em um dia ao
      menos (start_date até o fim, e end_date ausente ou a partir do início). Com sobreposição parcial, o EXTRATO e
      o ORIGEM-DESTINO trazem todo o movimento da conta no período, inclusive os dias em que o investigado ainda não
      era cotitular ou já tinha saído: é movimento de conta de terceiro sem sigilo afastado nesses dias. A parte
      sem start_date (registro antigo) entra sempre; não se consulta a abertura da conta (opening_date), e a
      conferência avisa o cotitular sem o início do vínculo (TITULARES, campo 20). Nas bordas, o Reporter fecha o
      período no fuso configurado dele e o CRM grava a data do vínculo à meia-noite UTC: num fuso atrás de UTC, a
      cotitularidade que termina no primeiro dia do período fica fora, e a que começa no dia seguinte ao fim entra.
  - id: contas-de-contraparte
    description: >-
      As pessoas das contas de contraparte (CONTAS, campo 7 = 3) entram com o campo 6 pela pessoa (IN 636, Anexo I,
      TITULARES, campo 6): 1 se o documento está na ordem, 0 se não. Uma conta de contraparte que também é do caso sai
      uma vez, como conta do caso. Titular de conta de contraparte segue as mesmas regras de UF e país do da conta do
      caso (uf-do-brasil-contraparte e pais-na-tabela-contraparte).
  - id: excluida-do-crm
    description: >-
      Uma conta apagada do CRM (deleted_at) não entra. Uma conta encerrada (closing_date) entra, com a data no campo
      21 da linha do titular.
  - id: documento-de-identificacao
    description: >-
      Campos 10 e 11 (IN 636, Anexo I, TITULARES) sempre em branco: o CRM guarda só CPF/CNPJ, e nenhuma aplicação
      Lerian registra RG, CTPS, passaporte ou o documento constitutivo da pessoa jurídica. A IN não dá sentinela para
      esses campos.
  - id: dispositivos-cadastrados
    description: >-
      Campos 26 e 27 (IN 636, Anexo I, TITULARES) sempre em branco: nenhuma aplicação Lerian registra os dispositivos
      móveis ou os computadores cadastrados do cliente. A IN não dá sentinela para esses campos.
  - id: cidade-sem-codigo-ibge
    description: >-
      Campo 13 (IN 636, Anexo I, TITULARES) em branco para quem mora no Brasil: o CRM guarda o nome da cidade, sem o
      código IBGE, e a conversão do nome não é confiável. Para quem mora no exterior (país diferente de BR) sai
      0000000, o código que a IN dá para esse caso; ele não é usado no lugar do código faltante.
  - id: uf-fora-da-tabela
    description: >-
      O campo 14 converte a sigla da UF do endereço principal do titular para o código IBGE. Quem mora no Brasil (país
      BR ou ausente) com sigla fora da tabela (inclusive com espaço ou pontuação; a minúscula casa) recusa a geração
      (regra uf-do-brasil); corrija o cadastro antes de gerar. Sem sigla nenhuma, o campo 14 sai em branco: a
      informação não existe no cadastro (IN 636, art. 2º, § 1º). Quem mora no exterior sai com 00, e um país informado
      fora da tabela da Receita recusa a geração (regra pais-na-tabela).
  - id: parte-sem-cadastro
    description: >-
      A parte relacionada no instrumento do CRM tem só documento, nome, papel e datas. O endereço, o telefone e o nome
      social dela (campos 12 a 17 e 24) saem do cadastro de titulares do CRM, pelo documento da parte (cadastro_partes
      e cadastro_partes_contraparte); a renda e o e-mail (18, 19 e 25), só na linha do cotitular
      (renda-e-email-so-do-correntista). A parte que não tem cadastro de titular sai com os campos 12 a 19 e 24 em
      branco e o campo 25 com "e-mail nao declarado". O tipo de pessoa da parte (campo 7) continua pelo tamanho do
      documento. A parte é achada pelo documento como está gravado: o instrumento e o cadastro de titulares do CRM
      precisam ter o mesmo documento, sem pontos, traços ou barras; o CNPJ alfanumérico mantém as letras. Com
      separador num cadastro e não no outro (529.982.247-25 na parte, 52998224725 no titular), a parte não é achada e
      sai como sem cadastro, sem aviso.
  - id: renda-e-email-so-do-correntista
    description: >-
      Os campos 18 e 19 pedem a renda "declarada pelo correntista" (IN 636, Anexo I, TITULARES, campos 18 e 19;
      Memorando de Instrução MI 001 - ASSPA/PGR, leiaute do TITULARES, campo 18: "informada pelo correntista") e o 25
      o e-mail "declarado pelo titular" (IN 636, Anexo I, TITULARES, campo 25). O titular e o cotitular são
      correntistas e titulares da conta: saem com a renda e o e-mail do próprio cadastro. O representante legal, o
      representante, o procurador e as outras partes (campo 5 = L, R, P ou O) não são: saem com 18 e 19 em branco e o
      25 com "e-mail nao declarado", mesmo que tenham cadastro de titular no CRM, porque a informação que a IN pede
      não existe para eles (IN 636, art. 2º, § 1º). Os campos 12 a 17 e 24 são da pessoa e saem do cadastro dela em
      toda linha. A moeda da renda só é conferida de quem a imprime: o cotitular (renda_cotitulares, pelo documento
      das partes com o papel PRIMARY_HOLDER). A renda em outra moeda de um representante ou procurador não recusa a
      geração.
  - id: renda-pessoa-juridica
    description: >-
      Campo 18 (IN 636, Anexo I, TITULARES): a pessoa natural declara no CRM a renda mensal, e a pessoa jurídica o
      faturamento anual. A IN pede a renda declarada sem fixar o período; o campo leva o valor como declarado, mensal
      para a pessoa natural e anual para a jurídica, sem dividir por 12. O campo 19 é a data de referência de cada um.
  - id: ordem-dos-cotitulares
    description: >-
      Os cotitulares são numerados 1, 2... na ordem em que o CRM guarda as partes da conta, que é a ordem de inclusão.
      O motor não ordena por data de início do vínculo.
  - id: papel-do-procurador
    description: >-
      O CRM tem três papéis (PRIMARY_HOLDER, LEGAL_REPRESENTATIVE, RESPONSIBLE_PARTY) e o campo 5 tem sete códigos. O
      binding do cliente declara qual código cada papel recebe; papel não declarado recusa a geração. O CRM não define
      RESPONSIBLE_PARTY: o exemplo declara O (outros), e o cliente que o usa para procurador ou representante declara
      P ou R.
  - id: contrato-de-cambio
    description: >-
      Campo 28 (IN 636, Anexo I, TITULARES): nenhuma aplicação Lerian registra contrato de câmbio. O documento serve à
      instituição que declara não firmar contrato de câmbio (operaCambio "nao": 0 para toda pessoa); com operaCambio
      "sim", a geração é recusada, porque não há fonte para o 1.
  - id: vinculo-removido
    description: >-
      Uma parte removida do instrumento pela API do CRM sai da lista sem deixar data de fim. O campo 21 só registra o
      fim do vínculo que o cadastro encerrou com a data, e o histórico removido antes disso se perdeu.
