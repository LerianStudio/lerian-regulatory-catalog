# Contrato do arquivo III TITULARES do SIMBA (IN BCB 636/2025).
#
# QUEM CURA: a Lerian, a partir da transcricao oficial da IN BCB 636/2025 em
# br/bcb/simba/normas/IN-BCB-636-2025.md ("IN :N" abaixo e a linha dessa copia).
# Leiaute: art. 2o, III (IN :31), art. 3o (IN :57-73) e Anexo I, arquivo III
# Titulares, campos 1 a 28 (IN :135-164).
#
# O QUE E: uma linha por vinculo pessoa-conta. Para cada conta do arquivo CONTAS
# (as do caso e as de contraparte, IN :31): uma linha do titular (campo 5 = T) e
# uma linha por parte relacionada da conta no CRM (cotitular numerado 1, 2... por
# conta; representante legal, procurador e outros pelo codigo do campo 5). O cadastro
# da parte (endereco, telefone; renda e e-mail so do cotitular) e o de titular no CRM, pelo documento.
#
# FORMA DO ARQUIVO (IN art. 3o): texto ASCII, sem cabecalho, colunas separadas
# por TAB, linha terminada em CR LF, datas ddmmaaaa, valores em centavos sem
# separador (IN :73). A forma e do template; o formato de cada campo esta aqui.
#
# DE ONDE VEM CADA CAMPO: conta, tipo e partes relacionadas do instrumento do CRM
# do Midaz; dados da pessoa titular do cadastro de titulares do CRM; numero da
# agencia do cadastro de agencias do tenant (o mesmo do AGENCIAS); CNPJ da
# organizacao do Midaz; COMPE, nome no Unicad e se a instituicao firma contrato de
# cambio preenchidos pelo cliente no mapeamento.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentContract

metadata:
  id: br.bcb.simba.titulares
  country: BR
  regulator: BCB
  document: TITULARES            # o nome do arquivo na IN 636 art. 2º (AGENCIAS, CONTAS, TITULARES, EXTRATO, ORIGEM-DESTINO)
  family: simba
  title: SIMBA — Titulares
  summary: >-
    Titulares, cotitulares, representantes e procuradores das contas investigadas e das contas com que elas
    transacionaram, uma linha por vínculo da pessoa com a conta, com cadastro, renda e datas do vínculo.
  version: 1.3.0
  status: draft
  output: txt
  timezone: America/Sao_Paulo
  appliesTo:
    institutionTypes: [IP, SCD, SCFI]
  periodicity: eventual
  layout:
    version: "IN BCB 636/2025"
    mandatoryFrom: "2026-12-01"
  sourceOfTruth:
    layoutManual: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=636

parameters:
  - name: caso
    type: string
    required: true
    pattern: '^[0-9]{3}-[A-Z]{2,6}-[0-9]{6}-[0-9]{2}$'
    description: Número do caso SIMBA, como está na ordem.
  - name: documentos
    type: string
    multiple: true
    required: true
    description: >-
      CPFs e CNPJs da ordem, somente dígitos, sem pontos, traços ou barras: o documento formatado não encontra contas,
      e o caso sai como resposta vazia para ele, sem erro.
  - name: contas
    type: string
    multiple: true
    required: false
    description: >-
      Números de conta da ordem, com DV, só dígitos. Preencher só quando o ofício restringir a contas específicas; o
      normal é não preencher (ausente, todas as contas dos documentos). Preencher sem a ordem pedir omite contas do
      investigado.
  - name: inicio
    type: date
    required: true
    description: Primeiro dia do afastamento do sigilo.
  - name: fim
    type: date
    closed: true
    required: true
    notBefore: inicio
    description: Último dia do afastamento do sigilo.

filing:
  period: [caso]
  # Uma ordem pode ser gerada de novo (dado corrigido, cadastro completado). So a
  # geracao mais nova do mesmo caso pode ser aprovada: aprovar uma anterior
  # entregaria ao orgao o arquivo que a correcao ja substituiu.
  approve: newest

datasets:
  # Os campos 1, 22 e 23 sao da instituicao e se repetem em toda linha (IN :137,
  # :158, :159); o 28 (IN :164) sai da declaracao operaCambio.
  - name: instituicao
    description: A instituição que responde ao caso, uma linha.
    grain: singleton
    fields:
      - name: compe
        type: string
        required: true
        pattern: '^[0-9]{3}$'
        description: Código Compe da instituição, ou 999 quando ela não tem (IN 636, Anexo I, TITULARES, campo 1).
      - name: cnpj
        type: string
        length: 14
        required: true
        normalize: alphanumeric
        identifiesInstitution: true
        pattern: '^[0-9A-Z]{14}$'
        description: CNPJ da instituição (IN 636, Anexo I, TITULARES, campo 22).
      - name: nomeUnicad
        type: string
        required: true
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome da instituição como está no Unicad (IN 636, Anexo I, TITULARES, campo 23). O template o corta em 50
          posições.
      - name: operaCambio
        type: string
        required: true
        domain: ["nao", "sim"]
        description: >-
          Se a instituição firma contrato de câmbio. Com "nao", o campo 28 sai 0 para toda pessoa (IN 636, Anexo I,
          TITULARES, campo 28). Com "sim", a geração é recusada: nenhuma aplicação Lerian registra contrato de câmbio,
          e não há fonte para o 1 (knownGaps).

  # Uma linha por conta do caso: a do titular (campo 5 = T).
  - name: titulares
    description: O titular de cada conta do caso, com o cadastro dele no CRM.
    grain: [contaId]
    # Investigado sem conta na instituicao: nao ha arquivo a gerar (os arquivos sao das contas, IN art. 1o, :23, e
    # nao tem cabecalho, art. 3o, I, :59). Sem linha nenhuma a geracao e recusada antes de montar o arquivo, dizendo
    # o que cada consulta leu; a resposta negativa vai pelo atendimento da requisicao (CCS0012, situacao 03).
    nonEmpty: true
    consolidation:
      key: [contaId]
      whenKeyRepeats: refuse
      columns: {numeroAgencia: first, numeroConta: first, tipoConta: first, tipoPessoa: first, documento: first,
                nome: first, logradouro: first, complemento: first, codigoUf: first, pais: first, nomePais: first, cep: first,
                celular: first, outroTelefone: first, renda: first, dataRenda: first, moedaRenda: first, faturamento: first,
                dataFaturamento: first, moedaFaturamento: first, dataInicio: first, dataFim: first, nomeSocial: first, emailPrincipal: first,
                emailSecundario: first}
    fields:
      - name: contaId
        type: string
        required: true
        description: A conta do Midaz. Não vai ao arquivo; identifica a linha e liga as partes relacionadas.
      - name: numeroAgencia
        type: string
        required: true
        pattern: '^[0-9]{5}$'
        description: >-
          Número da agência sem DV, cinco dígitos; 00001 sem agência física (IN 636, Anexo I, TITULARES, campo 2).
      - name: numeroConta
        type: string
        required: true
        pattern: '^[^\t\r\n]{1,20}$'
        description: >-
          Número da conta com o dígito verificador, como o CRM o guarda (IN 636, Anexo I, TITULARES, campo 3).
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no código da IN (IN 636, Anexo I, TITULARES, campo 4).
      - name: tipoPessoa
        type: string
        required: true
        domain: ["1", "2"]
        description: 1 pessoa natural, 2 pessoa jurídica (IN 636, Anexo I, TITULARES, campo 7).
      - name: documento
        type: string
        required: true
        normalize: alphanumeric
        pattern: '^([0-9]{11}|[0-9A-Z]{14})$'
        description: CPF ou CNPJ do titular, sem separadores (IN 636, Anexo I, TITULARES, campo 8).
      - name: nome
        type: string
        required: true
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Nome completo do titular (IN 636, Anexo I, TITULARES, campo 9). O template o corta em 80 posições.
      - name: logradouro
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Linha 1 do endereço principal (IN 636, Anexo I, TITULARES, campo 12). Ausente, o campo sai em branco.
      - name: complemento
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Linha 2 do endereço principal; o template a junta ao logradouro e corta em 80 (IN 636, Anexo I, TITULARES,
          campo 12).
      - name: codigoUf
        type: string
        required: false
        description: >-
          Código IBGE da UF do endereço principal (IN 636, Anexo I, TITULARES, campo 14) quando a sigla está na
          tabela; a sigla crua quando não está; ausente quando o cadastro não tem sigla. Para quem mora no exterior o
          template escreve "00" em qualquer caso (IN 636, Anexo I, TITULARES, campo 14). Para quem mora no Brasil, a
          regra uf-do-brasil confere o valor na tabela de códigos: o que não for um código de UF recusa (sigla fora da
          tabela, com espaço ou pontuação, e também o "00" de um binding anterior), e o ausente deixa o campo 14 em
          branco, porque a informação não existe no cadastro (IN 636, art. 2º, § 1º; o campo 14 do Anexo I não dá
          sentinela para o Brasil).
      - name: pais
        type: string
        required: false
        description: >-
          País do endereço principal em ISO 3166-1 alfa-2 como o CRM guarda, em maiúscula ou minúscula. Com nome na
          tabela que não é Brasil, a pessoa mora no exterior: o template escreve "0000000" no campo 13 e "00" no campo
          14 (IN 636, Anexo I, TITULARES, campos 13 e 14). Ausente, é tratada como no Brasil.
      - name: nomePais
        type: string
        required: true
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome do país do endereço principal, da tabela de países da Receita (IN 636, Anexo I, TITULARES, campo 15);
          "-" quando o código falta ou está fora da tabela. O template escreve o nome, e nada para "-"; a regra
          pais-na-tabela recusa o código informado que não tem nome.
      - name: cep
        type: string
        required: false
        normalize: digits
        description: CEP do endereço principal, só dígitos (IN 636, Anexo I, TITULARES, campo 16).
      - name: celular
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Telefone celular do cadastro (IN 636, Anexo I, TITULARES, campo 17). Preferido ao outro telefone.
      - name: outroTelefone
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Outro telefone do cadastro, usado sem celular (IN 636, Anexo I, TITULARES, campo 17).
      - name: renda
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: >-
          Renda mensal bruta declarada pela pessoa natural (IN 636, Anexo I, TITULARES, campo 18), na moeda de
          moedaRenda (só BRL sai).
      - name: dataRenda
        type: date
        required: false
        description: Data de referência da renda declarada pela pessoa natural (IN 636, Anexo I, TITULARES, campo 19).
      - name: faturamento
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: >-
          Faturamento anual bruto declarado pela pessoa jurídica, na moeda de moedaFaturamento (só BRL sai), como está
          no cadastro (IN 636, Anexo I, TITULARES, campo 18). A IN pede a renda declarada e não fixa o período: o
          valor anual vai sem conversão.
      - name: dataFaturamento
        type: date
        required: false
        description: >-
          Data de referência do faturamento declarado pela pessoa jurídica (IN 636, Anexo I, TITULARES, campo 19).
      - name: moedaRenda
        type: string
        required: false
        pattern: '^([A-Z]{3})?$'
        description: >-
          A moeda da renda declarada (ISO 4217, como o cadastro a guarda). Não vai ao arquivo: só a renda em BRL sai
          (regra moeda-da-renda).
      - name: moedaFaturamento
        type: string
        required: false
        pattern: '^([A-Z]{3})?$'
        description: >-
          A moeda do faturamento declarado (ISO 4217, como o cadastro a guarda). Não vai ao arquivo: só o faturamento
          em BRL sai (regra moeda-do-faturamento).
      - name: dataInicio
        type: date
        required: false
        description: Abertura da conta, início do vínculo do titular (IN 636, Anexo I, TITULARES, campo 20).
      - name: dataFim
        type: date
        required: false
        description: >-
          Encerramento da conta, fim do vínculo do titular; ausente, a conta está aberta e o campo sai em branco (IN
          636, Anexo I, TITULARES, campo 21).
      - name: nomeSocial
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome social da pessoa natural (IN 636, Anexo I, TITULARES, campo 24). O template o corta em 50 posições.
      - name: emailPrincipal
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: E-mail principal (IN 636, Anexo I, TITULARES, campo 25).
      - name: emailSecundario
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: E-mail secundário, unido ao principal por ";" (IN 636, Anexo I, TITULARES, campo 25).

  # Uma linha por parte relacionada de cada conta do caso.
  - name: partes
    description: As partes relacionadas de cada conta do caso no CRM (cotitular, representante legal, procurador, outros).
    grain: [contaId, parteId]
    consolidation:
      key: [contaId, parteId]
      whenKeyRepeats: refuse
      columns: {numeroAgencia: first, numeroConta: first, tipoConta: first, vinculo: first, documento: first,
                nome: first, dataInicio: first, dataFim: first}
    fields:
      - name: contaId
        type: string
        required: true
        description: A conta do Midaz. Não vai ao arquivo; liga a parte ao titular da conta.
      - name: parteId
        type: string
        required: true
        description: O id da parte no CRM. Não vai ao arquivo; identifica a linha.
      - name: numeroAgencia
        type: string
        required: true
        pattern: '^[0-9]{5}$'
        description: >-
          Número da agência sem DV, cinco dígitos; 00001 sem agência física (IN 636, Anexo I, TITULARES, campo 2).
      - name: numeroConta
        type: string
        required: true
        pattern: '^[^\t\r\n]{1,20}$'
        description: >-
          Número da conta com o dígito verificador, como o CRM o guarda (IN 636, Anexo I, TITULARES, campo 3).
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no código da IN (IN 636, Anexo I, TITULARES, campo 4).
      - name: vinculo
        type: string
        required: true
        domain: ["C", "R", "L", "P", "O"]
        description: >-
          Papel da parte na conta (IN 636, Anexo I, TITULARES, campo 5). C é o cotitular, que o template numera 1,
          2... por conta; R representante, L representante legal, P procurador, O outros vão como estão.
      - name: documento
        type: string
        required: true
        normalize: alphanumeric
        pattern: '^([0-9]{11}|[0-9A-Z]{14})$'
        description: >-
          CPF ou CNPJ da parte, sem separadores (IN 636, Anexo I, TITULARES, campo 8). O tamanho dá o tipo de pessoa
          (campo 7).
      - name: nome
        type: string
        required: true
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome da parte como está no CRM (IN 636, Anexo I, TITULARES, campo 9). O template o corta em 80 posições.
      - name: dataInicio
        type: date
        required: false
        description: >-
          Início do vínculo da parte com a conta (IN 636, Anexo I, TITULARES, campo 20); ausente (registro antigo),
          o campo sai em branco e a conferência avisa (knownGap cotitular-no-periodo).
      - name: dataFim
        type: date
        required: false
        description: >-
          Fim do vínculo da parte; ausente, o vínculo está ativo e o campo sai em branco (IN 636, Anexo I, TITULARES,
          campo 21).


  # Uma linha por conta de contraparte: a do titular (campo 5 = T; campo 6 pela pessoa, IN :142).
  - name: titulares_contraparte
    description: >-
      O titular de cada conta da mesma instituição com que uma conta do caso transacionou no período (CONTAS, campo 7
      = 3), com o cadastro dele no CRM.
    grain: [contaId]
    consolidation:
      key: [contaId]
      whenKeyRepeats: refuse
      columns: {numeroAgencia: first, numeroConta: first, tipoConta: first, tipoPessoa: first, documento: first,
                nome: first, logradouro: first, complemento: first, codigoUf: first, pais: first, nomePais: first, cep: first,
                celular: first, outroTelefone: first, renda: first, dataRenda: first, moedaRenda: first, faturamento: first,
                dataFaturamento: first, moedaFaturamento: first, dataInicio: first, dataFim: first, nomeSocial: first, emailPrincipal: first,
                emailSecundario: first}
    fields:
      - name: contaId
        type: string
        required: true
        description: A conta do Midaz. Não vai ao arquivo; identifica a linha e liga as partes relacionadas.
      - name: numeroAgencia
        type: string
        required: true
        pattern: '^[0-9]{5}$'
        description: >-
          Número da agência sem DV, cinco dígitos; 00001 sem agência física (IN 636, Anexo I, TITULARES, campo 2).
      - name: numeroConta
        type: string
        required: true
        pattern: '^[^\t\r\n]{1,20}$'
        description: >-
          Número da conta com o dígito verificador, como o CRM o guarda (IN 636, Anexo I, TITULARES, campo 3).
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no código da IN (IN 636, Anexo I, TITULARES, campo 4).
      - name: tipoPessoa
        type: string
        required: true
        domain: ["1", "2"]
        description: 1 pessoa natural, 2 pessoa jurídica (IN 636, Anexo I, TITULARES, campo 7).
      - name: documento
        type: string
        required: true
        normalize: alphanumeric
        pattern: '^([0-9]{11}|[0-9A-Z]{14})$'
        description: CPF ou CNPJ do titular, sem separadores (IN 636, Anexo I, TITULARES, campo 8).
      - name: nome
        type: string
        required: true
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Nome completo do titular (IN 636, Anexo I, TITULARES, campo 9). O template o corta em 80 posições.
      - name: logradouro
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Linha 1 do endereço principal (IN 636, Anexo I, TITULARES, campo 12). Ausente, o campo sai em branco.
      - name: complemento
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Linha 2 do endereço principal; o template a junta ao logradouro e corta em 80 (IN 636, Anexo I, TITULARES,
          campo 12).
      - name: codigoUf
        type: string
        required: false
        description: >-
          Código IBGE da UF do endereço principal (IN 636, Anexo I, TITULARES, campo 14) quando a sigla está na
          tabela; a sigla crua quando não está; ausente quando o cadastro não tem sigla. Para quem mora no exterior o
          template escreve "00" em qualquer caso (IN 636, Anexo I, TITULARES, campo 14). Para quem mora no Brasil, a
          regra uf-do-brasil confere o valor na tabela de códigos: o que não for um código de UF recusa (sigla fora da
          tabela, com espaço ou pontuação, e também o "00" de um binding anterior), e o ausente deixa o campo 14 em
          branco, porque a informação não existe no cadastro (IN 636, art. 2º, § 1º; o campo 14 do Anexo I não dá
          sentinela para o Brasil).
      - name: pais
        type: string
        required: false
        description: >-
          País do endereço principal em ISO 3166-1 alfa-2 como o CRM guarda, em maiúscula ou minúscula. Com nome na
