  # A moeda da renda de quem a imprime numa linha de parte: o cotitular (campo 5 = 1, 2...), o
  # unico que leva os campos 18 e 19 (renda-e-email-so-do-correntista). Nao gera linha: so as
  # regras de moeda das partes o leem. O representante, o procurador e as outras partes ficam
  # fora, e a moeda do cadastro deles nao recusa a geracao.
  - name: renda_cotitulares
    description: >-
      A moeda da renda e do faturamento no cadastro de titulares do CRM dos cotitulares das contas do caso, pelo
      documento.
    grain: [documento]
    consolidation:
      key: [documento]
      whenKeyRepeats: refuse
      columns: {tipoPessoa: first, moedaRenda: first, moedaFaturamento: first}
    fields:
      - name: documento
        type: string
        required: true
        normalize: alphanumeric
        pattern: '^([0-9]{11}|[0-9A-Z]{14})$'
        description: CPF ou CNPJ da pessoa, sem separadores.
      - name: tipoPessoa
        type: string
        required: true
        domain: ["1", "2"]
        description: >-
          1 pessoa natural, 2 pessoa jurídica, do cadastro. Escolhe a moeda conferida, a da renda ou a do faturamento.
      - name: moedaRenda
        type: string
        required: false
        pattern: '^([A-Z]{3})?$'
        description: >-
          A moeda da renda declarada (ISO 4217, como o cadastro a guarda). Não vai ao arquivo: só a renda em BRL sai
          (regra moeda-da-renda-partes).
      - name: moedaFaturamento
        type: string
        required: false
        pattern: '^([A-Z]{3})?$'
        description: >-
          A moeda do faturamento declarado (ISO 4217, como o cadastro a guarda). Não vai ao arquivo: só o faturamento
          em BRL sai (regra moeda-do-faturamento-partes).

  # A moeda da renda de quem a imprime numa linha de parte: o cotitular (campo 5 = 1, 2...), o
  # unico que leva os campos 18 e 19 (renda-e-email-so-do-correntista). Nao gera linha: so as
  # regras de moeda das partes o leem. O representante, o procurador e as outras partes ficam
  # fora, e a moeda do cadastro deles nao recusa a geracao.
  - name: renda_cotitulares_contraparte
    description: >-
      A moeda da renda e do faturamento no cadastro de titulares do CRM dos cotitulares das contas de contraparte, pelo
      documento.
    grain: [documento]
    consolidation:
