knownGaps:
  - id: numeracao-entre-geracoes
    description: >-
      O EXTRATO e o ORIGEM-DESTINO são gerados um a um. Um lançamento gravado entre as duas gerações desloca os
      números (campo 2); gere os dois de novo e confira que o número de lançamentos é o mesmo.
  - id: ted-cifrada
    description: >-
      O plugin de TED grava cifrados o documento do recebedor e os dados do pagador da TED recebida. Na TED enviada saem
      banco, agência, conta e nome; o CPF/CNPJ (campo 10) e o tipo de pessoa (campo 9) em branco, com o motivo no campo
      18. Na TED recebida sai só o banco (campo 5); agência, conta, tipo de pessoa, CPF/CNPJ e nome (campos 6, 7, 9, 10
      e 11) em branco, com o motivo no campo 18 (OBSERVACAO), e não o 00001, que diz que não há agência física (IN 636,
      Anexo I, ORIGEM-DESTINO, campo 6). O tipo de conta (IN 636, Anexo I, ORIGEM-DESTINO, campo 8), como o plugin o
      grava, sai só para CACC (1), SVGS (2) e, na TED recebida, PP (2) e CI (3); a conta de pagamento e, na recebida, a
      CD (mais de um código possível na IN), a CG e a SLRY, o tipo ausente (só na recebida; na enviada o tipo é
      obrigatório) e o fora do domínio saem em branco, com o motivo no campo 18. No Pix lerian, CACC 1 e SVGS 2 (domínio
      do SPI); no Pix JD, tpConta 0 e 2 (descritos pelo fornecedor como os do SPI) saem 1 e 2. TRAN, SLRY, OTHR, ausente
      e fora do domínio saem em branco com motivo; no Pix JD o tipo só existe no Pix entre contas da própria
      instituição.
  - id: devolucao-e-estorno
    description: >-
      Devolução e estorno não herdam a contraparte da transação original, e as linhas de devolução dos plugins não são
      lidas nesta versão: a devolução e o revert do Midaz saem com a outra perna interna ou com a linha vazia. Exceção:
      o débito com a metadata de uma TED recebida, a devolução (revert do Midaz) ou o estorno pedido pelo banco
      remetente (lançamento novo com a mesma metadata), sai com o remetente da TED recebida (banco, e o mesmo motivo dos
      dados cifrados), porque o dinheiro volta a ele. A cobrança de dívida de tarifa (FEE_SETTLEMENT) que o Midaz grava
      na mesma transação do crédito é tarifa, não contraparte.
  - id: tipo-de-conta-do-trilho
    description: >-
      O tipo da conta da contraparte de outra instituição (IN 636, Anexo I, ORIGEM-DESTINO, campo 8) só sai com código
      onde o tipo que o plugin grava casa com a IN ao pé da letra: conta corrente (1), poupança (2), investimento (3, só
      na TED). Conta de pagamento e de depósito (mais de um código possível na IN; a de pagamento é 6 só quando
      pré-paga), garantida, salário e PI, e o tipo ausente ou fora do domínio, saem em branco com o motivo no campo 18.
  - id: cnpj-da-instituicao-externa
    description: >-
      O campo 19 da contraparte de outra instituição sai do ISPB pela lista de participantes ativos do Pix
      (tabelas/ParticipantesPix.csv), a única lista do Banco Central com o CNPJ. Fica em branco, com o motivo no
      campo 18, quando o plugin não grava o ISPB ou quando a instituição não é participante ativa do Pix (uma TED
      com banco que só participa do STR, por exemplo): nenhuma tabela pública do Banco Central dá esse CNPJ.
  - id: chave-pix-da-contraparte
    description: >-
      Os campos 25 e 26 (chave Pix da contraparte) saem do plugin no Pix enviado (a chave do recebedor: no Pix
      lerian, da iniciação do Pix, transfer_initiations; no Pix JD, da transação) e no Pix JD recebido, quando o plugin
      grava a chave do pagador. No Pix lerian recebido saem em branco: o pagador não usa chave, e o plugin não a grava.
  - id: contraparte-interna-pelo-valor
    description: >-
      A outra perna interna só é contraparte quando tem a natureza oposta e o mesmo valor do lançamento. Assim a perna
      de tarifa de quem pagou não vira contraparte; em troca, uma transferência repartida em pernas de valores
      diferentes (um débito para duas contas) sai com a linha vazia.
  - id: plugin-de-outra-empresa
    description: >-
      Contraparte liquidada por provedor que não é plugin Lerian não é lida: sai a outra perna interna ou a linha
      vazia.
  - id: campos-sem-fonte-no-midaz
    description: >-
      O Midaz e os plugins não possuem o documento de identificação da contraparte (campos 12 e 13; Pix e TED trazem
      só o CPF/CNPJ), nem boleto e cheque, que não são produtos Lerian (campos 14 a 16 e 20 a 24) (IN 636, Anexo I,
      ORIGEM-DESTINO). Cada um é um campo opcional do lançamento, mapeado como manual com o motivo: a instituição o
      traz de uma base dela (consulta juntada à de lancamentos_dados pelo id da operação) ou o
      corrige linha a linha no rascunho. Vazio, sai em branco. Saem em toda linha do lançamento (trilho, outra
      perna interna, tarifa e linha vazia). Nunca dê a um desses campos um valor fixo no mapeamento: ele se
      repetiria em todo lançamento.
  - id: ispb-numerico
    description: >-
      O ISPB tem de chegar como texto de oito dígitos. Um ISPB que chegue como número com casas decimais sai como
      código 999.
  - id: so-titular
    description: >-
      As contas do caso são as que o documento investigado titula e as em que ele é cotitular (parte PRIMARY_HOLDER
      do instrumento, contas_cotitular). A conta em que ele é só representante legal ou RESPONSIBLE_PARTY não entra:
      a IN fala das contas investigadas e não diz se a conta de quem só representa o titular é uma delas.
  - id: cotitular-no-periodo
    description: >-
      A conta de que o investigado é cotitular entra quando a cotitularidade cruza o período pedido em um dia ao
      menos (start_date até o fim, e end_date ausente ou a partir do início). Com sobreposição parcial, o EXTRATO e
      o ORIGEM-DESTINO trazem todo o movimento da conta no período, inclusive os dias em que o investigado ainda não
      era cotitular ou já tinha saído: é movimento de conta de terceiro sem sigilo afastado nesses dias. A parte
      sem start_date (registro antigo) entra sempre; não se consulta a abertura da conta (opening_date), e a
      conferência avisa o cotitular sem o início do vínculo (TITULARES, campo 20). Nas bordas, o Reporter fecha o
      período no fuso configurado dele e o CRM grava a data do vínculo à meia-noite UTC: num fuso atrás de UTC, a
      cotitularidade que termina no primeiro dia do período fica fora, e a que começa no dia seguinte ao fim entra.
