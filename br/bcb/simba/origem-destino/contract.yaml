          Tipo de conta do recebedor como o plugin o grava (em claro): CACC, SVGS, SLRY ou uma grafia de conta de
          pagamento (CPAY, PG, PAYMENT, TRAN, 4), os que a API do plugin aceita. O template o traduz no campo 8 do
          ORIGEM-DESTINO (IN 636, Anexo I): CACC 1, SVGS 2; conta de pagamento e SLRY saem em branco, com o motivo no
          campo 18, e outro valor também, com o motivo de fora do domínio. Obrigatório: toda TED enviada que chega ao OD
