# Contrato do arquivo V ORIGEM-DESTINO do SIMBA (IN BCB 636/2025).
#
# QUEM CURA: a Lerian, a partir da transcricao oficial da IN BCB 636/2025 em
# br/bcb/simba/normas/IN-BCB-636-2025.md ("IN :N" abaixo e a linha dessa copia).
# Leiaute: art. 2o, V (IN :35), art. 3o (IN :57-73) e Anexo I, arquivo V
# Origem-Destino, campos 1 a 28 (IN :198-229).
#
# O QUE E: uma ou mais linhas por lancamento do EXTRATO, dizendo quem esta do outro
# lado. Todo lancamento do EXTRATO tem pelo menos uma linha aqui (IN :170, "vinculando
# cada registro do arquivo EXTRATO aos seus correspondentes registros"): o campo 2 e
# o numero do lancamento no EXTRATO. Os dois documentos leem o MESMO conjunto
# `lancamentos`, na mesma ordem, e numeram do mesmo jeito.
#
# FORMA DO ARQUIVO (IN art. 3o): texto ASCII, sem cabecalho, colunas separadas
# por TAB, linha terminada em CR LF, valores em centavos sem separador (IN :73).
#
# DE ONDE VEM A CONTRAPARTE, nesta ordem: a propria instituicao na perna de tarifa;
# a linha do plugin da transacao (Pix lerian, Pix JD, TED), lida no banco do plugin;
# a outra perna da mesma transacao, de natureza oposta e mesmo valor, quando e conta
# de cliente no CRM; senao uma linha vazia com a observacao "contraparte nao identificada pelo trilho".

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentContract

metadata:
  id: br.bcb.simba.origem-destino
  country: BR
  regulator: BCB
  document: ORIGEM-DESTINO          # o nome do arquivo na IN 636 art. 2º (AGENCIAS, CONTAS, TITULARES, EXTRATO, ORIGEM-DESTINO)
  family: simba
  title: SIMBA — Origem-Destino
  summary: >-
    Origem e destino dos recursos de cada lançamento do EXTRATO: a contraparte pelo plugin
    Pix ou TED da transação, pela outra perna interna, ou a própria instituição na tarifa.
  version: 1.3.0
  status: draft
  output: txt
  timezone: America/Sao_Paulo
  appliesTo:
    institutionTypes: [IP, SCD, SCFI]
  periodicity: eventual
  layout:
    version: "IN BCB 636/2025"
    mandatoryFrom: "2026-12-01"
  sourceOfTruth:
    layoutManual: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=636

parameters:
  - name: caso
    type: string
    required: true
    pattern: '^[0-9]{3}-[A-Z]{2,6}-[0-9]{6}-[0-9]{2}$'
    description: Número do caso SIMBA, como está na ordem.
  - name: documentos
    type: string
    multiple: true
    required: true
    description: >-
      CPFs e CNPJs da ordem, somente dígitos, sem pontos, traços ou barras: o documento formatado não encontra
      contas, e o caso sai como resposta vazia para ele, sem erro.
  - name: contas
    type: string
    multiple: true
    required: false
    description: >-
      Números de conta da ordem, com DV, só dígitos. Preencher só quando o ofício restringir a contas específicas; o
      normal é não preencher (ausente, todas as contas dos documentos). Preencher sem a ordem pedir omite contas do
      investigado.
  - name: inicio
    type: date
    required: true
    description: Primeiro dia do afastamento do sigilo.
  - name: fim
    type: date
    closed: true
    required: true
    notBefore: inicio
    description: Último dia do afastamento do sigilo.

filing:
  period: [caso]
  # Uma ordem pode ser gerada de novo (dado corrigido, cadastro completado). So a
  # geracao mais nova do mesmo caso pode ser aprovada: aprovar uma anterior
  # entregaria ao orgao o arquivo que a correcao ja substituiu.
  approve: newest
  # Conta do caso sem lancamento no periodo sai no CONTAS com o campo 7 = 2 (IN :126) e nao
  # tem linha aqui; sem lancamento em nenhuma conta do caso, o arquivo sai vazio (0 byte),
  # sem cabecalho (IN art. 3o, I, :59), e e entregue assim.
  allowEmpty: true

datasets:
  # A instituicao: contraparte da perna de tarifa e da outra perna interna (campos 5,
  # 9, 10, 11 e 19 da propria instituicao).
  - name: instituicao
    description: A instituição que responde ao caso, uma linha.
    grain: singleton
    fields:
      - name: compe
        type: string
        required: true
        pattern: '^[0-9]{3}$'
        description: Código Compe da instituição, ou 999 quando ela não tem (IN 636, Anexo I, ORIGEM-DESTINO, campo 5, na contraparte interna).
      - name: cnpj
        type: string
        length: 14
        required: true
        normalize: alphanumeric
        identifiesInstitution: true
        pattern: '^[0-9A-Z]{14}$'
        description: CNPJ da instituição (IN 636, Anexo I, ORIGEM-DESTINO, campos 10 e 19 na tarifa, 19 na contraparte interna).
      - name: nomeUnicad
        type: string
        required: true
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Nome da instituição como está no Unicad (campo 11 na tarifa). O template o corta em 80 posições.

  # O CONJUNTO QUE O ORIGEM-DESTINO TAMBEM LE, igual nos dois contratos: o numero do
  # lancamento e a posicao dele aqui. A consulta que o entrega agrupa por
  # (transacao, operacao, ...), o que fixa a ordem das linhas; cada operacao e um grupo.
  - name: lancamentos
    description: Os lançamentos das contas do caso no período, um por operação, na ordem da consulta.
    grain: [transacaoId, operacaoId]
    consolidation:
      key: [transacaoId, operacaoId]
      whenKeyRepeats: refuse
      columns: {contaId: first, numeroAgencia: first, numeroConta: first, tipoConta: first,
                dataLancamento: first, horaLancamento: first, descricao: first, descricaoTransacao: first,
                valor: first, natureza: first, naturezaOposta: first, tipoOperacao: first, saldoApos: first, rail: first, fluxo: first, direcao: first,
                agregado: first, tipoPagamento: first, tipoIniciacao: first, e2eEnvio: first,
                iniciacao: first, e2eRecebimento: first, devolucao: first, e2eOriginal: first, nomeDocIdentificacaoOd: first, numeroDocIdentificacaoOd: first, codigoBarras: first, nomeEndossante: first, docEndossante: first, beneficiarioBoleto: first, pagadorBoleto: first, cnpjEmissoraBoleto: first, nomeEmissoraBoleto: first, valorNominalBoleto: first}
    fields:
      - name: operacaoId
        type: string
        required: true
        description: A operação do Midaz. Não vai ao arquivo; identifica a linha e a perna de tarifa.
      - name: transacaoId
        type: string
        required: true
        description: A transação do Midaz. Não vai ao arquivo; liga o estorno, a metadata e a sessão (campo 27).
      - name: contaId
        type: string
        required: true
        description: A conta do Midaz do lançamento. Não vai ao arquivo.
      - name: numeroAgencia
        type: string
        required: true
        pattern: '^[0-9]{1,5}$'
        description: >-
          Número da agência sem DV como o CRM grava (`banking_details.branch`), até cinco dígitos; o template
          completa com zeros à esquerda (IN 636, Anexo I, EXTRATO, campo 3).
      - name: numeroConta
        type: string
        required: true
        pattern: '^[^\t\r\n]{1,20}$'
        description: Número da conta com o dígito verificador, como o CRM o guarda (IN 636, Anexo I, EXTRATO, campo 4).
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no código da IN (IN 636, Anexo I, EXTRATO, campo 5).
      - name: dataLancamento
        type: date
        required: true
        description: Data do lançamento, no dia civil de Brasília (IN 636, Anexo I, EXTRATO, campo 6).
      - name: horaLancamento
        type: string
        required: true
        pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|\+00:00)$'
        description: >-
          O instante do lançamento em UTC; o template escreve hhmmss (IN 636, Anexo I, EXTRATO, campo 23; IN 636, art.
          3º, VI). Instante em outro fuso recusa a geração, em vez de sair a hora local.
      - name: descricao
        type: string
        required: false
        description: Descrição da operação no Midaz (IN 636, Anexo I, EXTRATO, campo 8). O template corta em 100 posições.
      - name: descricaoTransacao
        type: string
        required: false
        description: Descrição da transação no Midaz, usada quando a da operação vem vazia (campo 8).
      - name: valor
        type: decimal
        required: true
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Valor do lançamento em reais, sem sinal (IN 636, Anexo I, EXTRATO, campo 10). O template escreve centavos.
      - name: natureza
        type: string
        required: true
        domain: ["C", "D"]
        description: Natureza do lançamento, C crédito ou D débito (IN 636, Anexo I, EXTRATO, campo 11).
      - name: naturezaOposta
        type: string
        required: true
        domain: ["C", "D"]
        description: A natureza da outra perna (D para um crédito, C para um débito). Só o ORIGEM-DESTINO a lê.
      - name: tipoOperacao
        type: string
        required: true
        description: >-
          O tipo da operação no Midaz (operation.type): DEBIT, CREDIT, OVERDRAFT (a parcela do cheque especial), BLOCK e
          UNBLOCK (bloqueio e desbloqueio judicial) ou, na cobrança de dívida de tarifa, FEE_SETTLEMENT e FEE_REFUND,
          que o motor grava sem feeLeg e são perna de tarifa.
      - name: saldoApos
        type: decimal
        required: true
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Saldo disponível da conta após o lançamento, como o Midaz o gravou (IN 636, Anexo I, EXTRATO, campos 12 e 13).
      - name: rail
        type: string
        required: false
        description: Trilho gravado pelo plugin na metadata da transação (TED, PIX, INTERNAL). Decide o campo 9.
      - name: fluxo
        type: string
        required: false
        description: Fluxo gravado pelo plugin (CASH_OUT, CASH_IN, P2P, REFUND, MED, AUTOMATIC_DEBIT). Decide o campo 9.
      - name: direcao
        type: string
        required: false
        description: Direção gravada pelo plugin em relação à conta do cliente (IN, OUT). Vazia, vale a natureza.
      - name: agregado
        type: string
        required: false
        description: Id do registro do plugin TED ou Pix JD que a transação liquida. Liga a contraparte do ORIGEM-DESTINO.
      - name: tipoPagamento
        type: string
        required: false
        description: payment_type do Pix lerian (PIX_IN no recebimento).
      - name: tipoIniciacao
        type: string
        required: false
        description: initiation_type do Pix lerian (MANUAL, DICT, QR_CODE, AUTO).
      - name: e2eEnvio
        type: string
        required: false
        description: end_to_end_id do envio do Pix lerian.
      - name: iniciacao
        type: string
        required: false
        description: initiation_id do envio do Pix lerian.
      - name: e2eRecebimento
        type: string
        required: false
        description: inbound_end_to_end_id do recebimento do Pix lerian.
      - name: devolucao
        type: string
        required: false
        description: refund_id da devolução do Pix lerian.
      - name: e2eOriginal
        type: string
        required: false
        description: original_end_to_end_id da devolução do Pix lerian.
      - name: nomeDocIdentificacaoOd
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome do documento de identificação do ordenante ou beneficiário que não seja CPF, como RG ou passaporte (IN
          636, Anexo I, ORIGEM-DESTINO, campo 12). Pix e TED trazem só o CPF/CNPJ. O template o corta em 50 posições.
      - name: numeroDocIdentificacaoOd
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Número e complemento do documento de identificação do ordenante ou beneficiário (IN 636, Anexo I,
          ORIGEM-DESTINO, campo 13). O template o corta em 20 posições.
      - name: codigoBarras
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Código de barras do boleto, com o DV e os separadores (IN 636, Anexo I, ORIGEM-DESTINO, campo 14). Boleto
          não é produto Lerian. O template o corta em 100 posições.
      - name: nomeEndossante
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome do endossante do cheque (IN 636, Anexo I, ORIGEM-DESTINO, campo 15). Cheque não é produto Lerian. O
          template o corta em 80 posições.
      - name: docEndossante
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome, número e complemento do documento do endossante do cheque (IN 636, Anexo I, ORIGEM-DESTINO, campo 16).
          O template o corta em 50 posições.
      - name: beneficiarioBoleto
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome do cedente beneficiário do boleto (IN 636, Anexo I, ORIGEM-DESTINO, campo 20). O template o corta em
          250 posições.
      - name: pagadorBoleto
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome do sacado pagador do boleto (IN 636, Anexo I, ORIGEM-DESTINO, campo 21). O template o corta em 250
          posições.
      - name: cnpjEmissoraBoleto
        type: string
        required: false
        pattern: '^[0-9A-Z]{14}$'
        description: >-
          CNPJ da instituição que emitiu o boleto, sem separadores (IN 636, Anexo I, ORIGEM-DESTINO, campo 22).
      - name: nomeEmissoraBoleto
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: >-
          Nome da instituição que emitiu o boleto, como no Unicad (IN 636, Anexo I, ORIGEM-DESTINO, campo 23). O
          template o corta em 50 posições.
      - name: valorNominalBoleto
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: >-
          Valor nominal do boleto em reais (IN 636, Anexo I, ORIGEM-DESTINO, campo 24). O template escreve centavos.

  # Operacoes que o motor de tarifas do Midaz marcou com feeLeg = "true": o campo 9
  # sai 105 (tarifas), depois da regra do estorno.
  - name: taxas
    description: As operações dos lançamentos que são a perna de tarifa de uma transação.
    grain: [operacaoId]
    consolidation:
      key: [operacaoId]
      whenKeyRepeats: refuse
      columns: {}
    fields:
      - name: operacaoId
        type: string
        required: true
        description: A operação de tarifa. Não vai ao arquivo.

  # As pernas das transacoes dos lancamentos que sao conta de cliente no CRM. A
  # contraparte interna de um lancamento e a perna da mesma transacao com a natureza
  # oposta e o mesmo valor (a perna de tarifa de quem pagou, de outro valor, fica fora).
  - name: pernas
    description: As pernas em conta do CRM das transações dos lançamentos, uma por operação.
    grain: [operacaoId]
    consolidation:
      key: [operacaoId]
      whenKeyRepeats: refuse
      columns: {transacaoId: first, contaId: first, valor: first, natureza: first, numeroAgencia: first,
                numeroConta: first, tipoConta: first, titularId: first}
    fields:
      - name: operacaoId
        type: string
        required: true
        description: A operação do Midaz. Não vai ao arquivo.
      - name: transacaoId
        type: string
        required: true
        description: A transação do Midaz. Não vai ao arquivo.
      - name: contaId
        type: string
        required: true
        description: A conta do Midaz da perna. Não vai ao arquivo.
      - name: valor
        type: decimal
        required: true
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Valor da perna em reais (IN 636, Anexo I, ORIGEM-DESTINO, campo 3). O template escreve centavos.
      - name: natureza
        type: string
        required: true
        domain: ["C", "D"]
        description: Natureza da perna, C crédito ou D débito.
      - name: numeroAgencia
        type: string
        required: true
        pattern: '^[0-9]{1,5}$'
        description: >-
          Número da agência sem DV como o CRM grava (`banking_details.branch`), até cinco dígitos; o template
          completa com zeros à esquerda (IN 636, Anexo I, ORIGEM-DESTINO, campo 6).
      - name: numeroConta
        type: string
        required: true
        normalize: digits
        pattern: '^[0-9]{1,20}$'
        description: >-
          Número da conta com o dígito verificador, só dígitos (IN 636, Anexo I, ORIGEM-DESTINO, campo 7, Numérico; IN
          636, art. 3º, VII, sem formatação): o CRM guarda a conta como recebeu, às vezes com hífen.
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no código da IN (IN 636, Anexo I, ORIGEM-DESTINO, campo 8).
      - name: titularId
        type: string
        required: false
        description: O titular da conta no CRM (holder_id). Não vai ao arquivo; acha o cadastro.

  # O cadastro do titular de cada conta das outras pernas.
  - name: titulares_od
    description: Tipo de pessoa, documento e nome do titular de cada conta das outras pernas.
    grain: [titularId]
    consolidation:
      key: [titularId]
      whenKeyRepeats: refuse
      columns: {tipoPessoa: first, documento: first, nome: first}
    fields:
      - name: titularId
        type: string
        required: true
        description: O titular no CRM. Não vai ao arquivo.
      - name: tipoPessoa
        type: string
        required: true
        domain: ["1", "2"]
        description: 1 pessoa natural, 2 jurídica (IN 636, Anexo I, ORIGEM-DESTINO, campo 9).
      - name: documento
        type: string
        required: false
        normalize: alphanumeric
        pattern: '^([0-9]{11}|[0-9A-Z]{14})$'
        description: CPF ou CNPJ do titular, só dígitos e, no CNPJ alfanumérico, letras maiúsculas (IN 636, Anexo I, ORIGEM-DESTINO, campo 10).
      - name: nome
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Nome do titular (IN 636, Anexo I, ORIGEM-DESTINO, campo 11). O template o corta em 80 posições.

  # A contraparte pela linha do plugin que liquidou a transacao: um conjunto por
  # plugin e sentido (cada um le uma consulta que espera a metadata da transacao). A
  # referencia e o E2E (Pix lerian) ou o id da linha no plugin (Pix JD, TED: o
  # aggregateId da metadata); um lancamento acha no maximo uma linha.
  - name: trilho_pix_lerian_envios
    description: Os Pix enviados pelo Pix lerian; a contraparte é o destino.
    grain: [referencia]
    consolidation:
      key: [referencia]
      whenKeyRepeats: refuse
      columns: {ispb: first, agencia: first, conta: first, documento: first, nome: first, comentario: first, txid: first, tipoChave: first, chave: first, tipoConta: first, tipoContaInformado: first}
    fields:
      - name: referencia
        type: string
        required: true
        description: O E2E do Pix. Não vai ao arquivo.
      - name: ispb
        type: string
        required: false
        pattern: '^[0-9]{8}$'
        description: ISPB da instituição da contraparte, oito dígitos como texto; o template o converte no Compe (IN 636, Anexo I, ORIGEM-DESTINO, campo 5).
      - name: agencia
        type: string
        required: false
        normalize: digits
        pattern: '^[0-9]{1,5}$'
        description: Agência da contraparte como o plugin a grava, só dígitos (IN 636, Anexo I, ORIGEM-DESTINO, campo 6).
      - name: conta
        type: string
        required: false
        normalize: digits
        pattern: '^[0-9]{1,20}$'
        description: Conta da contraparte como o plugin a grava, só dígitos (IN 636, Anexo I, ORIGEM-DESTINO, campo 7).
      - name: documento
        type: string
        required: false
        normalize: alphanumeric
        pattern: '^([0-9]{11}|[0-9A-Z]{14})$'
        description: CPF ou CNPJ da contraparte, só dígitos e, no CNPJ alfanumérico, letras maiúsculas (IN 636, Anexo I, ORIGEM-DESTINO, campo 10). O tamanho decide o campo 9.
      - name: nome
        type: string
        required: false
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Nome da contraparte (IN 636, Anexo I, ORIGEM-DESTINO, campo 11). O template o corta em 80 posições.
      - name: comentario
        type: string
        required: false
