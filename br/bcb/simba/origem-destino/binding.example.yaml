# Binding do SIMBA ORIGEM-DESTINO — QUEM PREENCHE E O CLIENTE.
#
# Exemplo preenchido contra o Midaz (`midaz_onboarding`, `midaz_transaction`), a
# metadata do Midaz (`midaz_metadata`), o CRM do Midaz (`plugin_crm`) e os bancos
# dos plugins (`pix_lerian`, `pix_jd`, `bank_transfer`), lidos direto. Cliente sem um
# dos plugins apaga as consultas dele e a fonte `also` correspondente.
#
# MESMA NUMERACAO DO EXTRATO: `lancamentos_dados` e as consultas que ela junta
# (`lancamentos_descricao`, `contas_lancamento`, `metadados_transacao`) e `taxas_lancamento` tem o MESMO texto
# nos dois bindings, e o conjunto `lancamentos` tem o mesmo grao e os campos do
# ORIGEM-DESTINO no EXTRATO (o EXTRATO le tambem os saldos; test_simba confere).
#
# A CONTRAPARTE, nesta ordem: a propria instituicao na perna de tarifa; a linha do
# plugin da transacao (Pix lerian, Pix JD, TED); a outra perna da mesma transacao,
# quando e conta de cliente no CRM e tem o mesmo valor (a perna de tarifa de quem
# pagou fica fora); senao uma linha vazia com a observacao. As
# outras pernas saem de `outras_pernas` e `contas_contraparte`, o MESMO texto do
# CONTAS, e o titular de cada uma de `contraparte_titulares`, o MESMO texto do
# TITULARES.
#
# O ISPB da contraparte (campo 5) chega ao template como TEXTO de 8 digitos; o
# template o converte no codigo Compe.
#
# Filtro encadeado `{query, column}`: grafia provisoria do motor; se
# mudar, e `sed` nos bindings.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentBinding

contract: br.bcb.simba.origem-destino
contractVersion: 1.0.0

queries:

  - name: declarante
    description: A organizacao do Midaz, que e a instituicao que responde ao caso. O CNPJ dela e o do arquivo.
    dataSource: midaz_onboarding
    table: organization
    filters:
      - field: deleted_at
        operator: isNull

  # As contas do caso: as que o documento investigado TITULA (cotitular, representante e
  # procurador nao entram). Excluida do CRM fica fora; encerrada entra.
  - name: contas_do_caso
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: document, operator: in, values: [{parameter: documentos}]}
      - {field: banking_details.account, operator: in, values: [{parameter: contas}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id, document, banking_details.branch, banking_details.account, regulatory_fields.account_type, banking_details.type, banking_details.opening_date, banking_details.closing_date]

  - name: lancamentos
    description: Lancamentos das contas do caso no periodo, so a transacao de cada um.
    dataSource: midaz_transaction
    table: operation
    filters:
      - {field: account_id, operator: in, values: [{query: contas_do_caso, column: account_id}]}
      - {field: balance_affected, operator: eq, values: ["true"]}
      - {field: type, operator: nin, values: ["ON_HOLD", "RELEASE"]}
      - {field: asset_code, operator: eq, values: ["BRL"]}
      - {field: deleted_at, operator: isNull}
      - {field: created_at, operator: gte, values: [{parameter: inicio, at: start}]}
      - {field: created_at, operator: lt, values: [{parameter: fim, at: end}]}
    select: [transaction_id, account_id]

  - name: lancamentos_dados
    description: Os lancamentos das contas do caso no periodo, com a conta, a metadata da transacao e a descricao.
    dataSource: midaz_transaction
    table: operation
    filters:
      - {field: account_id, operator: in, values: [{query: contas_do_caso, column: account_id}]}
      - {field: balance_affected, operator: eq, values: ["true"]}
      - {field: amount, operator: gt, values: ["0"]}
      - {field: type, operator: nin, values: ["ON_HOLD", "RELEASE"]}
      - {field: asset_code, operator: eq, values: ["BRL"]}
      - {field: deleted_at, operator: isNull}
      - {field: created_at, operator: gte, values: [{parameter: inicio, at: start}]}
      - {field: created_at, operator: lt, values: [{parameter: fim, at: end}]}
    compute:
      - as: natureza
        case:
          column: direction
          when:
            credit: {constant: "C"}
            debit: {constant: "D"}
          otherwise: refuse
      # A natureza da contraparte, para achar a outra perna no ORIGEM-DESTINO.
      - as: natureza_oposta
        case:
          column: direction
          when:
            credit: {constant: "D"}
            debit: {constant: "C"}
          otherwise: refuse
    join:
      - query: lancamentos_descricao
        match: {id: id}
      - query: contas_lancamento
        match: {account_id: account_id}
      - query: metadados_transacao
        match: {transaction_id: entity_id}
    # Agrupar por (transacao, operacao, ...) da uma linha por operacao e fixa a ordem:
    # o motor ordena uma leitura agrupada pela chave, e uma leitura sem agrupamento
    # nao tem ordem. A transacao vem primeiro para as operacoes de uma transacao
    # ficarem juntas (sessao, campo 27 do EXTRATO). So colunas que nunca sao nulas nem
    # vazias: chave vazia recusa a leitura inteira, por isso as descricoes vem de
    # `lancamentos_descricao`.
    aggregate:
      groupBy: [transaction_id, id, account_id, created_at, natureza, natureza_oposta, available_balance_after, balance_key]
      measures:
        - as: valor
          fn: sum
          of: amount

  # A descricao da operacao e a da transacao (a operacao pode vir com descricao vazia).
  - name: lancamentos_descricao
    description: A descricao de cada lancamento do caso no periodo e a da transacao dele.
    dataSource: midaz_transaction
    table: operation
    filters:
      - {field: account_id, operator: in, values: [{query: contas_do_caso, column: account_id}]}
      - {field: balance_affected, operator: eq, values: ["true"]}
      - {field: asset_code, operator: eq, values: ["BRL"]}
      - {field: deleted_at, operator: isNull}
      - {field: created_at, operator: gte, values: [{parameter: inicio, at: start}]}
      - {field: created_at, operator: lt, values: [{parameter: fim, at: end}]}
    join:
      - table: transaction
        match: {transaction_id: id}
        columns: {descricao_transacao: description}
    # O saldo bloqueado e o cheque especial usado depois do lancamento entram no saldo
    # da conta (EXTRATO 12 e 13): o disponivel do Midaz nao fica abaixo de zero nem conta
    # o bloqueado. O cheque especial usado fica no snapshot da operacao, ausente em
    # operacao gravada antes de o Midaz guardar o snapshot.
    select: [id, description, descricao_transacao, on_hold_balance_after, snapshot.overdraftUsedAfter]

  - name: contas_lancamento
    description: Agencia, numero e tipo de cada conta do caso.
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: account_id, operator: in, values: [{query: contas_do_caso, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: numero_agencia
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "00001"}
            "0002": {constant: "00002"}
          otherwise: refuse
      - as: tipo_conta
        case:
          column: regulatory_fields.account_type
          when:
            DEPOSIT: {constant: "1"}
            SAVINGS: {constant: "2"}
            INVESTMENT: {constant: "3"}
            OTHER_FINANCIAL_INVESTMENTS: {constant: "4"}
            NON_RESIDENT: {constant: "5"}
            PAYMENT: {constant: "6"}
          otherwise: refuse
    select: [account_id, banking_details.account, numero_agencia, tipo_conta]

  # A metadata que os plugins gravam na transacao do Midaz (Mongo do Midaz, colecao
  # `transaction`): rail, flow, direction, aggregateId e endToEndId do contrato de
  # correlacao (TED e Pix JD); payment_type, initiation_type e os E2E do Pix lerian.
  - name: metadados_transacao
    description: A metadata de cada transacao dos lancamentos do caso.
    dataSource: midaz_metadata
    table: transaction
    filters:
      - {field: entity_id, operator: in, values: [{query: lancamentos, column: transaction_id}]}
      - {field: deleted_at, operator: isNull}
    select: [entity_id, metadata.rail, metadata.flow, metadata.direction, metadata.aggregateId, metadata.endToEndId, metadata.payment_type, metadata.initiation_type, metadata.end_to_end_id, metadata.initiation_id, metadata.inbound_end_to_end_id, metadata.refund_id, metadata.original_end_to_end_id]

  # A perna de tarifa: o motor de tarifas do Midaz grava feeLeg = "true" na metadata
  # da operacao que ele criou (colecao `operation`).
  - name: taxas_lancamento
    description: As operacoes dos lancamentos do caso que sao perna de tarifa.
    dataSource: midaz_metadata
    table: operation
    filters:
      - {field: entity_id, operator: in, values: [{query: lancamentos_dados, column: id}]}
      - {field: metadata.feeLeg, operator: eq, values: ["true"]}
      - {field: deleted_at, operator: isNull}
    select: [entity_id]

  # As pernas das transacoes dos lancamentos que sao conta de cliente no CRM (o junte
  # e `inner`): a outra perna interna e a contraparte quando nenhum plugin a da.
  - name: pernas_lancamento
    description: As pernas das transacoes dos lancamentos do caso em conta do CRM, com agencia, conta, tipo, valor e natureza.
    dataSource: midaz_transaction
    table: operation
    filters:
      - {field: transaction_id, operator: in, values: [{query: lancamentos, column: transaction_id}]}
      - {field: balance_affected, operator: eq, values: ["true"]}
      - {field: amount, operator: gt, values: ["0"]}
      - {field: type, operator: nin, values: ["ON_HOLD", "RELEASE"]}
      - {field: asset_code, operator: eq, values: ["BRL"]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: natureza
        case:
          column: direction
          when:
            credit: {constant: "C"}
            debit: {constant: "D"}
          otherwise: refuse
    join:
      - query: contas_od_dados
        match: {account_id: account_id}
        type: inner
    select: [id, transaction_id, account_id, amount, natureza]

  - name: outras_pernas
    description: As pernas das transacoes dos lancamentos do caso.
    dataSource: midaz_transaction
    table: operation
    filters:
      - {field: transaction_id, operator: in, values: [{query: lancamentos, column: transaction_id}]}
      - {field: balance_affected, operator: eq, values: ["true"]}
      - {field: type, operator: nin, values: ["ON_HOLD", "RELEASE"]}
      - {field: asset_code, operator: eq, values: ["BRL"]}
      - {field: deleted_at, operator: isNull}
    select: [account_id]

  - name: contas_contraparte
    description: Os ids das contas das outras pernas que tem instrumento no CRM.
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: account_id, operator: in, values: [{query: outras_pernas, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id]

  - name: contraparte_titulares
    description: O titular (holder_id) de cada conta de contraparte.
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: account_id, operator: in, values: [{query: contas_contraparte, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id, holder_id]

  # As contas das outras pernas que sao conta de cliente no CRM.
  - name: contas_od_dados
    description: Agencia, numero, tipo e titular (holder_id) das contas das outras pernas.
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: account_id, operator: in, values: [{query: contas_contraparte, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: numero_agencia
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "00001"}
            "0002": {constant: "00002"}
          otherwise: refuse
      - as: tipo_conta
        case:
          column: regulatory_fields.account_type
          when:
            DEPOSIT: {constant: "1"}
            SAVINGS: {constant: "2"}
            INVESTMENT: {constant: "3"}
            OTHER_FINANCIAL_INVESTMENTS: {constant: "4"}
            NON_RESIDENT: {constant: "5"}
            PAYMENT: {constant: "6"}
          otherwise: refuse
    select: [account_id, holder_id, numero_agencia, tipo_conta, banking_details.account]

  - name: cadastro_od
    description: Nome, documento e tipo de pessoa do titular de cada conta das outras pernas.
    dataSource: plugin_crm
    table: holders
    filters:
      - {field: _id, operator: in, values: [{query: contraparte_titulares, column: holder_id}]}
    compute:
      - as: tipo_pessoa
        case:
          column: type
          when:
            NATURAL_PERSON: {constant: "1"}
            LEGAL_PERSON: {constant: "2"}
          otherwise: refuse
    select: [_id, document, name, tipo_pessoa]

  # CONTRAPARTE PELO PLUGIN DA TRANSACAO. Uma consulta por plugin e sentido; cada uma
  # le so as linhas que a metadata da transacao aponta. TED e Pix JD: o aggregateId
  # do contrato de correlacao e o id da linha no plugin. Pix lerian (sem esse
  # contrato): o E2E gravado na metadata (end_to_end_id no envio,
  # inbound_end_to_end_id no recebimento). Devolucoes ficam fora: saem com a outra
  # perna interna ou com a linha vazia (manual).
  - name: pix_lerian_envios
    description: Pix enviados pelo Pix lerian; a contraparte e o destino.
    dataSource: pix_lerian
    table: transfers
    filters:
      - {field: end_to_end_id, operator: in, values: [{query: metadados_transacao, column: metadata.end_to_end_id}]}
      - {field: direction, operator: eq, values: ["OUTBOUND"]}
    select: [end_to_end_id, destination_ispb, destination_branch, destination_account_number, destination_tax_id, destination_name, description, tx_id]

  - name: pix_lerian_recebimentos
    description: Pix recebidos pelo Pix lerian; a contraparte e a origem.
    dataSource: pix_lerian
    table: transfers
    filters:
      - {field: end_to_end_id, operator: in, values: [{query: metadados_transacao, column: metadata.inbound_end_to_end_id}]}
      - {field: direction, operator: eq, values: ["INBOUND"]}
    select: [end_to_end_id, source_ispb, source_branch, source_account_number, source_tax_id, source_name, description, tx_id]

  # Pix JD: flow 2 e o envio (CASH_OUT), flow 1 o recebimento (CASH_IN); a linha de
  # devolucao (is_refund) fica fora.
  - name: pix_jd_envios
    description: Pix enviados pelo Pix JD; a contraparte e o recebedor (payee).
    dataSource: pix_jd
    table: transaction
    filters:
      - {field: id, operator: in, values: [{query: metadados_transacao, column: metadata.aggregateId}]}
      - {field: flow, operator: eq, values: ["2"]}
      - {field: is_refund, operator: eq, values: ["false"]}
      - {field: deleted_at, operator: isNull}
    select: [id, end_to_end_id, payee_bank_id, payee_branch, payee_account_number, payee_account_digit, payee_document, payee_name, description, conciliation_id]

  - name: pix_jd_recebimentos
    description: Pix recebidos pelo Pix JD; a contraparte e o pagador (payer).
    dataSource: pix_jd
    table: transaction
    filters:
      - {field: id, operator: in, values: [{query: metadados_transacao, column: metadata.aggregateId}]}
      - {field: flow, operator: eq, values: ["1"]}
      - {field: is_refund, operator: eq, values: ["false"]}
      - {field: deleted_at, operator: isNull}
    select: [id, end_to_end_id, payer_bank_id, payer_branch, payer_account_number, payer_account_digit, payer_document, payer_name, description, conciliation_id]

  # TED: o recebedor da TED enviada esta em claro em recipient_details; o documento
  # dele e o pagador da TED recebida (exceto o ISPB) ficam fora (cifrados no plugin).
  - name: ted_enviadas
    description: TEDs enviadas pelo plugin de TED; a contraparte e o recebedor.
    dataSource: bank_transfer
    table: transfers
    filters:
      - {field: id, operator: in, values: [{query: metadados_transacao, column: metadata.aggregateId}]}
      - {field: type, operator: eq, values: ["TED_OUT"]}
    select: [id, recipient_details.ispb, recipient_details.branch, recipient_details.account, recipient_details.holderName]

  - name: ted_recebidas
    description: TEDs recebidas pelo plugin de TED; da contraparte, so o ISPB do pagador.
    dataSource: bank_transfer
    table: transfers
    filters:
      - {field: id, operator: in, values: [{query: metadados_transacao, column: metadata.aggregateId}]}
      - {field: type, operator: eq, values: ["TED_IN"]}
    select: [id, sender_ispb]

datasets:

  instituicao:
    from:
      query: declarante
    fields:
      cnpj:
        from: query
        column: legal_document
      compe:
        from: manual
        pendingReason: "o codigo Compe da instituicao, 3 digitos; 999 se ela nao tem codigo Compe"
      nomeUnicad:
        from: manual
        pendingReason: "o nome da instituicao exatamente como esta no Unicad do Banco Central"

  lancamentos:
    from:
      query: lancamentos_dados
    fields:
      operacaoId: {from: query, column: id}
      transacaoId: {from: query, column: transaction_id}
      contaId: {from: query, column: account_id}
      numeroAgencia: {from: query, column: numero_agencia}
      numeroConta: {from: query, column: banking_details.account}
      tipoConta: {from: query, column: tipo_conta}
      dataLancamento: {from: query, column: created_at}
      horaLancamento: {from: query, column: created_at}
      descricao: {from: query, column: description}
      descricaoTransacao: {from: query, column: descricao_transacao}
      valor: {from: query, column: valor}
      natureza: {from: query, column: natureza}
      naturezaOposta: {from: query, column: natureza_oposta}
      saldoApos: {from: query, column: available_balance_after}
      chaveSaldo: {from: query, column: balance_key}
      rail: {from: query, column: metadata.rail}
      fluxo: {from: query, column: metadata.flow}
      direcao: {from: query, column: metadata.direction}
      agregado: {from: query, column: metadata.aggregateId}
      e2e: {from: query, column: metadata.endToEndId}
      tipoPagamento: {from: query, column: metadata.payment_type}
      tipoIniciacao: {from: query, column: metadata.initiation_type}
      e2eEnvio: {from: query, column: metadata.end_to_end_id}
      iniciacao: {from: query, column: metadata.initiation_id}
      e2eRecebimento: {from: query, column: metadata.inbound_end_to_end_id}
      devolucao: {from: query, column: metadata.refund_id}
      e2eOriginal: {from: query, column: metadata.original_end_to_end_id}

  taxas:
    from:
      query: taxas_lancamento
    fields:
      operacaoId: {from: query, column: entity_id}

  pernas:
    from:
      query: pernas_lancamento
    fields:
      operacaoId: {from: query, column: id}
      transacaoId: {from: query, column: transaction_id}
      contaId: {from: query, column: account_id}
      valor: {from: query, column: amount}
      natureza: {from: query, column: natureza}
      numeroAgencia: {from: query, column: numero_agencia}
      numeroConta: {from: query, column: banking_details.account}
      tipoConta: {from: query, column: tipo_conta}
      titularId: {from: query, column: holder_id}

  titulares_od:
    from:
      query: cadastro_od
    fields:
      titularId: {from: query, column: _id}
      tipoPessoa: {from: query, column: tipo_pessoa}
      documento: {from: query, column: document}
      nome: {from: query, column: name}

  trilho_pix_lerian_envios:
    from:
      query: pix_lerian_envios
    fields:
      referencia: {from: query, column: end_to_end_id}
      ispb: {from: query, column: destination_ispb}
      agencia: {from: query, column: destination_branch}
      conta: {from: query, column: destination_account_number}
      documento: {from: query, column: destination_tax_id}
      nome: {from: query, column: destination_name}
      comentario: {from: query, column: description}
      txid: {from: query, column: tx_id}
      e2e: {from: query, column: end_to_end_id}

  trilho_pix_lerian_recebimentos:
    from:
      query: pix_lerian_recebimentos
    fields:
      referencia: {from: query, column: end_to_end_id}
      ispb: {from: query, column: source_ispb}
      agencia: {from: query, column: source_branch}
      conta: {from: query, column: source_account_number}
      documento: {from: query, column: source_tax_id}
      nome: {from: query, column: source_name}
      comentario: {from: query, column: description}
      txid: {from: query, column: tx_id}
      e2e: {from: query, column: end_to_end_id}

  trilho_pix_jd_envios:
    from:
      query: pix_jd_envios
    fields:
      referencia: {from: query, column: id}
      ispb: {from: query, column: payee_bank_id}
      agencia: {from: query, column: payee_branch}
      conta: {from: query, column: payee_account_number}
      digito: {from: query, column: payee_account_digit}
      documento: {from: query, column: payee_document}
      nome: {from: query, column: payee_name}
      comentario: {from: query, column: description}
      txid: {from: query, column: conciliation_id}
      e2e: {from: query, column: end_to_end_id}

  trilho_pix_jd_recebimentos:
    from:
      query: pix_jd_recebimentos
    fields:
      referencia: {from: query, column: id}
      ispb: {from: query, column: payer_bank_id}
      agencia: {from: query, column: payer_branch}
      conta: {from: query, column: payer_account_number}
      digito: {from: query, column: payer_account_digit}
      documento: {from: query, column: payer_document}
      nome: {from: query, column: payer_name}
      comentario: {from: query, column: description}
      txid: {from: query, column: conciliation_id}
      e2e: {from: query, column: end_to_end_id}

  trilho_ted_enviadas:
    from:
      query: ted_enviadas
    fields:
      referencia: {from: query, column: id}
      ispb: {from: query, column: recipient_details.ispb}
      agencia: {from: query, column: recipient_details.branch}
      conta: {from: query, column: recipient_details.account}
      nome: {from: query, column: recipient_details.holderName}

  trilho_ted_recebidas:
    from:
      query: ted_recebidas
    fields:
      referencia: {from: query, column: id}
      ispb: {from: query, column: sender_ispb}

manualOverrides: []
