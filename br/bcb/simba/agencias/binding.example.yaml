# Binding do SIMBA AGENCIAS — QUEM PREENCHE E O CLIENTE.
#
# Exemplo preenchido contra o Midaz e o CRM do Midaz (`plugin_crm`). As contas do
# caso saem de `contas_do_caso`, a mesma consulta (mesmo texto) nos bindings de
# CONTAS, TITULARES, EXTRATO e ORIGEM-DESTINO: trocar de onde vem o conjunto de
# contas do caso e trocar SO essa consulta. As demais leem os ids dela.
#
# O CADASTRO DE AGENCIAS E DO TENANT. Agencia nao e entidade no Midaz nem no CRM:
# o CRM guarda so o numero (`banking_details.branch`, texto livre). Cada atributo
# da agencia e um `case` por esse numero, preenchido UMA vez na implantacao. Os
# valores abaixo sao SINTETICOS: "0001" e uma agencia digital (a instituicao nao
# tem agencia fisica, campo 14 = 2) e "0002" uma agencia fisica ficticia. Uma
# agencia que `possui_agencia_fisica` nao lista recusa a geracao: cadastre todas.
# O mesmo cadastro vai no binding do CONTAS (numero da agencia em 5 digitos).
#
# Filtro encadeado `{query, column}`: grafia provisoria do motor; se
# mudar, e `sed` nos bindings.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentBinding

contract: br.bcb.simba.agencias
contractVersion: 1.0.0

queries:
  - name: declarante
    description: A organizacao do Midaz, que e a instituicao que responde ao caso. O CNPJ dela e o do arquivo.
    dataSource: midaz_onboarding
    table: organization
    filters:
      - field: deleted_at
        operator: isNull

  # As contas do caso (esqueleto EB2.2 § 3, interina: so o TITULAR; o cotitular e
  # decisao pendente). Excluida do CRM fica fora; encerrada entra.
  - name: contas_do_caso
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: document, operator: in, values: [{parameter: documentos}]}
      - {field: banking_details.account, operator: in, values: [{parameter: contas}]}
      - {field: deleted_at, operator: isNull}
    select: [account_id, document, banking_details.branch, banking_details.account, regulatory_fields.account_type, banking_details.type, banking_details.opening_date, banking_details.closing_date]

  # A agencia de cada conta do caso, com o cadastro do tenant.
  - name: agencias_caso
    description: As contas do caso, lidas de novo para levar o cadastro da agencia de cada uma.
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: account_id, operator: in, values: [{query: contas_do_caso, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: numero_agencia
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "00001"}
            "0002": {constant: "00002"}
          otherwise: refuse
      - as: possui_agencia_fisica
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "2"}
            "0002": {constant: "1"}
          otherwise: refuse
      - as: nome_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "AGENCIA EXEMPLO"}
          otherwise: {constant: ""}
      - as: endereco_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "RUA EXEMPLO, 100, SALA 1"}
          otherwise: {constant: ""}
      - as: codigo_cidade
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "3550308"}
          otherwise: {constant: ""}
      - as: codigo_uf
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "35"}
          otherwise: {constant: ""}
      - as: pais_agencia
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "Brasil"}
            "0002": {constant: "Brasil"}
          otherwise: refuse
      - as: cep_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "01000000"}
          otherwise: {constant: ""}
      - as: telefone_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "1100000000"}
          otherwise: {constant: ""}
      - as: data_abertura_agencia
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "2020-01-01"}
            "0002": {constant: "2020-01-01"}
          otherwise: {constant: ""}
      - as: data_fechamento_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: ""}
          otherwise: {constant: ""}

  # Os lancamentos das contas do caso no periodo do afastamento, para achar as
  # outras pernas (contas com que elas transacionaram, IN art. 2o, I, :27).
  - name: lancamentos
    description: Lancamentos das contas do caso no periodo, so a transacao de cada um.
    dataSource: midaz_transaction
    table: operation
    filters:
      - {field: account_id, operator: in, values: [{query: contas_do_caso, column: account_id}]}
      - {field: balance_affected, operator: eq, values: ["true"]}
      - {field: asset_code, operator: eq, values: ["BRL"]}
      - {field: deleted_at, operator: isNull}
      - {field: created_at, operator: gte, values: [{parameter: inicio, at: start}]}
      - {field: created_at, operator: lt, values: [{parameter: fim, at: end}]}
    select: [transaction_id, account_id]

  # Toda perna das mesmas transacoes. Inclui a propria conta do caso (o motor nao
  # tem `nin` com valores de consulta): o template nao repete agencia ja escrita.
  - name: outras_pernas
    description: As pernas das transacoes dos lancamentos do caso.
    dataSource: midaz_transaction
    table: operation
    filters:
      - {field: transaction_id, operator: in, values: [{query: lancamentos, column: transaction_id}]}
      - {field: balance_affected, operator: eq, values: ["true"]}
      - {field: asset_code, operator: eq, values: ["BRL"]}
      - {field: deleted_at, operator: isNull}
    select: [account_id]

  # A agencia de cada conta das outras pernas que esta no CRM. Conta de sistema
  # ou de liquidacao (sem instrumento no CRM) nao e conta de cliente e nao entra.
  - name: agencias_contraparte
    description: As contas das outras pernas que tem instrumento no CRM, com o cadastro da agencia.
    dataSource: plugin_crm
    table: aliases
    filters:
      - {field: account_id, operator: in, values: [{query: outras_pernas, column: account_id}]}
      - {field: deleted_at, operator: isNull}
    compute:
      - as: numero_agencia
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "00001"}
            "0002": {constant: "00002"}
          otherwise: refuse
      - as: possui_agencia_fisica
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "2"}
            "0002": {constant: "1"}
          otherwise: refuse
      - as: nome_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "AGENCIA EXEMPLO"}
          otherwise: {constant: ""}
      - as: endereco_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "RUA EXEMPLO, 100, SALA 1"}
          otherwise: {constant: ""}
      - as: codigo_cidade
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "3550308"}
          otherwise: {constant: ""}
      - as: codigo_uf
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "35"}
          otherwise: {constant: ""}
      - as: pais_agencia
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "Brasil"}
            "0002": {constant: "Brasil"}
          otherwise: refuse
      - as: cep_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "01000000"}
          otherwise: {constant: ""}
      - as: telefone_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: "1100000000"}
          otherwise: {constant: ""}
      - as: data_abertura_agencia
        case:
          column: banking_details.branch
          when:
            "0001": {constant: "2020-01-01"}
            "0002": {constant: "2020-01-01"}
          otherwise: {constant: ""}
      - as: data_fechamento_agencia
        case:
          column: banking_details.branch
          when:
            "0002": {constant: ""}
          otherwise: {constant: ""}

datasets:
  instituicao:
    from:
      query: declarante
    fields:
      cnpj:
        from: query
        column: legal_document
      compe:
        from: manual
        pendingReason: "o codigo Compe da instituicao, 3 digitos; 999 se ela nao tem codigo Compe"
      nomeUnicad:
        from: manual
        pendingReason: "o nome da instituicao exatamente como esta no Unicad do Banco Central"

  agencias_do_caso:
    from:
      query: agencias_caso
    fields:
      contaId: {from: query, column: account_id}
      numeroAgencia: {from: query, column: numero_agencia}
      possuiAgenciaFisica: {from: query, column: possui_agencia_fisica}
      nomeAgencia: {from: query, column: nome_agencia}
      endereco: {from: query, column: endereco_agencia}
      codigoCidade: {from: query, column: codigo_cidade}
      codigoUf: {from: query, column: codigo_uf}
      pais: {from: query, column: pais_agencia}
      cep: {from: query, column: cep_agencia}
      telefone: {from: query, column: telefone_agencia}
      dataAbertura: {from: query, column: data_abertura_agencia}
      dataFechamento: {from: query, column: data_fechamento_agencia}

  agencias_contraparte:
    from:
      query: agencias_contraparte
    fields:
      contaId: {from: query, column: account_id}
      numeroAgencia: {from: query, column: numero_agencia}
      possuiAgenciaFisica: {from: query, column: possui_agencia_fisica}
      nomeAgencia: {from: query, column: nome_agencia}
      endereco: {from: query, column: endereco_agencia}
      codigoCidade: {from: query, column: codigo_cidade}
      codigoUf: {from: query, column: codigo_uf}
      pais: {from: query, column: pais_agencia}
      cep: {from: query, column: cep_agencia}
      telefone: {from: query, column: telefone_agencia}
      dataAbertura: {from: query, column: data_abertura_agencia}
      dataFechamento: {from: query, column: data_fechamento_agencia}

manualOverrides: []
