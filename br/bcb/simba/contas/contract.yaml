# Contrato do arquivo II CONTAS do SIMBA (IN BCB 636/2025).
#
# QUEM CURA: a Lerian, a partir da transcricao oficial da IN BCB 636/2025 em
# br/bcb/simba/normas/IN-BCB-636-2025.md ("IN :N" abaixo e a linha dessa copia).
# Leiaute: art. 2o, II (IN :29), art. 3o (IN :57-73) e Anexo I, arquivo II
# Contas, campos 1 a 12 (IN :116-132).
#
# O QUE E: uma linha por conta. Entram as contas investigadas (as do caso) e as
# contas da mesma instituicao com as quais elas transacionaram no periodo (IN
# :29; campo 7 codigo 3, IN :126), cada conta uma vez so.
#
# FORMA DO ARQUIVO (IN art. 3o): texto ASCII, sem cabecalho, colunas separadas
# por TAB, linha terminada em CR LF, datas ddmmaaaa, valores em centavos sem
# separador (IN :73). A forma e do template; o formato de cada campo esta aqui.
#
# DE ONDE VEM CADA CAMPO: conta, tipo, abertura e encerramento do CRM do Midaz;
# saldos da soma dos lancamentos do Midaz ate a data; numero da agencia do
# cadastro de agencias do tenant (o mesmo do AGENCIAS); CNPJ da organizacao do
# Midaz; COMPE e nome no Unicad preenchidos pelo cliente no mapeamento.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentContract

metadata:
  id: br.bcb.simba.contas
  country: BR
  regulator: BCB
  document: CONTAS            # o nome do arquivo na IN 636 art. 2º (AGENCIAS, CONTAS, TITULARES, EXTRATO, ORIGEM-DESTINO)
  family: simba
  title: SIMBA — Contas
  summary: >-
    Contas investigadas e contas da mesma instituição com as quais elas transacionaram
    no período do afastamento do sigilo, com abertura, encerramento e saldos.
  version: 1.1.0
  status: draft
  output: txt
  timezone: America/Sao_Paulo
  appliesTo:
    institutionTypes: [IP, SCD, SCFI]
  periodicity: eventual
  layout:
    version: "IN BCB 636/2025"
    mandatoryFrom: "2026-12-01"
  sourceOfTruth:
    layoutManual: https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?tipo=Instru%C3%A7%C3%A3o%20Normativa%20BCB&numero=636

parameters:
  - name: caso
    type: string
    required: true
    pattern: '^[0-9]{3}-[A-Z]{2,6}-[0-9]{6}-[0-9]{2}$'
    description: Número do caso SIMBA, como está na ordem.
  - name: documentos
    type: string
    multiple: true
    required: true
    description: >-
      CPFs e CNPJs da ordem, somente dígitos, sem pontos, traços ou barras: o documento formatado não encontra
      contas, e o caso sai como resposta vazia para ele, sem erro.
  - name: contas
    type: string
    multiple: true
    required: false
    description: >-
      Números de conta da ordem, com DV, só dígitos. Preencher só quando o ofício restringir a contas específicas; o
      normal é não preencher (ausente, todas as contas dos documentos). Preencher sem a ordem pedir omite contas do
      investigado.
  - name: inicio
    type: date
    required: true
    description: Primeiro dia do afastamento do sigilo.
  - name: fim
    type: date
    closed: true
    required: true
    notBefore: inicio
    description: Último dia do afastamento do sigilo.

filing:
  period: [caso]
  # Uma ordem pode ser gerada de novo (dado corrigido, cadastro completado). So a
  # geracao mais nova do mesmo caso pode ser aprovada: aprovar uma anterior
  # entregaria ao orgao o arquivo que a correcao ja substituiu.
  approve: newest

datasets:
  # Os campos 1, 8 e 9 sao da instituicao e se repetem em toda linha (IN :118,
  # :127, :128).
  - name: instituicao
    description: A instituição que responde ao caso, uma linha.
    grain: singleton
    fields:
      - name: compe
        type: string
        required: true
        pattern: '^[0-9]{3}$'
        description: Código Compe da instituição, ou 999 quando ela não tem (IN 636, Anexo I, CONTAS, campo 1).
      - name: cnpj
        type: string
        length: 14
        required: true
        normalize: alphanumeric
        identifiesInstitution: true
        pattern: '^[0-9A-Z]{14}$'
        description: CNPJ da instituição (IN 636, Anexo I, CONTAS, campo 8).
      - name: nomeUnicad
        type: string
        required: true
        pattern: '^[\x20-\x7E\t\r\nªºÀÁÂÃÄÇÈÉÊËÌÍÎÏÑÒÓÔÕÖÙÚÛÜàáâãäçèéêëìíîïñòóôõöùúûü]*$'
        description: Nome da instituição como está no Unicad (IN 636, Anexo I, CONTAS, campo 9). O template o corta em 50 posições.

  # Dois conjuntos porque o motor nao une duas consultas. A conta das outras
  # pernas que tambem e do caso sai so uma vez, como investigada (template).
  - name: contas_investigadas
    description: As contas do caso. Campo 7 = 1 com lançamento no período, 2 sem.
    grain: [contaId]
    # Investigado sem conta na instituicao: nao ha arquivo a gerar (os arquivos sao das contas, IN art. 1o, :23, e
    # nao tem cabecalho, art. 3o, I, :59). Sem linha nenhuma a geracao e recusada antes de montar o arquivo, dizendo
    # o que cada consulta leu; a resposta negativa vai pelo atendimento da requisicao (CCS0012, situacao 03).
    nonEmpty: true
    consolidation:
      key: [contaId]
      whenKeyRepeats: refuse
      columns: {numeroAgencia: first, numeroConta: first, tipoConta: first, dataAbertura: first, dataEncerramento: first,
                saldoInicial: first, saldoFinal: first, volumePeriodo: first}
    fields:
      - name: contaId
        type: string
        required: true
        description: A conta do Midaz. Não vai ao arquivo; identifica a linha.
      - name: numeroAgencia
        type: string
        required: true
        pattern: '^[0-9]{5}$'
        description: Número da agência sem DV, cinco dígitos; 00001 sem agência física (IN 636, Anexo I, CONTAS, campo 2).
      - name: numeroConta
        type: string
        required: true
        pattern: '^[^\t\r\n]{1,20}$'
        description: Número da conta com o dígito verificador, como o CRM o guarda (IN 636, Anexo I, CONTAS, campo 3).
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no código da IN (IN 636, Anexo I, CONTAS, campo 4).
      - name: dataAbertura
        type: date
        required: false
        description: Data de abertura da conta (IN 636, Anexo I, CONTAS, campo 5). Sem sentinela na IN; ausente, sai em branco.
      - name: dataEncerramento
        type: date
        required: false
        description: Data de encerramento da conta; ausente, a conta está aberta e sai 31129999 (IN 636, Anexo I, CONTAS, campo 6).
      - name: saldoInicial
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Saldo da conta no início do primeiro dia do afastamento, em reais (IN 636, Anexo I, CONTAS, campo 10). Ausente, a conta não tinha lançamento antes da data e sai 000.
      - name: saldoFinal
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Saldo da conta no fim do último dia do afastamento, em reais (IN 636, Anexo I, CONTAS, campo 11). Ausente, sai 000.
      - name: volumePeriodo
        type: decimal
        required: false
        description: Soma dos valores dos lançamentos da conta no período. Só diz se houve lançamento, o código 1 ou 2 do campo 7 (IN 636, Anexo I, CONTAS); não vai ao arquivo.
  - name: contas_contraparte
    description: As contas da mesma instituição com que uma conta do caso transacionou no período. Campo 7 = 3.
    grain: [contaId]
    consolidation:
      key: [contaId]
      whenKeyRepeats: refuse
      columns: {numeroAgencia: first, numeroConta: first, tipoConta: first, dataAbertura: first, dataEncerramento: first,
                saldoInicial: first, saldoFinal: first}
    fields:
      - name: contaId
        type: string
        required: true
        description: A conta do Midaz. Não vai ao arquivo; identifica a linha.
      - name: numeroAgencia
        type: string
        required: true
        pattern: '^[0-9]{5}$'
        description: Número da agência sem DV, cinco dígitos; 00001 sem agência física (IN 636, Anexo I, CONTAS, campo 2).
      - name: numeroConta
        type: string
        required: true
        pattern: '^[^\t\r\n]{1,20}$'
        description: Número da conta com o dígito verificador, como o CRM o guarda (IN 636, Anexo I, CONTAS, campo 3).
      - name: tipoConta
        type: string
        required: true
        domain: ["1", "2", "3", "4", "5", "6"]
        description: Tipo da conta no código da IN (IN 636, Anexo I, CONTAS, campo 4).
      - name: dataAbertura
        type: date
        required: false
        description: Data de abertura da conta (IN 636, Anexo I, CONTAS, campo 5). Sem sentinela na IN; ausente, sai em branco.
      - name: dataEncerramento
        type: date
        required: false
        description: Data de encerramento da conta; ausente, a conta está aberta e sai 31129999 (IN 636, Anexo I, CONTAS, campo 6).
      - name: saldoInicial
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Saldo da conta no início do primeiro dia do afastamento, em reais (IN 636, Anexo I, CONTAS, campo 10). Ausente, a conta não tinha lançamento antes da data e sai 000.
      - name: saldoFinal
        type: decimal
        required: false
        format: {scale: 2, scaleIsExact: true, decimalSeparator: ".", groupSeparator: ""}
        description: Saldo da conta no fim do último dia do afastamento, em reais (IN 636, Anexo I, CONTAS, campo 11). Ausente, sai 000.

knownGaps:
  - id: saldo-negativo
    description: >-
      Os campos 10 e 11 são numéricos (só algarismos; IN 636, art. 3º, VII) e o Anexo I não lhes dá sinal nem
      natureza (IN 636, Anexo I, CONTAS, campos 10 e 11), ao contrário do EXTRATO. Uma conta que começa ou termina o
      período devedora (cheque especial) sai com o saldo em valor absoluto: o arquivo não distingue -12,50 de 12,50.
      Quem aprova confere as contas com saldo negativo antes de aprovar.
  - id: reserva-aberta-na-data
    description: >-
      As reservas e liberações do Midaz (operações ON_HOLD e RELEASE) não entram no saldo nem nos lançamentos: a
      transferência concluída sai uma vez só. Num ledger que valida rotas, uma reserva ainda aberta na data de corte
      já tirou o valor do disponível, e o saldo sai sem o valor reservado.
  - id: saldo-pela-soma-dos-lancamentos
    description: >-
      O saldo é a soma, com sinal, dos lançamentos que movem saldo em BRL desde a abertura até a data, inclusive na
      chave de sistema overdraft, onde fica a parte do saque tirada do cheque especial (e a parte do crédito que o
      paga), sem as reservas e liberações. Lê o mesmo razão que o Midaz por SQL: cliente com arquivo morto (retain)
      perde o histórico e o saldo sai errado sem aviso.
  - id: conta-de-outra-perna-sem-crm
    description: >-
      Uma conta das outras pernas só entra se tiver instrumento no CRM. Conta de sistema, de liquidação ou de outra
      instituição não é conta da mesma instituição com cliente, e não entra.
  - id: so-titular
    description: >-
      As contas do caso são as que o documento investigado titula e as em que ele é cotitular (parte PRIMARY_HOLDER
      do instrumento, contas_cotitular). A conta em que ele é só representante legal ou RESPONSIBLE_PARTY não entra:
      a IN fala das contas investigadas e não diz se a conta de quem só representa o titular é uma delas.
  - id: cotitular-no-periodo
    description: >-
      A conta de que o investigado é cotitular entra quando a cotitularidade cruza o período pedido em um dia ao
      menos (start_date até o fim, e end_date ausente ou a partir do início). Com sobreposição parcial, o EXTRATO e
      o ORIGEM-DESTINO trazem todo o movimento da conta no período, inclusive os dias em que o investigado ainda não
      era cotitular ou já tinha saído: é movimento de conta de terceiro sem sigilo afastado nesses dias. A parte
      sem start_date (registro antigo) entra sempre; não se consulta a abertura da conta (opening_date), e a
      conferência avisa o cotitular sem o início do vínculo (TITULARES, campo 20). Nas bordas, o Reporter fecha o
      período no fuso configurado dele e o CRM grava a data do vínculo à meia-noite UTC: num fuso atrás de UTC, a
      cotitularidade que termina no primeiro dia do período fica fora, e a que começa no dia seguinte ao fim entra.
  - id: excluida-do-crm
    description: >-
      Uma conta apagada do CRM (deleted_at) não entra. Uma conta encerrada (closing_date) entra, com a data.
  - id: conta-incorporada
    description: >-
      O campo 12 sai sempre em branco (conta nativa; IN 636, Anexo I, CONTAS, campo 12): nenhuma aplicação Lerian
      registra que uma conta veio de uma instituição sucedida.
