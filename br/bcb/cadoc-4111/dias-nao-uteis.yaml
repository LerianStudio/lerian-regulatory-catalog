# Calendário de dias úteis para as remessas ao BCB — CURADORIA DA LERIAN.
#
# O motor do Reporter não sabe quais dias são úteis: lê este arquivo, fixado na
# assinatura junto com o contrato. Ele decide onde cada período é cortado:
#   * o balancete (4010/4016) fecha no ÚLTIMO DIA ÚTIL do mês (leiaute §3.2.2.b);
#   * o volume do 4111 (3.0.9.70.XX) de sábado, domingo e feriado nacional vai para
#     o PRIMEIRO DIA ÚTIL seguinte, mesmo no mês seguinte (instruções §4.2.2.b);
#   * o 4111 só é gerado para dia útil: as remessas são por data-base de dia útil,
#     em sequência, e feriado nacional não tem remessa.
#
# Sábado e domingo nunca são dias úteis (weekends: true). Abaixo, os feriados
# NACIONAIS fixados em lei federal. Feriado local NÃO entra: as instruções mandam
# remeter nesses dias, repetindo os saldos do dia útil anterior.
#
# PENDENTE DE CURADORIA (decidir com a fonte oficial do BCB antes de incluir):
#   Carnaval (segunda e terça), Sexta-feira da Paixão e Corpus Christi — não são
#   feriados nacionais por lei federal, mas costumam ser dias não úteis bancários.
#
# Um dia fora de `covers` é recusado: o calendário não sabe nada além do que lista.
# Estender a cobertura antes do fim dela é parte da curadoria anual.
