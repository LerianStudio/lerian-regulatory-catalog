# Contrato do Cadoc 4111 — Saldos Contábeis Diários.
#
# QUEM CURA: a Lerian, a partir das Instruções de Preenchimento oficiais
# (schema/4111-instrucoes.pdf; "I p.N" abaixo) e do XSD publicado
# (schema/XSD_4111.xsd, o vigente desde 02/01/2025). Res. BCB 208/2022,
# IN BCB 524/2024, 644/2025.
#
# NÃO É UM CLONE DO 4010. Três coisas o separam, e todas vêm da fonte primária:
#
#  1. O conjunto de contas é FECHADO e conhecido pelo CATÁLOGO (contas.yaml), não
#     pelo cliente. O balancete reporta o plano de contas do cliente; o 4111 reporta
#     estas 30 rubricas específicas e nenhuma outra (I §4.2.2.a). Por isso o dataset
#     abaixo tem rowSet, e não grain aberto: as LINHAS vêm do catálogo, o cliente
#     fornece o VALOR de cada uma.
#
#  2. Há DUAS medidas num só documento. As contas patrimoniais/compensação carregam
#     ESTOQUE (saldo ao fim do dia, no sinal da natureza — como o 4010). As contas
#     3.0.9.70.XX carregam FLUXO (volume absoluto acumulado no mês, reiniciando). A
#     medida de cada conta está em contas.yaml.
#
#  3. É diário. dataBase = AAAA-MM-DD, a partir de 02/01/2025.
#
# O motor confia neste contrato; não há validação XSD em runtime.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentContract

metadata:
  id: br.bcb.cadoc-4111
  country: BR
  regulator: BCB
  document: "4111"
  family: cadoc          # o agrupamento: os documentos contábeis do BCB
  title: Saldos Contábeis Diários
  summary: >-
    Saldos diários de um conjunto fechado de contas COSIF — estoque no sinal da natureza e volume de pagamentos acumulado no mês. Conjunto de linhas definido pelo catálogo, não pelo cliente.
  version: 1.7.2   # 1.7.2: o que o campo do saldo espera do mapeamento, dito na língua de quem mapeia; 1.7.1: o campo do saldo diz o que o mapeamento entrega (`expects`) — crédito positivo, débito negativo —, a convenção de que a regra da natureza depende; 1.7.0: o contrato confere o que o motor e o binding leem, não o cadastro do cliente — saem a conferência da natureza registrada (e, no binding de referência, o join com o saldo que a trazia) e a do dígito verificador do CNPJ; 1.6.0: a regra de cada documento é do contrato — a natureza vem de `tables` e é aplicada e conferida por `rules`, só nas linhas de estoque; o binding só lê; 1.5.0: a natureza de cada rubrica, retificadoras incluídas, vem do elenco COSIF (natureza.yaml) e a de cada conta lançada é a que o Midaz registra, conferida contra ele; 1.4.4: o que faz a entrega (período) e a remessa (original e substituição), nas palavras do contrato; 1.4.3: o XSD vigente (10 dígitos, 30 contas, saldo com sinal, raiz alfanumérica); 1.4.2: família (cadoc) no contrato; 1.4.1: resumo do documento no contrato; 1.4.0: o CNPJ da declarante é conferido contra a instituição; 1.3.3: Carnaval, Paixão e Corpus Christi no calendário; 1.3.2: manuais; 1.3.1: só o que o Midaz não apagou
  status: draft
  output: xml
  appliesTo:
    institutionTypes: [IP, SCD, SCFI]
  periodicity: daily
  layout:
    version: "2025-01"        # rubricas e 10 dígitos a partir da data-base 02/01/2025
    mandatoryFrom: "2025-01-02"
  sourceOfTruth:
    layoutManual: https://www.bcb.gov.br/content/estabilidadefinanceira/Documents/Leiaute_de_documentos/saldosDiariosInstrucoesPreenchimentoV2.pdf
    schema: schema/XSD_4111.xsd            # o vigente desde 02/01/2025 (o cabeçalho ainda diz v1.0 de 30/03/2023)
    accountSet: contas.yaml                # o conjunto fechado de rubricas
    calendar: dias-nao-uteis.yaml          # dias não úteis (curadoria Lerian): cortam cada período

parameters:
  - name: dataBase
    type: date               # AAAA-MM-DD — diário (I §4.1.2)
    # Só dia útil do calendário: as remessas são por data-base de dia útil, em
    # sequência, e feriado nacional não tem remessa (I §2.1). Um sábado é recusado
    # na hora, dizendo qual é o último dia útil antes dele.
    businessDay: true
    # Só dia já encerrado no fuso do Reporter: o 4111 de um dia é gerável a partir
    # do dia seguinte, quando os lançamentos daquele dia pararam de chegar.
    closed: true
    required: true
    description: Dia útil de referência dos saldos.

  - name: tipoRemessa
    type: string
    required: true
    default: I
    domain: [I, S]
    description: Inclusão ou substituição.

# ---------------------------------------------------------------------------
# A entrega: o que faz duas gerações serem a MESMA entrega, e a remessa.
#
# O motor é genérico e não conhece o vocabulário do BCB. Ele aplica três regras
# sobre os parâmetros que este bloco nomeia: (1) uma entrega ORIGINAL aprovada por
# período, por assinatura; (2) substituição só depois de aprovada a original do
# período; (3) a geração mais nova do mesmo período e da mesma remessa substitui a
# anterior ainda não aprovada.
#
# `period` é opcional: ausente, o período é todo parâmetro menos o da remessa.
# `remittance` é opcional: ausente, o motor não impõe regra de original e
# substituição. Aqui, I = inclusão (a primeira remessa da data-base) e
# S = substituição (o reenvio de uma data-base já remetida).
# ---------------------------------------------------------------------------
filing:
  period: [dataBase]
  remittance:
    parameter: tipoRemessa
    original: I
    replacement: S

datasets:
  - name: institution
    description: Identificação da instituição declarante (cabeçalho).
    grain: singleton
    fields:
      - name: cnpj
        type: string
        length: 14
        required: true
        # O CNPJ da declarante é DADO: vem da base, como qualquer outro valor (no
        # binding de referência, a organização do Midaz). O contrato só o escreve
        # como o arquivo pede: letras e dígitos, em maiúsculas. Que o CNPJ seja
        # válido é do cadastro do cliente, não deste arquivo.
        normalize: alphanumeric
        # A declarante é a instituição da entrega: o CNPJ lido da base é conferido
        # contra o cadastro da instituição, e um diferente recusa a geração
        # (RPT-0196). O registro e o arquivo não nomeiam instituições diferentes.
        identifiesInstitution: true
        description: CNPJ da instituição declarante (quatorze posições).
      - name: cnpj8
        type: string
        length: 8
        required: true
        # O arquivo leva a RAIZ: as oito primeiras posições do CNPJ acima, cortadas
        # pelo motor. Nenhum binding mapeia este campo.
        prefixOf: cnpj
        pattern: '^[A-Za-z0-9]{8}$'
        description: Raiz do CNPJ (oito primeiras posições).

  - name: saldos_diarios
    description: Saldo ao fim do dia de cada conta do conjunto fechado do 4111.
    # rowSet, NÃO grain: as linhas são o conjunto do catálogo, uma por conta
    # declarada em contas.yaml. O binding fornece o saldoDia de cada uma; contas de
    # saldo zero podem ser omitidas (I §4.2.2.a).
    # NATUREZA DE CADA RUBRICA: o lado em que o saldo normalmente fica, lido do
    # elenco COSIF do BACEN (natureza.yaml, gerado por tools/natureza.py). É dado
    # do PLANO COSIF, não do cliente: o elenco marca as retificadoras — perda
    # esperada, provisão, depreciação acumulada —, e quem lança na rubrica certa
    # fez o que lhe cabe. A regra `saldo-na-natureza`, pela
    # tabela `natureza`, vale só nas linhas de ESTOQUE (`measure: stock` em
    # contas.yaml): o fluxo é volume absoluto do mês, e não tem natureza a aplicar.
    rowSet:
      from: contas.yaml
      key: cosifCode
      # O código COSIF é POSICIONAL e HIERÁRQUICO: seis níveis de larguras 1-1-1-2-2-2
      # mais o dígito verificador (IN BCB 426 a 433, vigente desde 01/2025). Uma linha
      # publicada responde por tudo que está abaixo dela — o BACEN lista
      # Disponibilidades (1.1.0) ao lado de Caixa (1.1.1) e Depósitos Bancários
      # (1.1.2), e ninguém lança em Disponibilidades: ela é a soma das filhas, mais as
      # subcontas que o razão do cliente mantiver sob elas. Sem esta declaração, a
      # conta-mãe saía zerada e uma subconta do cliente recusava o documento.
      hierarchy:
        levels: [1, 1, 1, 2, 2, 2]
        checkDigit: 1
    # CONSOLIDAÇÃO: um conglomerado entrega UM arquivo. O conjunto pode ser lido de
    # mais de uma base (as fontes adicionais do mapeamento, `also`), e as linhas se
    # unificam pela rubrica, com o saldoDia das fontes somado. Cada fonte é montada
    # inteira, com as suas contas-mãe, antes de unificar: a conta-mãe do grupo é a
    # soma das contas-mãe das fontes. Eliminações entre as empresas não são feitas
    # aqui; se o documento as exigir, entram como dado do cliente.
    consolidation:
      key: [cosifCode]
      columns: {saldoDia: sum}
    fields:
      - name: cosifCode
        type: string
        required: true
        # Dez dígitos desde 02/01/2025 (I, changelog 26/09/2024), como o XSD vigente.
        pattern: '^[0-9]{10}$'
        normalize: digits
        description: Código COSIF da conta, do conjunto fechado (contas.yaml).
      - name: saldoDia
        type: decimal
        required: true
        format:
          scale: 2
          scaleIsExact: true
          decimalSeparator: "."
          groupSeparator: ""
        means: >-
          Para conta de ESTOQUE: saldo em R$ ao fim do dia, no sinal da natureza da
          conta; no último dia do mês coincide com o 4010 (I §4.2.2.b). Para conta de
          FLUXO (3.0.9.70.XX): somatório do valor ABSOLUTO das transações do dia,
          acumulado no mês e reiniciado a cada mês (I §4.2.2.a) — o MOVIMENTO A DÉBITO
          da conta no mês, do primeiro instante após o último dia útil do mês anterior
          até o fim do dia da data-base. Qual medida vale para cada conta está em
          contas.yaml.
        expects: >-
          Para conta de estoque, entregue o saldo com crédito positivo e débito
          negativo; o documento depois põe cada saldo na natureza da conta, e
          entregue ao contrário sai com o sinal trocado sem aviso. Para conta de
          fluxo, entregue o volume do período, sem sinal, como vai no arquivo.


tables:
  - name: natureza
    from: natureza.yaml        # prefixo da rubrica → debit | credit, do elenco COSIF
    match: longestPrefix

rules:
  # O razão soma o estoque em convenção contábil (crédito positivo); uma conta de
  # natureza devedora sai com o sinal invertido, em cada linha publicada, depois da
  # soma das filhas. Só no estoque: o fluxo é volume do mês, positivo como lido.
  - id: saldo-na-natureza
    appliesTo: saldos_diarios
    where: {rowSet: measure, equals: stock}
    transform:
      negateWhen: {field: saldoDia, table: natureza, key: cosifCode, equals: debit}
    message: Cada saldo de estoque sai na natureza da própria conta.

  - id: conta-do-conjunto-fechado
    severity: error
    appliesTo: saldos_diarios
    check:
      existsIn: {field: cosifCode, rowSet: contas.yaml}
    message: >-
      O 4111 só admite as contas do conjunto fechado (I §4.2.2.a). Uma rubrica fora
      de contas.yaml indica binding apontando para conta que o documento não prevê.

  - id: uma-linha-por-conta
    severity: error
    appliesTo: saldos_diarios
    check:
      unique: [cosifCode]
    message: Uma linha por conta (I §4.2.1); duplicidade é agrupamento errado no binding.

knownGaps:
  - id: natureza-lida-do-elenco
    description: >-
      A natureza de cada rubrica vem do elenco COSIF do BACEN (natureza.yaml,
      gerada por tools/natureza.py): a seção dá o lado, "(-)" marca a
      retificadora, "(+/-)" herda a mãe. O que fica com o cliente é LANÇAR NA
      RUBRICA CERTA — o COSIF referenciado nas rotas contábeis do Midaz
      (`operation.route_code`). Dois limites, declarados: (1) uma rubrica que o
      elenco não tem, mas que cai num grupo que existe, recebe a natureza do grupo
      em silêncio (uma "provisão" inventada em 1.6.9 sai devedora); só uma rubrica
      fora de todo grupo do elenco, como o grupo 5 a partir de 2025, recusa a
      geração. (2) No grupo 8 o elenco escreve "(-)" em quase toda despesa, então o
      grupo é tratado como devedor inteiro; as poucas contas sem a marca ficam
      listadas no cabeçalho de natureza.yaml para revisão.
