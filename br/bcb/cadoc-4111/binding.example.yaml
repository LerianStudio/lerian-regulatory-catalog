# Binding do Cadoc 4111 — QUEM PREENCHE É O CLIENTE.
# Exemplo contra o Midaz, cobrindo as DUAS classes de conta do documento.
#
# A diferença estrutural frente ao 4010: as LINHAS do dataset vêm do conjunto
# fechado (contas.yaml), não das consultas. As consultas fornecem o VALOR de cada
# conta declarada; contas.yaml diz quais existem e o que cada valor significa. O
# motor casa as duas pela chave cosifCode.
#
# DUAS CONSULTAS SOBRE A MESMA TABELA, e não é redundância: a janela pertence à
# consulta, e as duas classes de conta acumulam em janelas diferentes. Estoque
# soma desde a abertura do razão, com o sinal da natureza; fluxo soma o valor
# absoluto do mês corrente, reiniciando a cada virada. Cada campo diz de qual das
# duas lê, e o motor executa as duas leituras separadas.
#
# O que é DESTE exemplo e não do documento: o nome da fonte (midaz_transaction),
# da tabela (operation) e das colunas (route_code, amount, direction, created_at),
# e os valores que a coluna de direção carrega. Um razão que não seja o Midaz troca
# esses nomes e mantém o resto.

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentBinding

contract: br.bcb.cadoc-4111
contractVersion: 1.0.0

queries:
  - name: saldos_estoque
    description: Saldo diário por rubrica das contas de ESTOQUE.
    dataSource: midaz_transaction
    table: operation

    # Recorte de linhas ANTES de agregar. Uma operação pendente ou rejeitada não é
    # lançamento postado, e somá-la infla o que é declarado ao regulador. Mesma
    # precondição que o 4010 e o 4016 aplicam sobre esta tabela.
    filters:
      - field: status
        operator: eq
        values: ["APPROVED"]
    aggregate:
      groupBy: [route_code]
      measures:
        - as: saldoDia
          fn: sum
          of: amount
          # A CHAVE É O LADO, O VALOR É A GRAFIA QUE O DADO USA. `debit: "debit"`
          # lê-se "a linha cuja coluna direction carrega 'debit' é um débito, e
          # débito subtrai". Escrever `debit: "-"` afirma que a coluna carrega o
          # caractere '-' — no Midaz ela carrega 'debit' ou 'credit'
          # (validateOperationDirection), nenhuma linha casaria, e o motor recusa o
          # relatório INTEIRO em vez de somar pela metade.
          sign:
            column: direction
            debit: "debit"
            credit: "credit"
          statedIn:
            natureByPrefix:
              "1": debit
              "2": debit
              "3": debit
              "4": credit
              "5": credit
              "6": credit
              "9": credit
            key: route_code
      # Estoque acumula desde a abertura até o FIM DO DIA da data-base (diário).
      accumulate:
        # A coluna que carrega o momento do lançamento. `until` nomeia o instante;
        # esta nomeia onde ele é lido. No Midaz é o carimbo de criação da operação;
        # um razão próprio guarda isso com o nome dele.
        on: created_at
        until: system.dataBase
        # Estoque: a janela abre no começo do razão, então o saldo de fechamento
        # carrega tudo que já foi lançado — inclusive os lançamentos de abertura
        # que a migração de um sistema anterior postou.
        from: opening

  - name: volumes_fluxo
    description: Volume absoluto do mês corrente por rubrica, para as contas de FLUXO.
    dataSource: midaz_transaction
    table: operation

    # Recorte de linhas ANTES de agregar. Uma operação pendente ou rejeitada não é
    # lançamento postado, e somá-la infla o que é declarado ao regulador. Mesma
    # precondição que o 4010 e o 4016 aplicam sobre esta tabela.
    filters:
      - field: status
        operator: eq
        values: ["APPROVED"]
    aggregate:
      groupBy: [route_code]
      measures:
        # SEM `sign`: o documento pede o somatório do valor ABSOLUTO das
        # transações (I §4.2.2.a), não o saldo líquido — um débito de 100 e um
        # crédito de 100 somam 200 de volume e zero de saldo.
        - as: volumeMes
          fn: sum
          of: amount
      accumulate:
        on: created_at
        until: system.dataBase
        # A diferença que obriga a segunda consulta: o volume REINICIA a cada mês,
        # enquanto o saldo acima acumula desde a abertura. Uma janela é de uma
        # consulta, então duas janelas são duas consultas.
        from: month

datasets:
  institution:
    fields:
      cnpj8:
        from: constant
        value: "12345678"

  saldos_diarios:
    # As linhas vêm do conjunto fechado; as consultas fornecem o valor por conta.
    # rowSet casa contas.yaml.cosifCode com o route_code que a consulta agrega.
    from:
      query: saldos_estoque
    rowKey:
      cosifCode: route_code
    fields:
      cosifCode:
        from: rowSet
        column: cosifCode
      # saldoDia se resolve por CLASSE de conta (contas.yaml.measure), e as duas
      # classes leem janelas diferentes — por isso é uma lista de casos, não uma
      # origem só. Nenhuma linha fica sem origem, e nenhuma conta do conjunto é
      # descartada: uma rubrica sem lançamento na janela sai zero, que é o que o
      # documento pede.
      saldoDia:
        byRowClass:
          # Estoque: saldo do razão, no sinal da natureza, acumulado desde a
          # abertura. Lê a consulta do próprio conjunto.
          - when: { rowSet: measure, equals: stock }
            from: query
            column: saldoDia
          # Fluxo: volume absoluto do mês, reiniciando. Lê a OUTRA consulta, porque
          # é a janela que difere — e uma janela é de uma consulta.
          - when: { rowSet: measure, equals: flow }
            from: query
            query: volumes_fluxo
            column: volumeMes

manualOverrides: []
