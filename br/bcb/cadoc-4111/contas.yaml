# Conjunto FECHADO de contas do Cadoc 4111 — dado de referência do CATÁLOGO.
#
# Diferença estrutural frente ao 4010/4016: no balancete o conjunto de rubricas é do
# CLIENTE (aberto); aqui o BACEN FIXA quais contas entram — estas, e só estas
# (instruções §4.2.2.a). O contrato declara as linhas; o binding fornece o VALOR.
#
# O `cosifCode` de dez dígitos é DERIVADO MECANICAMENTE do `masked` (mascarado sem
# ponto nem traço) — não transcrito à mão. A transcrição manual da primeira versão
# errou um código de controle e os cinco de fluxo; o mascarado é a forma conferida
# contra o PDF oficial e o código é função dele.
#
# measure: stock = saldo ao fim do dia no sinal da natureza (coincide com o 4010 no
# fim do mês); flow = volume absoluto das transações acumulado no mês, reiniciando
# (3.0.9.70.XX). As duas classes são geráveis: o binding declara uma janela de
# acumulação para cada uma.
#
# A FORMA É A GRAMÁTICA DE CONJUNTO FECHADO DO MOTOR: sequência de topo `rows`, e
# cada linha carregando a coluna que o contrato nomeia em `rowSet.key` — aqui
# `cosifCode`. As demais colunas viajam junto e o binding lê as que precisa.
