# Conjunto FECHADO de contas do Cadoc 4111 — dado de referência do CATÁLOGO.
#
# Aqui está a diferença estrutural do 4111 frente ao 4010/4016. No balancete, o
# conjunto de rubricas é do CLIENTE (o plano de contas dele, aberto) e o contrato só
# restringe a forma de cada linha. No 4111 o BACEN FIXA quais contas entram — estas,
# e só estas (instruções §4.2.2.a). Então o conjunto é conhecimento do catálogo, não
# do cliente: o contrato declara as linhas, e o binding fornece o VALOR de cada uma.
#
# Códigos em dez dígitos (sem ponto/traço), vigentes desde a data-base 02/01/2025
# (instruções, changelog 26/09/2024; IN BCB 426-433). A grafia mascarada ao lado é
# só para leitura humana.
#
# measure classifica o que o saldoDia significa em cada conta:
#   stock — saldo contábil ao final do dia, no sinal da natureza da conta. No último
#           dia do mês coincide com o 4010 (instruções §4.2.2.b).
#   flow  — somatório do valor ABSOLUTO das transações do dia, acumulado ao longo do
#           mês e REINICIADO a cada mês (instruções §4.2.2.a, IN 644/2025). É medida
#           de volume, não de posição — depende da acumulação com reinício mensal,
#           que é a Fase 4 do motor. Ver knownGap flow-precisa-da-fase-4.

