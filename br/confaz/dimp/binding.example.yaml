# Binding da DIMP — QUEM PREENCHE É O CLIENTE.
# Exemplo contra o ecossistema Lerian (CRM + Midaz), para mostrar o encaixe.
#
# A DIMP força três construções de binding que o 4010 não tinha, todas marcadas
# onde aparecem:
#   join     — consulta juntando duas tabelas da MESMA fonte
#   from     — consulta composta sobre OUTRA consulta nomeada (correlação entre
#              fontes diferentes: CRM ↔ Midaz)
#   having   — filtro PÓS-agregação: o piso de PF é pertinência por agregado, a
#              mesma classe do corte de R$ 200 do 3040, em forma branda
#   derive   — campo derivado de um parâmetro (primeiro/último dia da competência)

apiVersion: reporter.lerian.io/v1alpha1
kind: DocumentBinding

contract: br.confaz.dimp
contractVersion: 10.0.0

queries:
  # Titulares com conta: JOIN dentro da mesma fonte (CRM).
  - name: titulares_com_conta
    dataSource: plugin_crm
    table: holders
    join:
      - table: aliases
        # `match`, não `on`: YAML 1.1 lê `on` como o booleano True — até
        # como chave — e a cláusula de join sumiria em silêncio no parse.
        match: { holder_id: _id }     # aliases.holder_id = holders._id

  # Movimento agregado por conta e dia, no razão.
  - name: movimento_diario
    dataSource: midaz_transaction
    table: operation
    filters:
      - field: status
        operator: eq
        values: ["APPROVED"]
    aggregate:
      groupBy: [account_id, created_at_day]
      measures:
        - { as: valor, fn: sum, of: amount }
        - { as: qtd,   fn: count }

  # CONSULTA COMPOSTA: correlaciona o movimento (Midaz) com o titular (CRM) via a
  # conta. É a construção que fontes diferentes exigem — uma consulta não atravessa
  # fontes, mas pode se apoiar em OUTRA consulta nomeada.
  - name: resumo_mensal_por_titular
    from: movimento_diario
    join:
      - query: titulares_com_conta
        match: { account_id: account_id }
    aggregate:
      groupBy: [holder_id]
      measures:
        - { as: valor, fn: sum, of: valor }
        - { as: qtd,   fn: sum, of: qtd }
    # O PISO DE PF (L pp.28-30): recebedor pessoa física só entra com total mensal
    # ≥ R$ 3.375,00 E ≥ 30 transações. Filtro PÓS-agregação — antes dela não há
    # total para comparar. PJ não tem piso; a condição discrimina pela presença de
    # CPF, como o contrato faz.
    having:
      - anyOf:
          - { field: document_type, operator: eq, values: ["LEGAL_PERSON"] }
          - allOf:
              - { field: valor, operator: gte, values: ["3375.00"] }
              - { field: qtd,   operator: gte, values: ["30"] }

datasets:
  declarante:
    # Cadastral e estável: constantes. Nenhuma consulta.
    fields:
      cnpj:             { from: constant, value: "12345678000199" }
      razaoSocial:      { from: constant, value: "Exemplo Instituição de Pagamento S.A." }
      nomeContato:      { from: constant, value: "Fulano de Tal" }
      endereco:         { from: constant, value: "Av. Exemplo, 100" }
      cep:              { from: constant, value: "01310100" }
      codigoMunicipio:  { from: constant, value: "3550308" }
      uf:               { from: constant, value: "SP" }
      nomeResponsavel:  { from: constant, value: "Fulano de Tal" }
      telefone:         { from: constant, value: "11999990000" }
      email:            { from: constant, value: "fiscal@exemplo.com.br" }

  escrituracao:
    # DERIVADOS DE PARÂMETRO: a janela vem da competência, não de base nenhuma.
    fields:
      dtIni:        { from: parameter, name: dataBase, derive: monthStart }
      dtFin:        { from: parameter, name: dataBase, derive: monthEnd }
      mesValidacao: { from: parameter, name: dataBase }   # gerado na própria competência

  titulares:
    from: { query: titulares_com_conta }
    fields:
      codCliente:        { from: query, column: _id }
      cnpj:              { from: query, column: document, when: { field: type, equals: "LEGAL_PERSON" } }
      cpf:               { from: query, column: document, when: { field: type, equals: "NATURAL_PERSON" } }
      nomeFantasia:      { from: query, column: name }
      endereco:          { from: query, column: address_line1 }
      cep:               { from: query, column: zip_code }
      codigoMunicipio:   { from: query, column: city_code }
      uf:                { from: query, column: state }
      nomeResponsavel:   { from: query, column: legal_representative_name }
      telefone:          { from: query, column: mobile_phone }
      email:             { from: query, column: primary_email }
      dtCredenciamento:  { from: query, column: created_at }
      indSubadquirencia: { from: constant, value: "0" }

  meiosCaptura:
    from: { query: titulares_com_conta }
    fields:
      codMeioCaptura:  { from: query, column: account_id }
      # Conta de pagamento (tecnologia 8): número lógico é a concatenação
      # tipo-banco-agência-conta que o leiaute manda (L pp.20-22) — o cliente monta.
      numeroLogico:    { from: query, column: banking_details_account }
      tipoTecnologia:  { from: constant, value: "8" }
      terminalProprio: { from: constant, value: "0" }
      # marca: requiredWhen terminalProprio=1 — aqui é 0, então não se resolve.
      # smartpos: requiredWhen tipoTecnologia=3 — idem.

  resumosMensais:
    from: { query: resumo_mensal_por_titular }
    fields:
      codCliente:       { from: query, column: holder_id }
      indComex:         { from: constant, value: "0" }
      indExtemporaneo:  { from: constant, value: "0" }
      dtIni:            { from: parameter, name: dataBase, derive: monthStart }
      dtFin:            { from: parameter, name: dataBase, derive: monthEnd }
      valor:            { from: query, column: valor }
      qtd:              { from: query, column: qtd }

  operacoesDiarias:
    from: { query: movimento_diario }
    fields:
      codMeioCaptura: { from: query, column: account_id }
      dtOperacao:     { from: query, column: created_at_day }
      valor:          { from: query, column: valor }
      qtd:            { from: query, column: qtd }
      cnpjLiquidante: { from: constant, value: "12345678000199" }

  detalhesOperacao:
    # Grão de comprovante: as operações cruas, sem agregação.
    source:
      dataSource: midaz_transaction
      table: operation
    fields:
      nsu:                  { from: manual }
      codAutorizacao:       { from: query, column: id }
      idTransacao:          { from: query, column: id }
      indSplit:             { from: constant, value: "0" }
      bandeira:             { from: manual }
      hora:                 { from: query, column: created_at_time }
      valor:                { from: query, column: amount }
      naturezaOperacao:     { from: constant, value: "6" }   # PIX
      # geolocalizacao: requiredWhen natureza in 1,2,7 — natureza 6 aqui, não se resolve.
      indNaturezaJuridica:  { from: manual }                 # requiredWhen natureza in 4,6
      indTipoPix:           { from: constant, value: "1" }   # requiredWhen natureza = 6

manualOverrides: []
