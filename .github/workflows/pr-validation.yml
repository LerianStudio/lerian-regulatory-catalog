name: PR Validation

on:
  pull_request:
    branches: [develop, release-candidate, main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: LerianStudio/shared-workflows-public/.github/workflows/pr-validation.yml@tier-1
    with:
      pr_title_scopes: |
        4010
        4016
        4111
        simba
        catalog
        cosif
        homologation
        tools
        release
        ci
        deps
        docs
    secrets:
      MANAGE_TOKEN: ${{ secrets.MANAGE_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  security:
    name: Security
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: write
      security-events: write
    uses: LerianStudio/shared-workflows-public/.github/workflows/pr-security-scan.yml@tier-1
    with:
      enable_docker_scan: false
    secrets:
      MANAGE_TOKEN: ${{ secrets.MANAGE_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  catalog:
    name: Validate Catalog
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The version guard compares each released document with the newest stable
          # tag that published it: it needs the tags, which a shallow clone lacks.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r tools/requirements.txt
      - run: python3 tools/test_validate.py
      - run: python3 tools/test_natureza.py
      - run: python3 tools/test_tabelas_receita.py
      - run: python3 tools/test_simba.py
      - run: python3 tools/test_simba_conferencia.py
      - run: python3 tools/test_ispb_compe.py
      - run: python3 tools/test_ispb_cnpj.py
      - run: python3 tools/validate.py
        env:
          # Without tags the guard would pass green over nothing: here it must run.
          CATALOG_REQUIRE_RELEASES: "1"
