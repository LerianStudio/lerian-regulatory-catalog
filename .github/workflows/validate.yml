name: validate catalog

# Um erro neste repositório não quebra build nenhum — ele produz um arquivo
# regulatório errado, com aparência de certo, entregue ao regulador. A conferência
# roda em todo PR porque é exatamente o tipo de erro que passa numa leitura.
on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r tools/requirements.txt || pip install pyyaml==6.0.2
      # A suíte roda ANTES: ela prova que as conferências ainda pegam o que devem
      # pegar. Uma conferência frouxa aprova um catálogo errado, então validar sem
      # antes provar o validador é confiar numa rede sem olhar se tem buraco.
      - run: python3 tools/test_validate.py
      - run: python3 tools/test_natureza.py
      - run: python3 tools/validate.py
