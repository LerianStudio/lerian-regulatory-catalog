name: validate catalog

on:
  pull_request:
  push:
    branches: [main, release-candidate, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r tools/requirements.txt || pip install pyyaml==6.0.2
      - run: python3 tools/test_validate.py
      - run: python3 tools/test_natureza.py
      - run: python3 tools/validate.py
