name: release catalog

on:
  pull_request:
  push:
    branches: [main, release-candidate, develop]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    if: github.event_name == 'push' && github.ref_type == 'branch'
    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write
    uses: LerianStudio/shared-workflows-public/.github/workflows/release.yml@tier-1
    with:
      ignore_globs: "README.md CONTRIBUTING.md AGENTS.md CLAUDE.md tools/* .github/* .gitignore .coderabbit.yml .coderabbit.yaml"
    secrets: inherit

  archive:
    if: github.event_name == 'pull_request' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --require-hashes -r tools/requirements.txt

      - name: confere o conteúdo do catálogo
        run: python3 tools/validate.py

      - name: confere que a conferência morde
        run: python3 tools/test_release.py

      - name: a versão da release
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "version=0.0.0-dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            branch=main
            prerelease=false
          elif printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            branch=release-candidate
            prerelease=true
          elif printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            branch=develop
            prerelease=true
          else
            echo "a tag '$GITHUB_REF_NAME' não é vX.Y.Z, vX.Y.Z-rc.N nem vX.Y.Z-beta.N, então não versiona um catálogo" >&2
            exit 1
          fi

          git fetch --quiet --no-tags --unshallow origin 2>/dev/null || true
          git fetch --quiet --no-tags origin "+refs/heads/$branch:refs/remotes/origin/$branch"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "a tag '$GITHUB_REF_NAME' aponta para um commit fora da '$branch', de onde uma tag assim é cortada" >&2
            exit 1
          fi

          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: monta o pacote
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 tools/release.py build --version "$VERSION" --out "dist/catalog-$VERSION.tar.gz"

      - name: o pacote é reproduzível
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 tools/release.py build --version "$VERSION" --out /tmp/again/catalog.tar.gz
          cmp "dist/catalog-$VERSION.tar.gz" /tmp/again/catalog.tar.gz

      - name: confere o pacote
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 tools/release.py verify "dist/catalog-$VERSION.tar.gz" --version "$VERSION"

  publish:
    needs: archive
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      PRERELEASE: ${{ needs.archive.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --require-hashes -r tools/requirements.txt

      - name: monta o pacote da release
        run: python3 tools/release.py build --version "$VERSION" --out "dist/catalog-$VERSION.tar.gz"

      - name: confere o pacote e o layout de cada documento
        run: |
          python3 tools/release.py verify "dist/catalog-$VERSION.tar.gz" \
            --version "$VERSION" --require-document-layout

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum "catalog-$VERSION.tar.gz" > SHA256SUMS

      - name: a tag ainda aponta para o que foi conferido
        run: |
          target=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | cut -f1)
          if [ -z "$target" ]; then
            target=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | cut -f1)
          fi

          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "a tag '$GITHUB_REF_NAME' aponta para ${target:-nada} e o pacote foi montado de $GITHUB_SHA" >&2
            exit 1
          fi

      - name: publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          kind=()
          if [ "$PRERELEASE" = "true" ]; then kind=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            "${kind[@]}" \
            --title "$GITHUB_REF_NAME" \
            --notes "Catálogo regulatório $VERSION. O Reporter busca a release mais recente e lê o único \`.tar.gz\` anexado; \`SHA256SUMS\` é para conferência humana; \`LICENSE\` e \`NOTICE\` acompanham a release." \
            "dist/catalog-$VERSION.tar.gz" \
            "dist/SHA256SUMS" \
            "LICENSE" \
            "NOTICE"
