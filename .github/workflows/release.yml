name: release catalog

# UMA RELEASE É UM ATO PARA FORA. O Reporter de cada cliente busca a release MAIS
# RECENTE deste repositório e instala o que ela carregar — sem revisão no meio.
# Por isso o mesmo pacote é montado e conferido em todo PR: uma árvore que não
# empacota, ou que empacota errado, não chega a uma tag.
#
# UM ÚNICO .tar.gz POR RELEASE. O Reporter recusa uma release com dois, porque de
# lá não há como dizer qual é o catálogo, e escolher um instalaria conteúdo por
# acidente de ordenação. Qualquer anexo novo aqui precisa NÃO terminar em .tar.gz.
on:
  pull_request:
  push:
    tags: ["v*"]

# LEITURA POR PADRÃO. O job que monta o pacote executa o código do PR — inclusive
# `tools/release.py` como aquele PR o escreveu —, então ele não pode segurar um
# token capaz de criar release ou mover tag. A escrita vive só no job de
# publicação, que roda exclusivamente sobre uma tag.
permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r tools/requirements.txt

      - name: confere o conteúdo do catálogo
        run: python3 tools/validate.py

      - name: confere que a conferência morde
        run: python3 tools/test_release.py

      - name: a versão da release
        id: release
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "version=0.0.0-dry-run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # vX.Y.Z E NADA MAIS. O gatilho `v*` também casa com `vnext`, `v1` e
          # `v1.2.3-rc1`, e qualquer um deles publicaria uma release cuja versão
          # contradiz o que o CONTRIBUTING promete a quem a consome.
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "a tag '$GITHUB_REF_NAME' não é vX.Y.Z, então não versiona um catálogo" >&2
            exit 1
          fi

          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: monta o pacote
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 tools/release.py build --version "$VERSION" --out "dist/catalog-$VERSION.tar.gz"

      # MESMA ÁRVORE, MESMOS BYTES. Sem isto, quem conferir o que publicamos
      # remontando o pacote encontra uma diferença e não sabe se o conteúdo mudou
      # ou se foi só o empacotador carimbando a hora.
      - name: o pacote é reproduzível
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 tools/release.py build --version "$VERSION" --out /tmp/again/catalog.tar.gz
          cmp "dist/catalog-$VERSION.tar.gz" /tmp/again/catalog.tar.gz

      # LIDO COMO O REPORTER LERIA: desempacota, recalcula cada SHA-256 contra o
      # manifesto que viaja dentro, e recusa caminho que escape da raiz.
      - name: confere o pacote
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: python3 tools/release.py verify "dist/catalog-$VERSION.tar.gz" --version "$VERSION"

  publish:
    needs: archive
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.archive.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r tools/requirements.txt

      # Remontado em vez de carregado do job anterior: o pacote é determinístico,
      # então estes são os mesmos bytes que já passaram pela conferência — e um
      # artefato transportado entre jobs seria uma quarta cópia para desconfiar.
      - name: monta o pacote da release
        run: python3 tools/release.py build --version "$VERSION" --out "dist/catalog-$VERSION.tar.gz"

      # Ao PUBLICAR, exige também que o Reporter ENCONTRE cada documento do
      # índice: uma release íntegra que o único consumidor não lê não é release.
      - name: confere o pacote e a legibilidade pelo Reporter
        run: |
          python3 tools/release.py verify "dist/catalog-$VERSION.tar.gz" \
            --version "$VERSION" --require-consumer-layout

      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum "catalog-$VERSION.tar.gz" > SHA256SUMS

      # A tag pode ter sido MOVIDA entre o disparo e agora, e aí a release
      # apontaria para uma árvore e carregaria o pacote de outra — as duas
      # metades discordando sem nada dizer isso. A conferência não é livre de
      # corrida (a tag pode mudar no instante seguinte); fechar de verdade é uma
      # regra de proteção de tag no repositório, que é decisão de quem o
      # administra. O que esta etapa garante é que a janela deixe rastro.
      - name: a tag ainda aponta para o que foi conferido
        run: |
          target=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME^{}" | cut -f1)
          if [ -z "$target" ]; then
            target=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" | cut -f1)
          fi

          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "a tag '$GITHUB_REF_NAME' aponta para ${target:-nada} e o pacote foi montado de $GITHUB_SHA" >&2
            exit 1
          fi

      - name: publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --verify-tag porque sem ele, se a tag tiver sumido entre o push e
          # aqui, o gh CRIA uma apontando para o topo do branch padrão: a release
          # sairia dizendo ser vX.Y.Z e apontando para outra árvore. Melhor
          # falhar alto do que publicar uma tag que ninguém cortou.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Catálogo regulatório $VERSION. O Reporter busca a release mais recente e lê o único \`.tar.gz\` anexado; \`SHA256SUMS\` é para conferência humana." \
            "dist/catalog-$VERSION.tar.gz" \
            "dist/SHA256SUMS"
