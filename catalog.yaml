# Índice do catálogo.
#
# É o que o Reporter lê para MOSTRAR os documentos disponíveis sem baixar todos:
# o cliente filtra por país, regulador e tipo de instituição, e só o que ele ativar
# é buscado por inteiro.
#
# Cada entrada é um resumo do `metadata` do contrato correspondente. A duplicação é
# deliberada e tem um preço: pode divergir. A curadoria deve conferir os dois, e a
# fonte de verdade em caso de divergência é sempre o contrato.

apiVersion: reporter.lerian.io/v1alpha1
kind: Catalog

documents:
  - id: br.bcb.cadoc-4010
    path: br/bcb/cadoc-4010
    country: BR
    regulator: BCB
    document: "4010"
    family: cadoc
    title: Balancete Patrimonial Analítico
    version: 1.0.0
    status: draft            # draft | published | deprecated
    periodicity: monthly
    appliesTo:
      institutionTypes: [IP, SCD, SCFI]
    summary: >-
      Saldos por rubrica COSIF na data-base, acumulados desde a abertura e
      expressos na natureza de cada conta.

  - id: br.bcb.cadoc-4016
    path: br/bcb/cadoc-4016
    country: BR
    regulator: BCB
    document: "4016"
    family: cadoc
    title: Balanço Patrimonial Analítico
    version: 1.0.0
    status: draft
    periodicity: semiannual
    appliesTo:
      institutionTypes: [IP, SCD, SCFI]
    summary: >-
      Posição patrimonial semestral por rubrica COSIF, sem as contas de resultado
      (grupos 7 e 8). O balanço do 4010 após a apuração do exercício.

  - id: br.bcb.cadoc-4111
    path: br/bcb/cadoc-4111
    country: BR
    regulator: BCB
    document: "4111"
    family: cadoc
    title: Saldos Contábeis Diários
    version: 1.0.0
    status: draft
    periodicity: daily
    appliesTo:
      institutionTypes: [IP, SCD, SCFI]
    summary: >-
      Saldos diários de um conjunto fechado de contas COSIF — estoque no sinal da
      natureza e volume de pagamentos acumulado no mês. Conjunto de linhas definido
      pelo catálogo, não pelo cliente.

  - id: br.rfb.efinanceira-cad-declarante
    path: br/rfb/efinanceira-cad-declarante
    country: BR
    regulator: RFB
    document: evtCadDeclarante
    family: e-financeira
    title: e-Financeira — Cadastro do Declarante
    version: 1.0.0
    status: draft
    periodicity: eventual
    appliesTo:
      institutionTypes: [IP, SCD, SCFI]
    summary: >-
      Cadastro da instituição declarante na e-Financeira: identificação, endereço,
      situação no CRS e no FATCA, tipos de entidade e residências fiscais. Primeiro
      evento da e-Financeira; reenviado como retificação quando o cadastro muda.

  - id: br.rfb.efinanceira-abertura
    path: br/rfb/efinanceira-abertura
    country: BR
    regulator: RFB
    document: evtAberturaeFinanceira
    family: e-financeira
    title: e-Financeira — Abertura
    version: 1.0.0
    status: draft
    periodicity: semiannual
    appliesTo:
      institutionTypes: [IP, SCD, SCFI]
    summary: >-
      Abertura da e-Financeira de um semestre: as datas do período, o responsável
      pelas requisições de movimentação financeira (RMF), os responsáveis pela
      e-Financeira e o representante legal. Uma abertura original por semestre;
      reenviada como retificação quando muda.

  - id: br.rfb.efinanceira-fechamento
    path: br/rfb/efinanceira-fechamento
    country: BR
    regulator: RFB
    document: evtFechamentoeFinanceira
    family: e-financeira
    title: e-Financeira — Fechamento
    version: 1.0.0
    status: draft
    periodicity: semiannual
    appliesTo:
      institutionTypes: [IP, SCD, SCFI]
    summary: >-
      Fechamento da e-Financeira de um semestre: as datas do período, a situação
      especial e os indicadores de movimento de operações financeiras e de inexistência de
      contas CRS e FATCA, declarados a cada geração.
      Um fechamento original por semestre; reenviado como retificação quando muda.

  - id: br.rfb.efinanceira-exclusao
    path: br/rfb/efinanceira-exclusao
    country: BR
    regulator: RFB
    document: evtExclusao
    family: e-financeira
    title: e-Financeira — Exclusão de Evento
    version: 1.0.0
    status: draft
    periodicity: eventual
    appliesTo:
      institutionTypes: [IP, SCD, SCFI]
    summary: >-
      Exclusão de um evento da e-Financeira enviado indevidamente, pelo recibo de
      entrega dele. O arquivo leva só o CNPJ da declarante e o recibo. O Anexo II só
      nomeia a regra do recibo; pelo campo 10 e pela REGRA_VALIDA_NR_RECIBO (A II
      p.14), ele tem de ser de um evento recebido, ativo e da mesma declarante, e a
      Receita confere.

  - id: br.rfb.efinanceira-exclusao-efinanceira
    path: br/rfb/efinanceira-exclusao-efinanceira
    country: BR
    regulator: RFB
    document: evtExclusaoeFinanceira
    family: e-financeira
    title: e-Financeira — Exclusão da e-Financeira
    version: 1.0.0
    status: draft
    periodicity: eventual
    appliesTo:
      institutionTypes: [IP, SCD, SCFI]
    summary: >-
      Exclusão de uma abertura ainda sem fechamento, da e-Financeira ou de Repasse, e
      de todo evento de movimento ou de repasse enviado depois dela, pelo recibo de
      entrega da abertura. A Receita confere que a abertura existe e está ativa.

  - id: br.bcb.scr-3040
    path: br/bcb/scr-3040
    country: BR
    regulator: BCB
    document: "3040"
    family: scr
    title: SCR Documento 3040 - Dados Individualizados de Risco de Crédito
    version: 1.0.0
    status: draft
    periodicity: monthly
    appliesTo:
      institutionTypes: [SCD, SCFI]
    summary: >-
      Remessa mensal ao SCR com cada cliente, as operações dele, os vencimentos, as garantias e as
      informações adicionais de aquisição e reestruturação, a partir do dataset que o Lender publica.
